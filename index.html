/* The whole horizon is computed (fairness needs it) but only FOUR WEEKS are published on this
   page — beyond that the allocation is still free to move, and showing it would break the
   promise that what people see doesn't change under them (Ali, 31 Jul). The ROTA TEAM sees the
   whole horizon once they're through the shield, on the Look ahead page: draft weeks, clearly
   not a promise.

   The window is WEEK-ALIGNED (Ali, 6 Aug): this week plus the next three, so it runs Monday to
   Sunday and only moves on a Monday. It used to be a rolling today+28, which was wrong in two
   ways nobody could have named but everybody would have felt — the fourth week was drawn half
   in names and half in dashes, and the edge crept forward every single day, so the horizon you
   looked at on Monday was not the one you got on Friday. Four whole weeks, changing once a
   week, is what "published four weeks ahead" actually means.

   Week-aligned is always INSIDE the allocator's four-week pin (a Monday is 27 days from the
   Sunday of week+3, never more than 28), so nothing published can be reshuffled under anybody.
   That relationship is the whole safety of this: if PUB_WEEKS ever grows past 4, the pin
   horizon in consultant_rota.py must grow with it, or the page will publish days the allocator
   still considers free. */
/* Four is the default, not the law — it is a setting on Setup now, because how far ahead the ward
   sees is a rota-team decision and not a thing that should need a code change (rule 1). It is read
   through a getter rather than captured once, so changing it redraws everything that depends on it
   without a reload.

   PUB_MIN is the floor, and it is the important half. Raising the number publishes more, which is
   only ever safe. LOWERING it would take back weeks people have already been shown — precisely the
   promise the freeze exists to keep — so the store remembers the highest it has ever been and the
   control will not go under it. */
const PUB_DEFAULT = 4;
Object.defineProperty(window, "PUB_WEEKS", {
  get(){ const v = (CR() || {}).pubWeeks; return (typeof v === "number" && v >= 1) ? v : PUB_DEFAULT; }
});
Object.defineProperty(window, "PUB_MIN", {
  get(){ const v = (CR() || {}).pubHighWater; return (typeof v === "number" && v >= 1) ? v : PUB_WEEKS; }
});
const pubUntil = () => addDays(mondayOf(new Date().toISOString().slice(0, 10)), PUB_WEEKS * 7 - 1);
function teamUnlocked(){
  try { if (sessionStorage.getItem("consTeamUnlocked") === "1") return true; } catch(e){}
  return !!(data && !data.staffPw);
}
function cellHTML(rec, key, d){
  /* The dash said "published four weeks ahead" in fixed text while the number beside it was a
     setting — so after 28 Aug, when the window could be changed, the page was telling people
     something that was simply not true. It reads the setting now. */
  if (d > pubUntil() && !teamUnlocked()) return "<div class='cellwrap'><span class='cell empty' title='" +
    esc("Cover is shown " + PUB_WEEKS + " week" + (PUB_WEEKS === 1 ? "" : "s") + " ahead — to " + fmt(pubUntil())) +
    "'>—</span></div>";
  /* `rec.cur` and `rec.auto` are read defensively, and it is not paranoia (found 11 Aug). The
     guard used to be `rec && rec.cur[key]`, which checks the RECORD exists and then trusts that it
     has a `cur` — so one day in the store missing either half threw, and because every cell is
     built in one pass, that took the WHOLE BOARD down, not the day. A rota nobody can see because
     of one malformed record is a far worse failure than a rota with one blank cell. */
  const rc = (rec && rec.cur) || {}, ra = (rec && rec.auto) || {};
  const cur = rc[key] || "", auto = ra[key] || "";
  const diff = rec && cur !== auto;
  const fin = (rc.fin || {})[cur];
  const isCod = cur && rc.cod === cur && "ABCDE".includes(key);
  const podCell = "ABCDE".includes(key);
  /* Ghost pills (Ali, 1 Aug — variant 6): initials lead at the shared inset; the badge is an
     OUTLINE-ONLY pill pinned to the cell's right edge, light enough not to fight the name.
     Still the drag handle it always was. */
  let pills = "";
  if (isCod) pills += "<span class='codpill' draggable='true' data-d='" + d + "' title='COD — drag onto another pod on this day to hand over referrals'>COD</span>";
  if (fin && cur && !isCod){
    /* 17:00 is the normal finish, so it isn't drawn — only the exception gets a pill. The pill is
       a thing you can pick up, exactly like COD: drop it on another pod and the two consultants
       swap finish times without anybody changing pods. */
    const t = fin.slice(0,2) === "17" ? "" : fin.slice(0,2) === "18" ? "18" : fin;
    if (t) pills += "<span class='finpill' draggable='true' data-d='" + d + "' data-k='" + key + "' title='finishes " + fin + " — drag onto another pod on this day to swap finish times'>" + esc(t) + "</span>";
  }
  /* The badges ride the initials themselves — corner-anchored inside the cell span, so they
     travel with the name, and the pill column to the right stays COD's and the finish time's.
     Hard rule 6 holds throughout: the badges say what changed and where somebody was, never why. */
  let badges = "";
  const chg = chgFor(d, key, cur);
  if (chg) badges += "<span class='chgpill" + (chg.short ? " short" : "") + "' title='" + esc(chg.title) + "'>" + (chg.kind === "new" ? SVG_PLUS : SVG_SWAP) + "</span>";
  if (diff) badges += "<span class='ofspill' title='" +
    esc(cur ? (auto ? "Differs from the rota sheet — sheet has " + nameOf(auto) : "Not on the rota sheet — added by hand")
            : "Rota sheet has " + nameOf(auto) + " — taken off the board") + "'>" + SVG_PEN + "</span>";
  return "<div class='cellwrap'>" +
    "<span class='cell" + (cur ? "" : " empty") + "' data-d='" + d + "' data-k='" + key + "'" +
    (cur && podCell ? " draggable='true'" : "") + " title='" +
    esc(nameOf(cur) || "nobody assigned") + (fin ? " · finishes " + fin : "") +
    (cur && podCell ? " · drag onto another pod to swap" : "") + "'>" + (esc(cur) || "—") + badges + "</span>" + pills + "</div>";
}

/* The chips' glyphs. The swap arrows are byte-for-byte the resident board's move-mark glyph
   (26.08.22), so a person who has learned one board has learned the other. */
const SVG_SWAP = '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M7 4 4 7l3 3"/><path d="M4 7h11a5 5 0 0 1 5 5"/><path d="M17 20l3-3-3-3"/><path d="M20 17H9a5 5 0 0 1-5-5"/></svg>';
const SVG_PLUS = '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 5v14M5 12h14"/></svg>';
const SVG_PEN  = '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M4 20h4L18.5 9.5a2.828 2.828 0 1 0-4-4L4 16v4"/><path d="M13.5 6.5l4 4"/></svg>';

/* WHAT CHANGED HERE, AND RECENTLY — one answer built from two sources, the same split the marks
   used to wear as two different outfits (the dashed ring for the sync, nothing at all for a hand
   move made after you looked):
   1. The log, for hand-made changes. Only entries carrying structured fields (`d.to` names the
      slot) are trusted — pattern-matching message text is how the old Log tab quietly hid
      entries. 48 hours, so the mark ages out by itself, exactly like the resident board's.
   2. `prev`, for what the last nightly sync moved. No time filter — the next sync rewrites it,
      which is its own expiry, and it was already the ring's rule.
   A hand move outranks the sync when both say something: the log is newest-first, and a person
   acting after the sync is the later fact.
   `short` is the same fact with the clock running out: the change landed inside 24 hours of the
   shift starting (08:00 board day). That is the one every trainee asked for — "the trainees need
   to know theres been a short notice swap" (Ali, 26.08.20). */
function chgFor(d, key, cur){
  const H48 = 48 * 3600e3;
  const now = Date.now();
  const dayStart = Date.parse(d + "T08:00:00");
  const mk = (kind, from, when, who) => {
    const t = Date.parse(when);
    const short = isFinite(t) && isFinite(dayStart) && t >= dayStart - 24 * 3600e3 && t <= dayStart + 24 * 3600e3;
    const when2 = isFinite(t) ? new Date(t).toLocaleDateString("en-GB", { weekday: "short", day: "numeric", month: "short" })
      + " " + new Date(t).toLocaleTimeString("en-GB", { hour: "2-digit", minute: "2-digit" }) : "";
    const fromTxt = kind === "new" ? "Added" + (short ? " at short notice" : " in the last 48h")
      : (short ? "Moved here at short notice" : "Moved here in the last 48h") + (from ? " — was " + (from.length === 1 ? "Pod " + from : from) : "");
    return { kind, short, title: fromTxt + (when2 ? " · " + when2 : "") + (who ? " · by " + who : "") };
  };
  if (!cur) return null;
  for (const e of (cdata && cdata.log) || []) {
    if (e.on !== d || !e.d || e.d.to !== key || e.d.subj !== cur) continue;
    const t = Date.parse(e.t);
    if (!isFinite(t) || now - t > H48) continue;
    return mk(e.d.bench ? "new" : "move", e.d.from || "", e.t, String(e.who || "").replace(/\s*\(.*\)$/, ""));
  }
  const prev = ((CR() || {}).prev || {})[d];
  if (prev && (prev[key] || "") !== cur)
    return mk(prev[key] ? "move" : "new", prev[key] ? nameOf(prev[key]) : "", (CR() || {}).prevAt || "", "the sync");
  return null;
}

/* One week as a table. Pods run across the top and days down the side — the same shape as the
   resident board, so nobody has to rotate the rota in their head moving between the two pages.
   Each pod column wears the identical solid colour bar. Residents, when shown, sit inside their
   pod's cell for the day; night residents sit under the on-call consultant, who covers the same
   hours.

   Pulled out of renderRota on 6 Aug so the Look ahead page can draw the same week the same way.
   A second, near-identical table builder is how two views of one rota start disagreeing about
   what a COD pill looks like. */
function weekTableHTML(mondayISO){
  const cons = (CR() || {}).days || {};
  const dates = Array.from({length:7}, (_, i) => addDays(mondayISO, i));
  let h = "<table class='rota'><tr><th></th>";
  for (const [p, label, barcol] of PODROWS) h += "<th class='podth' style='border-top:3px solid " + barcol + "'>" + label + "</th>";
  h += "<th>On call</th><th>Fairfield</th></tr>";
  dates.forEach((d, i) => {
    const j = showJun ? juniorsFor(d) : null;
    /* A day the sync could not resolve is marked on the day itself, because the day is where the
       fix happens — the attention page can only send you here. The CSS shows it only inside
       body.teamopen: everyone can see the day, but only the rota team can do anything about it,
       and an amber warning you cannot act on is just alarming (Ali, 8 Aug). */
    /* `col-X` on every cell, and `day-<iso>` on the row. Both exist for the PHONE: the desktop
       table is read by position, but once it reflows there are no column headings left, so each
       card has to say what it is (`td.col-A::before`) and the day strip has to be able to find
       one row and show it. Costs nothing on desktop and saves a second markup path. */
    /* WHAT THE LAST SYNC MOVED (Ali, 11 Aug: "find a way to highlight any changes on the allocator
       (a coloured outline or something)"). `prev` is the photograph the allocator takes of every
       day before it touches anything — the same one the Undo control restores from. Comparing
       against it is the only honest definition of "changed": not changed since it was written,
       not changed since you last looked, but moved by the run that just happened.
       Marked per CELL rather than per day, because "Wednesday changed" is nearly useless and
       "Pod C changed on Wednesday" is what somebody needs. */
    const needs = " class='dayrow day-" + d + (cons[d] && cons[d].alert ? " needs" : "") + "'";
    /* A DAY BEING HELD. `pinned` used to be invisible everywhere — the allocator skipped the day
       and the board gave no sign, so the one place you would look to understand why a day never
       moves said nothing. A day is the unit that gets pinned, so the mark goes on the day, not in
       each of its five cells. */
    const held = cons[d] && cons[d].pinned
      ? "<span class='heldpill' title='held to the version that was circulated'>held</span>" : "";
    /* Day name over date, the resident board's order and its class names (.dn / .d) — see the
       CSS. The `held` pill follows both, so it sits under the date rather than beside it. */
    h += "<tr" + needs + "><td class='rowh'><div class='dn'>" + DAYS[i].toUpperCase() + "</div>" +
         "<div class='d'>" + fmt(d) + "</div>" + held + "</td>";
    /* What the last sync moved is now told by the cell's own change chip (chgFor reads `prev`),
       so the td carries no mark of its own — one fact, one place. */
    for (const [p] of PODROWS)
      h += "<td class='col-" + p + "' style='background:var(--pod" + p + ")' data-date='" + d + "' data-pod='" + p + "'>" + cellHTML(cons[d], p, d) + (j ? resPills(j.pods[p]) : "") + "</td>";
    h += "<td class='col-oncall' data-date='" + d + "'>" + cellHTML(cons[d], "oncall", d) + (j ? resPills(j.night) : "") + "</td>";
    h += "<td class='col-fgh" + ((cons[d] && (cons[d].cur || {}).fgh) ? "" : " empty") + "' data-date='" + d + "'>" + cellHTML(cons[d], "fgh", d) + "</td></tr>";
  });
  return "<div class='daystrip-slot'></div>" + h + "</table>";
}

/* THE DAY STRIP LIVES IN core.js NOW — dayStrip(), shared with the Pod Board.
   Ali, 10 Aug, told that the two boards had two different strips: "tey dont need to be thoguh do
   they, and shiould be." They did not, and they should be. What used to be here was this page's
   own dayStripHTML: seven small two-line pills, no status dots, weekend greyed. The Pod Board had
   a scrolling strip of wide pills WITH dots. Nobody chose that split; it just happened, the way
   two copies of anything drift.

   This page builds its grid as a string, and dayStrip() returns a real element, so the string
   leaves a slot behind and wireGrid puts the component into it. That is the only reason the slot
   exists — it is not a placeholder for anything else. */
/* WHICH DAY THE PHONE IS SHOWING, and which week that choice was made for.

   It used to be a bare `let mobileDay = 0`, so the phone always opened on the Monday of whatever
   week was drawn — on a Tuesday you opened the board and read Monday's consultants. The day strip
   marked today correctly, but the SELECTED day was Monday, so it looked entirely normal while
   answering the commonest question on the page wrongly (Ali, 11 Aug: "should open on today not a
   monday thats gone").

   Remembering the week alongside the day is what stops the fix fighting the user: land on today
   when the week containing today is drawn, land on Monday for any other week, and once somebody
   has picked a day, leave their choice alone until the week changes. */
let mobileDay = 0, mobileDayFor = "";

function renderRota(){
  const dates = Array.from({length:7}, (_, i) => addDays(curWeek, i));
  /* The year drops to the second line instead of trailing the dates. The Pod Board puts its
     "tap to pick a date" hint there; this page has no date picker, so it must not borrow that
     wording — a subtitle that offers something the page cannot do is worse than no subtitle. The
     year is the honest thing to put in the space, and it takes the clutter off the title. */
  const _yr = document.createElement("small");
  _yr.textContent = String(new Date(dates[6] + "T12:00:00").getFullYear());
  $("#weekTitle").textContent = fmt(curWeek) + " – " + fmt(dates[6]);
  $("#weekTitle").append(_yr);
  const _now = $("#btnToday");
  if (_now) {
    const _today = new Date();
    const _iso = _today.getFullYear() + "-" +
      String(_today.getMonth() + 1).padStart(2, "0") + "-" +
      String(_today.getDate()).padStart(2, "0");
    const isNow = curWeek === mondayOf(_iso);
    _now.setAttribute("aria-current", isNow ? "true" : "false");
    _now.title = isNow ? "You are on this week" : "Jump back to this week";
    document.body.dataset.week =
      isNow ? "now" : (curWeek > mondayOf(_iso) ? "ahead" : "past");
  }
  /* The week arrows grey at the edge of the data rather than silently doing nothing — the
     resident board's rule (26.08.20): "a control that vanishes is a bug to the person looking
     for it", and one that presses without answering is worse. Same list shiftWeek consults, so
     the greying and the refusal cannot disagree. Look ahead's arrows have done this all along. */
  $("#btnPrev").disabled = !canStepWeek(-1);
  $("#btnNext").disabled = !canStepWeek(1);
  /* THE READ FAILED. Said here, in place of the grid, because an empty grid is indistinguishable
     from a quiet week and the whole fault was that nothing on screen admitted it. Not on Attention:
     that is behind the shield, and somebody who cannot load the cover cannot be assumed to have
     got through it. */
  if (coverLoadFailed) {
    $("#weekGrid").innerHTML = "<div class='card' style='text-align:center;padding:2.4rem 1rem'>" +
      "<b style='display:block;font-size:.95rem'>The cover didn't load</b>" +
      "<span style='color:var(--muted);font-size:.85rem;display:block;margin-top:.35rem'>" +
      "This is a connection problem, not a change to the rota. Nothing on the board can be edited " +
      "until it loads. Try again in a moment.</span>" +
      "<button class='btn sec' id='btnReload' style='margin-top:1rem'>Try again</button></div>";
    const rb = $("#btnReload"); if (rb) rb.onclick = () => location.reload();
    return;
  }
  let h = weekTableHTML(curWeek);
  /* If the cover on screen was worked out from anything other than the live rota, that goes
     ABOVE the grid, not on a settings page nobody opens. Every name below is only as right as
     the workbook it came from, and a board built on a copy from last week looks identical to
     one built this morning — which is exactly how this went unnoticed for a fortnight. */
  const _src = (CR() || {}).source || {};
  if (!_src.name) {
    const when = _src.sheetUntil ? " It reads to " + fmt(_src.sheetUntil) + "." : "";
    h = "<div class='stalebar'><b>This cover was not worked out from the live rota.</b> " +
        "The consultant rota could not be fetched from SharePoint, so everything below comes " +
        "from the copy kept with the code." + when +
        " If the rota has been republished since, these allocations are out of date." +
        (_src.fetchError ? "<span class='why'>" + esc(_src.fetchError) + "</span>" : "") +
        "</div>" + h;
  }
  $("#weekGrid").innerHTML = h;
  wireGrid($("#weekGrid"));
}

/* Every handler a drawn week needs, bound to whatever container it was drawn into. Pulled out
   of renderRota on 6 Aug alongside weekTableHTML: the Look ahead page draws real, editable weeks
   and must behave identically, and a copy of this block would drift the first time a drop rule
   changed. Called after every innerHTML — the handlers are on the elements, not delegated, so
   they die with the markup that carried them. */
function wireGrid(root){
  /* The day strip. Redrawing the whole grid to change which day shows would throw away the drag
     handlers and any open cell, so picking a day moves classes and re-draws the strip alone.

     The dates and the attention flag are both read back off the rows rather than passed in: the
     rows already carry data-date, and weekTableHTML has already worked out which days need
     attention and marked them `needs`. Deriving both from the DOM means the two callers of
     wireGrid — this page and Look ahead — need no new argument, and there is no second copy of
     "which days are a problem" to fall out of step with the first. */
  const rows = Array.from(root.querySelectorAll("tr.dayrow"));
  const dates = rows.map(r => { const c = r.querySelector("td[data-date]"); return c ? c.dataset.date : ""; });
  /* First draw of a week decides which day it opens on: today if today is in it, Monday otherwise.
     Keyed on the week so a day the user has picked survives a redraw — a save redraws the grid, and
     snapping back to today every time somebody edited Thursday would be its own small madness. */
  const _wk = dates[0] || "";
  if (_wk && _wk !== mobileDayFor) {
    const ix = dates.indexOf(new Date().toISOString().slice(0, 10));
    mobileDay = ix >= 0 ? ix : 0;
    mobileDayFor = _wk;
  }
  const showDay = () => rows.forEach((r, i) => r.classList.toggle("mday", i === mobileDay));
  const drawStrip = () => {
    const slot = root.querySelector(".daystrip-slot, .daystrip");
    if (!slot || typeof dayStrip !== "function") return;
    slot.replaceWith(dayStrip(dates, mobileDay, {
      dot: (iso, i) => rows[i] && rows[i].classList.contains("needs") ? "soft" : "ok",
      onPick: i => { mobileDay = i; showDay(); drawStrip(); }
    }));
  };
  drawStrip();
  showDay();
  /* ── TAP ONE, TAP THE OTHER (Ali, 11 Aug) ────────────────────────────────────────────────────
     Swapping pods, handing over COD and swapping finish times were all HTML5 drag and drop and
     nothing else: no touchstart, no pointerdown, anywhere in this file. So the one edit deliberately
     left open to any consultant without unlocking — "carry your badge onto another pod" — did not
     exist on a phone, which is what most consultants will open this on. The affordance was a
     `title` tooltip, which does not exist on touch either.

     Drag still works and is untouched; this is the second way in, and it is the same gesture on
     both: tap a name to pick it up, tap another to put it down. Tapping the armed one again opens
     the dropdown, which is how you REPLACE somebody rather than swap them — the old tap-anywhere
     dropdown could only ever set one slot, so using it to move somebody left them in two pods at
     once. Nothing here writes anything the drag path did not already write. */
  root.querySelectorAll(".cell[data-d]").forEach(c => c.onclick = () => tapCell(c.dataset.d, c.dataset.k, c));
  root.querySelectorAll(".codpill").forEach(p => p.onclick = e => { e.stopPropagation(); tapPill("cod", p.dataset.d, ""); });
  root.querySelectorAll(".finpill").forEach(p => p.onclick = e => { e.stopPropagation(); tapPill("fin", p.dataset.d, p.dataset.k); });
  /* The change chips speak when tapped — the same words the hover title carries, because a title
     is a desktop affordance and the chips must mean something on a phone (hard rule 14). The words
     appear IN A BUBBLE AT THE BADGE, not in the bottom toast — the eye is on the badge that was
     just tapped, and a message at the foot of the screen is where nobody is looking (Ali,
     26.08.28: "people wont see it at bottom of screen"). The bubble is the hovercard the resident
     pills already use, so it is one positioning rule for everything that pops up by a name.
     Tapping a chip must never fall through to the cell underneath and start an edit. */
  root.querySelectorAll(".chgpill, .ofspill").forEach(p => p.onclick = e => { e.stopPropagation(); chipTip(p); });
  /* THE WHOLE CARD IS THE TARGET ON A PHONE (Ali, 26.08.28: "there needs to be a bigger area on
     phone you can tap on, not just the initials"). On the phone layout every slot is a full-width
     card and the initials are a 60px span inside it; a thumb aims at the card, so blank card
     space forwards to the card's own cell — the identical action, nothing new to learn. Anything
     interactive inside (the cell, the pills, the badges, a resident pill, an open dropdown)
     already answers for itself and is excluded, so nothing fires twice. Checked at tap time
     rather than wired per-breakpoint, so a rotated tablet gets whichever answer its width earns.
     Desktop keeps precise clicking: on a wide grid a stray click on a cell's background arming a
     swap would be a misfire, not a favour. */
  root.querySelectorAll("td[data-date]").forEach(td => td.addEventListener("click", e => {
    if (window.innerWidth > 760) return;
    if (e.target.closest(".cell,.codpill,.finpill,.chgpill,.ofspill,.rpill,select,button,a")) return;
    const c = td.querySelector(".cell[data-d]");
    if (c) c.click();
  }));
  /* The grid is rebuilt from a string on every render, so the class is gone even though the state
     is not. Re-applied here rather than cleared, or a save would silently put down what you had
     just picked up. */
  paintArmed();
  /* Badge drag: a consultant carries their badge onto another pod and the two exchange pods.
     This is the ONE edit open to any consultant without unlocking — everything else is rota-master. */
  /* Locked means locked AT THE GESTURE, not three steps later (17 Aug). Cancelling the dragstart
     stops the badge ever leaving its cell, so there is no drag to interpret as a promise, and
     offerEdit puts the unlock in front of the person who just asked for it. See offerEdit. */
  const gate = e => { if (EDIT_MODE) return false; e.preventDefault(); offerEdit(); return true; };
  root.querySelectorAll(".cell[draggable='true']").forEach(c => {
    c.ondragstart = e => { if (gate(e)) return; e.dataTransfer.setData("text/pod", c.dataset.d + "|" + c.dataset.k); e.dataTransfer.effectAllowed = "move"; };
  });
  /* COD pill drag: hand referrals to whoever covers the pod you drop it on (same day). */
  root.querySelectorAll(".codpill").forEach(pill => {
    pill.ondragstart = e => { if (gate(e)) return; e.dataTransfer.setData("text/cod", pill.dataset.d); e.dataTransfer.effectAllowed = "move"; };
  });
  /* Finish pill drag: swap who stays late without moving anybody between pods. */
  root.querySelectorAll(".finpill").forEach(pill => {
    pill.ondragstart = e => { if (gate(e)) return; e.dataTransfer.setData("text/fin", pill.dataset.d + "|" + pill.dataset.k); e.dataTransfer.effectAllowed = "move"; };
  });
  /* Resident profile cards on hover — text only, and only what the store actually holds. */
  root.querySelectorAll(".rpill[data-rid]").forEach(pl => {
    pl.onmouseenter = () => showCard(pl, pl.dataset.rid);
    pl.onmouseleave = hideCard;
  });
  root.querySelectorAll("td[data-pod]").forEach(td => {
    td.ondragover = e => {
      const t = e.dataTransfer.types;
      if (t.includes("text/cod") || t.includes("text/pod") || t.includes("text/fin")) { e.preventDefault(); td.classList.add("dropok"); }
    };
    td.ondragleave = () => td.classList.remove("dropok");
    td.ondrop = e => {
      td.classList.remove("dropok");
      const finD = e.dataTransfer.getData("text/fin");
      if (finD){
        e.preventDefault();
        const [fd, fk] = finD.split("|");
        if (fd !== td.dataset.date) { toast("Swap within the same day"); return; }
        if (fk === td.dataset.pod) return;
        const rec = ((CR() || {}).days || {})[fd]; if (!rec) return;
        if (!rec.cur[td.dataset.pod]) { toast("Drop on a pod with someone to take the finish"); return; }
        requireEdit(() => applyFinSwap(fd, fk, td.dataset.pod));
        return;
      }
      const pod = e.dataTransfer.getData("text/pod");
      if (pod){
        e.preventDefault();
        const [pd, pk] = pod.split("|");
        if (pd !== td.dataset.date) { toast("Swap within the same day"); return; }
        if (pk === td.dataset.pod) return;
        const rec = ((CR() || {}).days || {})[pd];
        if (!rec) { toast("Nothing is allocated on that day yet"); return; }
        if (!rec.cur[td.dataset.pod]) { toast("Drop on a pod with someone to swap with"); return; }
        /* requireEdit, NOT ensureWho (17 Aug). This one line was the odd one out: the COD drop and
           the finish-time drop both asked whether the page was unlocked, and the pod drop — the
           commonest gesture on the board — skipped straight to asking for a name. Three drags, two
           different rules, which is exactly the "rule enforced in one code path and not another"
           this file has been bitten by before. requireEdit calls ensureWho on the way through, so
           nothing is lost. */
        requireEdit(() => ensureWho(() => applySwap(pd, pk, td.dataset.pod)));
        return;
      }
      const d = e.dataTransfer.getData("text/cod");
      if (!d || d !== td.dataset.date) { if (d) toast("Drop it on another pod on the same day"); return; }
      e.preventDefault();
      const rec = ((CR() || {}).days || {})[d]; if (!rec) return;
      const target = rec.cur[td.dataset.pod];
      if (!target) { toast("No consultant on that pod to take COD"); return; }
      if (target === rec.cur.cod) return;
      /* Referrals only. Pod E stays where it is — see the note beside editBlocked: pairing them is
         the allocator's output, not a rule the page enforces on somebody who has decided otherwise. */
      requireEdit(() => applyEdit(d, "cod", target, "COD handed to " + target + " (Pod " + td.dataset.pod + ")"));
    };
  });
}

/* ── LOOK AHEAD — the rota team's view past the published edge (Ali, 6 Aug) ────────────────────
   "There should be 3 weeks visible for people plus the current week. Behind the rota team shield
   there should be a separate admin page where admin can look past this to the end of the rota
   date and see what's coming up."

   Every week the COVER STORE holds, from this Monday to the last one, one after another. The
   weeks come from the store's own days and NOT from weeksAvail(), which reads data.weeks — the
   RESIDENT rota. That distinction is the entire reason this page exists: unlocking the shield
   already revealed the draft cells, but the week arrows on the Pods grid are bounded by the
   resident rota's weeks, so an admin could unlock and still not reach a single week the resident
   rota hadn't been published for. The consultant workbook runs months further out. Nobody would
   have called that a bug; it just quietly looked like the rota ended early.

   Weeks are editable here, exactly as on the Pods grid — same cells, same drags, same Edit
   button, because they ARE the same code. Worth knowing what that means: an edit to a draft week
   is a manual override, so it survives the nightly re-run and pins that placement early, before
   the allocator has finished balancing the year. Fine when you mean it. */
function aheadWeeks(){
  const days = Object.keys(((CR() || {}).days) || {}).sort();
  if (!days.length) return [];
  const from = mondayOf(new Date().toISOString().slice(0, 10));
  const last = mondayOf(days[days.length - 1]);
  const out = [];
  for (let m = from; m <= last; m = addDays(m, 7)) out.push(m);
  return out;
}

/* Look ahead is THE PODS PAGE — the same grid, the same arrows, the same everything — that simply
   keeps going past the four-week edge (Ali, 6 Aug: "the look ahead should be identical to the pods
   apge but just cycle past the 4 week lock"). It was a long scroll of every week stacked up, which
   answered "what does the whole horizon look like" — a question nobody had asked. What the rota
   team actually does is page forward a week at a time exactly as they do on Pods, and want the
   arrows not to stop at week four.
   So the only differences from Pods are the two that matter: its weeks come from the COVER STORE
   rather than the resident rota, and it is behind the shield, so cellHTML shows the draft weeks
   instead of dashes. */
let aheadWeek = null;

function renderAhead(){
  const grid = $("#ahGrid"); if (!grid) return;
  const wks = aheadWeeks();
  const box = $("#aheadBox");
  if (!wks.length){
    $("#ahTitle").textContent = "";
    grid.innerHTML = "<p style='padding:1rem;color:var(--muted)'>The cover store holds no allocated days yet.</p>";
    if (box) box.innerHTML = "";
    return;
  }
  if (!aheadWeek || !wks.includes(aheadWeek)) aheadWeek = wks[0];
  const sun = addDays(aheadWeek, 6);
  const draft = sun > pubUntil();
  $("#ahTitle").textContent = fmt(aheadWeek) + " – " + fmt(sun) + " " + new Date(sun + "T12:00:00").getFullYear();
  $("#ahChip").className = "ahchip" + (draft ? "" : " pub");
  /* Ghost first, always the long label: it sets the width so the Next arrow never moves. */
  $("#ahChip").innerHTML = '<span class="ghost">EVERYONE SEES THIS</span><span>'
    + (draft ? "DRAFT" : "EVERYONE SEES THIS") + '</span>';
  $("#ahChip").title = draft
    ? "Past the four weeks that are published — still free to move, and nobody has been shown it"
    : "Inside the published four weeks — this is what everyone can already see";
  const i = wks.indexOf(aheadWeek);
  $("#ahPrev").disabled = i <= 0;
  $("#ahNext").disabled = i >= wks.length - 1;
  grid.innerHTML = weekTableHTML(aheadWeek);
  wireGrid(grid);

  /* Under the grid, the whole horizon at a glance — see .ahbar in the stylesheet for why this
     is a ribbon rather than a paragraph. */
  const endsAt = addDays(wks[wks.length - 1], 6);
  const heldList = draftOverrides();
  const held = heldList.length;
  const heldWk = new Set(heldList.map(o => mondayOf(o.d)));
  if (box) {
    const segs = wks.map((m, n) => {
      const cls = (heldWk.has(m) ? "held" : n < PUB_WEEKS ? "live" : "") +
                  (m === aheadWeek ? " now" : "");
      return "<span" + (cls.trim() ? " class='" + cls.trim() + "'" : "") + "></span>";
    }).join("");
    box.innerHTML = "<div class='card ahbar' style='margin-top:1rem'>" +
      "<div class='top'>" +
        "<b style='font-size:.95rem'>Week " + (i + 1) + "</b>" +
        "<span style='font-size:.8rem;color:var(--muted)'>of " + wks.length + " · to " +
          fmt(endsAt) + " " + new Date(endsAt + "T12:00:00").getFullYear() + "</span>" +
        (held ? "<span class='heldchip'>" + held + " held by hand</span>" : "") +
        "<button class='btn sec' id='btnRedraft'" + (held ? "" : " disabled") +
          " style='margin-left:auto'>Re-run drafts</button>" +
      "</div>" +

        "<span><i style='background:var(--podAb)'></i>live</span>" +
        "<span><i style='background:var(--hair)'></i>draft</span>" +
        (held ? "<span><i style='background:var(--amber)'></i>held by hand</span>" : "") +

function shiftAhead(n){
  const wks = aheadWeeks();

/* ── RE-RUNNING THE ALGORITHM ON THE DRAFT WEEKS ───────────────────────────────────────────────
   Ali, 6 Aug: "can you give me a button to rerun allocations with the algorithm for the publically
   unviewable part?"

   Be clear about what this does, because the honest version and the literal one are not the same
   thing. The allocator is Python — it reads the workbook off SharePoint and runs nightly in an
   Action; a browser cannot run it and should not be trusted with a token that could. So this
   button does not compute an allocation itself.

   What it does is the thing that was actually stopping the algorithm: it releases the draft weeks.
   Every day carries `auto` (what the algorithm said) and `cur` (what stands). The sync only lets
   `cur` follow the sheet while the two agree — the moment a human changes one, that placement is
   theirs and survives every future run, for ever, which is right for a day people have seen and
   wrong for a draft nobody has. So a hand-edit in week nine silently freezes week nine. This drops
   those edits back to `auto`, and tonight's sync then has a free hand over the whole draft again.

   Only days AFTER the published edge are touched. Anything four weeks out or nearer has been seen
   and promised, and nothing here may move it. */
function draftOverrides(){
  const days = ((CR() || {}).days) || {};
  const until = pubUntil();
  const out = [];
  for (const d in days){
    if (d <= until) continue;                       // published: promised, never touched here
    const rec = days[d]; if (!rec || !rec.auto || !rec.cur) continue;
    for (const k of ["A","B","C","D","E","oncall","cod","fgh"])
      if ((rec.cur[k] || "") !== (rec.auto[k] || "")) out.push({ d, k });
  }
  return out;
}

async function redraftDrafts(){
  const cons = CR(); if (!cons) return;
  if (!canSave()) { toast("Cover store not connected — nothing was saved"); return; }
  const held = draftOverrides();
  if (!held.length) { toast("Nothing held by hand in the draft weeks"); return; }
  const days = new Set(held.map(x => x.d));
  if (!confirm("Drop " + held.length + " hand-made placement" + (held.length === 1 ? "" : "s") +
      " across " + days.size + " draft day" + (days.size === 1 ? "" : "s") +
      ", so the algorithm decides them again?\n\nOnly weeks past the published four are affected — " +
      "nothing anybody has been shown will change. Tonight's sync reallocates them.")) return;
  ensureWho(async () => {
    for (const { d, k } of held) cons.days[d].cur[k] = cons.days[d].auto[k] || "";
    /* One log entry, not one per placement: this is a single decision by a person, and 40 rows
       saying "reverted" would bury the day's real changes. Logged as manual for the same reason —
       the software did not choose this, somebody pressed a button. */
    clog("Draft weeks handed back to the algorithm — " + held.length + " hand-made placement" +
         (held.length === 1 ? "" : "s") + " across " + days.size + " day" + (days.size === 1 ? "" : "s") +
         " after " + fmt(pubUntil()) + " dropped", "manual", null, " (Look ahead)");
    cdata.savedBy = localStorage.getItem("consEditor") || "?";
    state("saving");
    try { if (!await saveCover()) return; state("saved"); toast("Draft weeks released — the algorithm has them back"); }
    catch(e){ state("unsaved"); toast("Save failed — try again"); }
    renderAll();
  });
}

function renderFair(){
  /* One page for the whole picture (Ali, 31 Jul): career A&B-vs-C&D balance in the resident
     fairness table's visual language. Career counts include the pre-app running totals; the
     window counts cover only the weeks the app holds. Hover any figure for the counts.
     THE ON-CALL / COD / FAIRFIELD COLUMNS CAME OFF ON 28 AUG, the day Fairness went public in
     the rail (Ali: "fairness doesnt need to sho nubers of COD, on call, fairfield, thats a rota
     issue") — those are counts of what the four-monthly rota assigned, not of anything this
     board decides, and a public fairness page should carry only the fairness this board owns.
     The tallies are still computed: `rows` keeps people who ONLY appear on call or on Fairfield,
     so a consultant with no pod days yet does not vanish from the list. */
  const cons = CR() || {};
  const fair = cons.fair || {}, win = cons.window || {}, days = cons.days || {};
  const tal = {};
  const bump = (ini, k) => { if (!ini) return; (tal[ini] = tal[ini] || { oc:0, cod:0, fgh:0 })[k]++; };
  /* Pods per week: how many DIFFERENT pods each person held in each week they worked —
     1.0 means they sat in one pod all week, higher means they were moved about (Ali, 1 Aug). */
  const wkPods = {};
  for (const d in days){
    const cur = days[d].cur || {};
    const mon = mondayOf(d);
    for (const p of ["A","B","C","D","E"]) if (cur[p]) ((wkPods[cur[p]] = wkPods[cur[p]] || {})[mon] = wkPods[cur[p]][mon] || new Set()).add(p);
    bump(cur.oncall, "oc"); bump(cur.cod, "cod"); bump(cur.fgh, "fgh");
  }
  const podsPerWeek = i => { const wks = Object.values(wkPods[i] || {}); return wks.length ? wks.reduce((n, s2) => n + s2.size, 0) / wks.length : 0; };
  const weeksOf = i => Object.keys(wkPods[i] || {}).length;
  const inis = [...new Set([...Object.keys(fair), ...Object.keys(win), ...Object.keys(tal)])]
    .filter(i => !["FMCN","NET","AC","SF"].includes(i));
  const rows = inis.map(i => {
    const ab = ((fair[i] || {}).ab || 0) + ((win[i] || {}).ab || 0);
    const cd = ((fair[i] || {}).cd || 0) + ((win[i] || {}).cd || 0);
    const t = tal[i] || { oc:0, cod:0, fgh:0 };
    return { i, ab, cd, tot: ab + cd, pc: ab + cd ? Math.round(cd / (ab + cd) * 100) : null, t, ppw: podsPerWeek(i), wks: weeksOf(i) };
  }).filter(r => r.tot || r.wks || r.t.oc || r.t.cod || r.t.fgh)
    .sort((a,b) => b.tot - a.tot || nameOf(a.i).localeCompare(nameOf(b.i)));
  const dot = c => "<span class='dot' style='background:" + c + "'></span>";
  let out = "<table class='fair'><tr><th style='min-width:150px'>Name</th>" +
    "<th title='Career days on Pods A and B, including pre-app history'>" + dot("var(--podAb)") + dot("var(--podBb)") + "A&amp;B</th>" +
    "<th title='Career days on Pods C and D (neuro), including pre-app history'>" + dot("var(--podCb)") + dot("var(--podDb)") + "C&amp;D</th>" +
    "<th title='Share of career pod days on the neuro side'>% neuro</th>" +
    "<th title='Different pods per week, averaged over the weeks the app holds — 1.0 means the same pod all week'>Pods/wk</th></tr>";
  for (const r of rows){
    const abT = r.tot ? r.ab / r.tot : 0, cdT = r.tot ? r.cd / r.tot : 0;
    out += "<tr><td style='font-weight:600'>" + esc(nameOf(r.i)) + "<span class='inipill'>" + esc(r.i) + "</span></td>" +
      "<td title='" + r.ab + " career days on A&B' style='background:rgba(91,118,216," + (r.ab ? (0.05 + abT * 0.2).toFixed(3) : "0") + ")'>" + (r.ab || "") + "</td>" +
      "<td title='" + r.cd + " career days on C&D' style='background:rgba(201,138,43," + (r.cd ? (0.05 + cdT * 0.2).toFixed(3) : "0") + ")'>" + (r.cd || "") + "</td>" +
      "<td" + (r.pc != null && (r.pc < 40 || r.pc > 60) ? " class='warnpc'" : "") + ">" + (r.pc != null ? r.pc + "%" : "") + "</td>" +
      "<td title='" + r.wks + " week" + (r.wks === 1 ? "" : "s") + " with pod work'" + (r.ppw > 2 ? " class='warnpc'" : "") + ">" + (r.wks ? r.ppw.toFixed(1) : "") + "</td>" +
      "</tr>";
  }
  $("#fairBox").innerHTML = out + "</table>";
}


/* How the log is being read. Outside renderLog so the choice survives a redraw. */

/* The log is now drawn by the shared renderer in core.js — the resident board and this page had

function renderLog(){

function shortDate(iso){

/* Two grids now draw the same weeks from the same store — the Pods week and Look ahead — so
   anything that changes an allocation, or just what a cell shows, has to redraw both or the two
   views start disagreeing about the same day. Look ahead is only drawn when it's on screen: it
   can run to dozens of week tables and there is no reason to build them for a viewer who never
   gets through the shield. */
const aheadVisible = () => { const s = $("#tab-ahead"); return !!s && s.style.display !== "none"; };
function renderGrids(){ renderRota(); if (aheadVisible()) renderAhead(); }
function renderAll(){ renderGrids(); renderFair(); renderLog(); renderSetup(); paintAttnBadge(); updateFbCount(); }

function ensureWho(cb){
  const w = localStorage.getItem("consEditor");
  if (w) cb(w); else pickWho(cb);
}

const rowLabel = k => k.length === 1 ? "Pod " + k : k === "oncall" ? "on call" : k === "cod" ? "COD" : "Fairfield";

/* ── NO EDIT ENDS IN SILENCE — 17 Aug ───────────────────────────────────────────────────────────
   All three appliers opened with `const cons = CR(); if (!cons) return;` — a silent return sitting
   IN FRONT of the line that would have explained itself. So whenever the cover store had not
   loaded, a dragged badge simply went back where it came from and the page said nothing, which
   from the other side of the screen is indistinguishable from being ignored. Ali, 17 Aug: "when
   not in edit mode it allows you to drag but nothing sticks."
   canSave() is false when cdata is null, so it already covers both cases; asking it FIRST costs
   nothing and always speaks. The two cases are told apart because the fixes are different — one
   is reload the page, the other is a missing key that needs somebody's help. */
/* ── THE BOARD REPAINTS WHEN YOU LET GO, NOT WHEN SHAREPOINT AGREES — 17 Aug ────────────────────
   Ali, 17 Aug: "theres a massive delay after dragging before the swap actually appears 1-2
   seconds." Correct, and measured: every applier moved the people, then WAITED for the whole save
   round trip before calling renderAll(). The preflight read alone is ~0.9s and the post another
   ~0.6s, so the badge sat in its old pod for a second and a half after you let go of it.

   That is its own kind of "nothing sticks": the eye reads a stalled board as a rejected gesture,
   and the natural response is to do it again — which, for a swap, undoes it. The delay and the
   false failure were feeding the same mistake from different ends.

   Repainting up front makes it worse before it makes it better, too: the polling verify now waits
   up to ten seconds, so waiting for confirmation was never going to be an option.

   So the change goes on screen the moment it is made, with "Saving…" in the corner saying it is
   not yet safe, and saveOrPutBack redraws to put it back if the save is refused. That ordering is
   already the page's contract — the 12 Aug note above says a refused save must not leave the
   change on screen, and putting it back is exactly what that path does.

   renderGrids() rather than renderAll(): the grids are what somebody is looking at, and Fairness,
   the log and Setup can wait for the save they are describing. renderAll() still runs afterwards,
   so nothing goes unrefreshed — this just stops the board being the slowest thing on the page. */
function showChangeNow(){
  try { renderGrids(); } catch(e){ /* never let a paint failure lose the save that follows */ }
}

/* ── COD AND POD E ARE PAIRED BY THE ALLOCATOR, NOT WELDED TOGETHER — 17 Aug ────────────────────
   The sync always writes them onto the same person (`auto["E"] = cod` on a weekday, `= ld` at a
   weekend), and the Key says "Pod E — with the consultant of the day". It would be easy to read
   that as an invariant the page must enforce, and an earlier cut of this file did exactly that:
   every manual path re-pointed COD at whoever held Pod E.

   That was wrong, and Ali said so plainly (17 Aug): a manual action MAY separate them, and a
   manual action may put them back. The pairing is what the allocator produces, not a rule the
   ward has to live inside — somebody can take the referrals while somebody else keeps Pod E, and
   the page's job is to record that, not to argue with it.

   So nothing here forces them together. The COD pill hands referrals over on its own, exactly as
   the Key describes, and a pod swap carries COD with the PERSON because that is where it is held.
   Recorded because the wrong version was written first and the reasoning for it was superficially
   good; the reason it is wrong is that it takes a decision away from the person making it. */

function editBlocked(){
  if (!cdata) { toast("The cover hasn't loaded yet — nothing was changed. Reload the page."); return true; }
  if (!canSave()) { toast("Cover store not connected — nothing was saved"); return true; }
  return false;
}

async function applyEdit(d, k, ini, note){
  if (editBlocked()) return;
  const cons = CR();
  const shot = dayShot(cons, d);               // before the first mutation, including creating the day
  const blank = () => ({ A:"",B:"",C:"",D:"",E:"",oncall:"",cod:"",fgh:"",wkend:false,fin:{} });
  const rec = cons.days[d] || (cons.days[d] = { auto: blank(), cur: blank() });
  const who = localStorage.getItem("consEditor") || "?";
  const cur = rec.cur[k] || "";
  if (ini === cur) return;
  rec.cur[k] = ini;
  const flag = ini === (rec.auto[k] || "") ? "" : " (differs from rota sheet)";
  /* On call and Fairfield write the same structured rows a pod does — 28 Aug. They were left as
     sentences ("nobody moved pod"), which was true and also why a hand-changed on-call never
     carried a change chip: chgFor trusts only entries that name their slot in fields, the same
     rule that stopped the Log tab pattern-matching prose. A COD handover keeps its sentence —
     the pill moving IS its mark, and inventing a From for it would say more than is known. In
     the log's From/To chips the slot prints as its raw key; the sentence beside it carries the
     readable name. */
  const isSlot = "ABCDE".includes(k) || k === "oncall" || k === "fgh";
  if (note || !isSlot) {
    clog((note || ("Consultant swap " + d + " " + rowLabel(k) + ": " + (cur || "—") + " → " + (ini || "—"))) + flag,
         "manual", d, " (consultant page)");
  } else {
    /* TWO rows when one consultant replaces another, not one (Ali left this to me). A single row
       can only name one person, so the one who came OFF would leave no trace but a sentence —
       and "who stopped covering C on Tuesday" is exactly the question a log is opened to answer.
       Two rows cost nothing and neither person disappears. Departure logged first so that, newest
       first, the arrival reads above it. */
    if (cur) clog("Taken off " + rowLabel(k) + " on " + fmt(d) + ": " + nameOf(cur) + flag,
                  "manual", d, " (consultant page)", { act: "move", subj: cur, from: k, to: "" });
    if (ini) clog(nameOf(ini) + " covers " + rowLabel(k) + " on " + fmt(d) + flag,
                  "manual", d, " (consultant page)",
                  { act: "move", subj: ini, to: k, bench: !cur, from: "" });
  }
  /* CLEAR THE FLAG HERE, NOT OVERNIGHT. The sync also clears it, but the sync runs at night: fix a
     flagged day at 09:14 and the amber would sit there until the small hours, which teaches people
     that amber means nothing. So the moment the people on the day match the people the sheet
     expects, the flag goes — and if only half the job is done it stays, which is the point. */
  if (rec.alert && typeof rec.alert === "object") {
    const on = new Set(["A","B","C","D","E","oncall"].map(x => rec.cur[x]).filter(Boolean));
    const waiting = (rec.alert.new || []).filter(i => !on.has(i));
    const stillOn = (rec.alert.gone || []).filter(i => on.has(i));
    if (!waiting.length && !stillOn.length) {
      delete rec.alert;
      clog("Rota change on " + fmt(d) + " sorted out", "manual", d, " (consultant page)");
    }
  }
  cdata.savedBy = who;
  state("saving");
  showChangeNow();
  if (!await saveOrPutBack(cons, shot)) return;
  state("saved");
  toast("Saved — " + (ini || "cleared") + (ini === (rec.auto[k] || "") ? "" : " (flagged: differs from the rota sheet)"));
  renderAll();
}

/* A pod-to-pod swap: the two consultants exchange pods for that day. Finish time and COD are
   held against the person, not the pod, so both badges travel with them automatically. */
async function applySwap(d, k1, k2){
  if (editBlocked()) return;
  const cons = CR();
  const rec = (cons.days || {})[d];
  if (!rec) { toast("Nothing is allocated on that day yet"); return; }
  const a = rec.cur[k1] || "", b = rec.cur[k2] || "";
  if (!a || !b || a === b) { if (a !== b) toast("Both pods need somebody on them to swap"); return; }
  const shot = dayShot(cons, d);
  rec.cur[k1] = b; rec.cur[k2] = a;
  const who = localStorage.getItem("consEditor") || "?";
  /* One row per person, so the swap reads as the two moves it actually is and each consultant
     appears under their own name with their own pods. */
  const podk = k => "ABCDE".includes(k) ? k : "";
  clog(nameOf(a) + " moves to " + rowLabel(k2) + " on " + fmt(d), "manual", d, " (consultant page)",
       { act: "move", subj: a, from: podk(k1), to: podk(k2) });
  clog(nameOf(b) + " moves to " + rowLabel(k1) + " on " + fmt(d), "manual", d, " (consultant page)",
       { act: "move", subj: b, from: podk(k2), to: podk(k1) });
  cdata.savedBy = who;
  state("saving");
  showChangeNow();
  if (!await saveOrPutBack(cons, shot)) return;
  state("saved"); toast(a + " ↔ " + b);
  renderAll();
}

/* Swapping who stays late is agreed between two people, so the badge moves without the people
   moving. Finish times are held against the person, not the pod — the two swap values. */
async function applyFinSwap(d, k1, k2){
  if (editBlocked()) return;
  const cons = CR();
  const rec = (cons.days || {})[d];
  if (!rec) { toast("Nothing is allocated on that day yet"); return; }
  const a = rec.cur[k1] || "", b = rec.cur[k2] || "";
  if (!a || !b || a === b) { if (a !== b) toast("Both pods need somebody on them to swap"); return; }
  rec.cur.fin = rec.cur.fin || {};
  const fa = rec.cur.fin[a], fb = rec.cur.fin[b];
  if ((fa || "") === (fb || "")) { toast("Those two finish at the same time — nothing to swap"); return; }
  const shot = dayShot(cons, d);
  if (fb == null) delete rec.cur.fin[a]; else rec.cur.fin[a] = fb;
  if (fa == null) delete rec.cur.fin[b]; else rec.cur.fin[b] = fa;
  const who = localStorage.getItem("consEditor") || "?";
  clog("Finish swap " + d + ": " + a + " " + (fa || "17:00") + " ↔ " + b + " " + (fb || "17:00"),
       "manual", d, " (consultant page)");
  cdata.savedBy = who;
  state("saving");
  showChangeNow();
  if (!await saveOrPutBack(cons, shot)) return;
  state("saved"); toast("Finish times swapped");
  renderAll();
}

/* The display half of resident profiles: the store may hold an about line and an educational

/* A tapped change badge answers AT THE BADGE — the same hovercard, the same positioning maths,
   because the person's eye is on the thing they just tapped and a toast at the foot of the screen
   is where nobody is looking (Ali, 26.08.28). It clears itself after a few seconds, on the next
   tap anywhere, or on scroll — the same ways the resident hovercard goes away. */
function chipTip(el){

/* ── THE PERSON SHEET ───────────────────────────────────────────────────────────────────────────
   One tap on a name, and every move that name can make is a thumb-sized target. See the CSS above
   for why it exists at all.

   NOTHING HERE IS NEW BEHAVIOUR. Every control runs a function the drag path already ran —
   applySwap, applyFinSwap, applyEdit — so the sheet is a second door into the same room and can
   never drift away from what the board does. That was the rule the resident board followed and
   it is the reason its sheet has never had to be re-argued.

   WHAT COVER NEEDS THAT THE RESIDENT BOARD DOES NOT. A resident pod holds many people, so its
   tiles are bare letters. A Cover pod holds exactly ONE consultant, so the tile can say who —
   and it must, because tapping "D" is not "move me to D", it is "swap me with Natalie", and you
   should know that before you touch it rather than after.

   EVERY EXCHANGE NAMES BOTH SIDES, and a target that would do nothing is not offered (Ali,
   17 Aug: "doesnt say who its exchanging with - things are always done as a swap"). The finish
   row therefore lists only the people whose time actually differs: applyFinSwap returns without
   doing anything when the two times match, so offering them would be a button that lies. */
function closeSheet(){ const s = $("#sheetBg"); if (s) s.remove(); }
function podSheet(d, k){
  const rec = ((CR() || {}).days || {})[d]; if (!rec) return;
  const me = rec.cur[k] || ""; if (!me) return;
  const bg = document.createElement("div"); bg.id = "sheetBg";
  const box = document.createElement("div"); box.className = "sheet";
  const esc = e => { if (e.key === "Escape") shut(); };
  const shut = () => { closeSheet(); window.removeEventListener("keydown", esc); };
  const el = (tag, cls, txt) => { const e = document.createElement(tag); if (cls) e.className = cls;
    if (txt != null) e.textContent = txt; return e; };

  const finOf = i => (rec.cur.fin || {})[i] || "17:00";
  box.append(el("div", "stitle", nameOf(me)),
             el("div", "sbody", [rowLabel(k), "leaves " + finOf(me), fmtLong(d)].join(" · ")));

  /* ---- swap pods -------------------------------------------------------------------------- */
  if ("ABCDE".includes(k)) {
    box.append(el("div", "slabel", "Swap pods with"));
    const row = el("div", "spods");
    for (const [p] of PODROWS) {
      const who = rec.cur[p] || "";
      const here = p === k;
      const t = el("button", "podtile pod" + p + (here ? " here" : who ? "" : " empty"));
      t.append(el("span", null, p), el("span", "who", here ? "you ✓" : who || "—"));
      t.title = here ? "You are on " + rowLabel(p)
              : who ? "Swap with " + nameOf(who) + " on " + rowLabel(p)
              : "Nobody is on " + rowLabel(p);
      if (here || !who) t.disabled = true;
      else t.onclick = () => { shut(); ensureWho(() => applySwap(d, k, p)); };
      row.append(t);
    }
    box.append(row);
  }

  /* ---- swap finish time ------------------------------------------------------------------- */
  const others = PODROWS.map(([p]) => p).filter(p => p !== k && rec.cur[p] && finOf(rec.cur[p]) !== finOf(me));
  if ("ABCDE".includes(k) && others.length) {
    box.append(el("div", "slabel", "Swap finish time with"));
    const row = el("div", "sfins");
    for (const p of others) {
      const who = rec.cur[p];
      const t = el("button", "fintile");
      t.append(el("span", null, finOf(who)), el("span", "who", nameOf(who)));
      t.title = "You would leave at " + finOf(who) + " and " + nameOf(who) + " at " + finOf(me);
      t.onclick = () => { shut(); ensureWho(() => applyFinSwap(d, k, p)); };
      row.append(t);
    }
    box.append(row);
  }

  /* ---- referrals ---------------------------------------------------------------------------
     The one thing here that is NOT a swap: COD is handed over, and whoever had it keeps their pod.
     The button says who it is coming from, because "Take COD" on its own tells you nothing about
     who stops taking referrals — which is the half of the fact that matters to the other person. */
  const codIni = rec.cur.cod || "";
  if ("ABCDE".includes(k) && codIni && codIni !== me) {
    const b = el("button", "btn sec sbtn", "Take COD from " + nameOf(codIni));
    b.onclick = () => { shut(); ensureWho(() => applyEdit(d, "cod", me,
      "COD handed to " + me + " (" + rowLabel(k) + ")")); };
    box.append(b);
  }

  /* ---- replace ------------------------------------------------------------------------------
     The only way to bring in somebody who is not on that day at all, so it stays even though it
     is the least-reached-for thing here. */
  const rep = el("button", "btn sec sbtn", "Somebody else covers " + rowLabel(k));
  rep.onclick = () => { shut(); replaceDialog(d, k); };
  box.append(rep, (() => { const c = el("button", "btn sec sbtn plain", "Cancel"); c.onclick = shut; return c; })());

  bg.append(box);
  bg.onclick = e => { if (e.target === bg) shut(); };
  window.addEventListener("keydown", esc);
  document.body.append(bg);
}
/* The dropdown, as a dialog rather than an in-cell <select>: on a phone a select replacing a 22px
   cell is unusable, and the sheet has already taken over that job. Desktop still gets the in-cell
   select from editCell, which is quicker when you are already pointing at the thing. */
function replaceDialog(d, k){
  const m = $("#modal"); m.innerHTML = "";
  m.append(__el("h3", {}, "Who covers " + rowLabel(k) + "?"));
  const cur = (((CR() || {}).days || {})[d] || {}).cur || {};
  const sel = consSelect("cellsel", cur[k] || "", "— nobody —");
  sel.style.width = "100%";
  m.append(sel);
  const btns = __el("div", { class: "modalbtns" });
  btns.append(__el("button", { class: "btn sec", onclick: closeModal }, "Cancel"),
    __el("button", { class: "btn", onclick: () => { const v = sel.value; closeModal();
      if (v !== (cur[k] || "")) ensureWho(() => applyEdit(d, k, v)); } }, "Save"));
  m.append(btns);
  $("#modalBg").style.display = "flex";
}
/* "Monday 24 Aug" — the sheet says the day in full because it is the one place with no column
   heading above it to say which day you are looking at. */
function fmtLong(iso){
  try { return new Date(iso + "T12:00:00").toLocaleDateString("en-GB",
    { weekday: "long", day: "numeric", month: "short" }); }
  catch(e){ return iso; }
}
/* A phone or a tablet — anywhere the primary pointer cannot hover, which is exactly where drag
   and drop does not exist. Matched at the moment of the tap rather than at load, so a tablet with
   a trackpad attached mid-session behaves as whatever it currently is. */
const coarsePointer = () => {
  try { return window.matchMedia("(pointer: coarse)").matches; } catch(e){ return false; }
};

/* Everything a tap can do to a pod cell, in the order the questions actually arise. */
function tapCell(d, k, cellEl){
  requireEdit(() => {
    const rec = ((CR() || {}).days || {})[d];
    const cur = (rec && rec.cur[k]) || "";
    const isPod = "ABCDE".includes(k);
    if (armed) {
      /* A swap is between two people on ONE day — the same rule the drop handler enforces, said
         the same way, because two paths that disagree about that is how a rota gets a person in
         two places. */
      if (armed.d !== d) { toast("Swap within the same day"); clearArmed(); return; }
      const a = armed;
      if (a.kind === "cod") {
        clearArmed();
        if (!cur || !isPod) { toast("Tap a pod with somebody on it to take COD"); return; }
        if (cur === rec.cur.cod) return;
        applyEdit(d, "cod", cur, "COD handed to " + cur + " (" + rowLabel(k) + ")");
        return;
      }
      if (a.kind === "fin") {
        clearArmed();
        if (!cur || !isPod) { toast("Tap a pod with somebody on it to take the finish"); return; }
        if (a.k === k) return;
        applyFinSwap(d, a.k, k);
        return;
      }
      /* Tapping the armed cell again means "I meant to change this one, not move it" — so it
         falls through to the dropdown. Nothing is labelled on screen (rule 2); it is in the Key. */
      if (a.k === k) { clearArmed(); editCell(d, k, cellEl); return; }
      clearArmed();
      if (!cur) { toast("Tap a pod with somebody to swap with"); return; }
      ensureWho(() => applySwap(d, a.k, k));
      return;
    }
    /* Nothing picked up yet. ONE CLICK OPENS THE SHEET, ON EVERY POINTER — 28 Aug. The 17 Aug
       version gave the sheet to coarse pointers only and kept arm-then-tap for the mouse: first
       click gold, second click the dropdown. Ali, using it: "annoying when editing have to click
       twice to change somebidy. first goe gold second brings up options" — the pick-up that felt
       quicker in theory was a hurdle in practice, and a gesture that differs by device is a
       gesture nobody can teach. So an occupied pod opens the sheet everywhere, first click.
       Nothing is lost: drag still swaps on desktop, the pills still arm, and the armed-pod
       branches above stay for the pills' sake. */
    if (isPod && cur) { podSheet(d, k); return; }
    /* An empty pod or a column on a phone: the in-cell <select> is unusable at that size, so the
       same dialog the sheet uses does the job. */
    if (coarsePointer()) { replaceDialog(d, k); return; }
    editCell(d, k, cellEl);
  });
}
function tapPill(kind, d, k){
  requireEdit(() => {
    if (armed && armed.kind === kind && armed.d === d && armed.k === (k || "")) { clearArmed(); return; }
    armed = { kind, d, k: k || "" };
    paintArmed();
  });
}
function editCell(d, k, cellEl){
  requireEdit(() => {
    const rec = ((CR() || {}).days || {})[d];
    const cur = (rec && rec.cur[k]) || "";
    const sel = consSelect("cellsel", cur, "— nobody —");
    sel.title = "Who covers " + rowLabel(k) + " on " + fmt(d);
    cellEl.replaceWith(sel);
    sel.focus();
    let done = false;
    /* Cancelling redraws BOTH grids, not just the Pods week: the dropdown that replaced the cell
       may well be sitting on the Look ahead page, and redrawing the other one would leave it
       stranded as a live <select> in a grid nothing is listening to. */
    const finish = commit => { if (done) return; done = true; if (commit && sel.value !== cur) applyEdit(d, k, sel.value); else renderGrids(); };
    sel.onchange = () => finish(true);
    sel.onblur = () => finish(false);
    sel.onkeydown = e => { if (e.key === "Escape") finish(false); };
  });
}

/* ── Edit and Done ────────────────────────────────────────────────────────────────────────
   The page used to ask for the password at the moment of the first change, which meant you
   discovered whether you were allowed to edit only after trying to. The resident board asks
   up front with an Edit button, and this now matches it: unlock, make changes, press Done.

   Two questions, deliberately separate. The PASSWORD is whether you may change the cover at
   all — one password, shared by the rota team. The NAME is whose change it is, and it comes
   from the consultants list because nobody else signs for one. Asking them together would
   make the name feel like a login, which it isn't. */
function requireEdit(cb){
  if (EDIT_MODE) return cb();
  offerEdit();
}
/* ── A DRAG OUTSIDE EDIT MODE IS A QUESTION, NOT A MISTAKE — 17 Aug ─────────────────────────────
   Ali, 17 Aug: "when not in edit mode its a bit confusing as allows you to drag but nothing
   sticks. maybe put a warning if attempts to, say, go into edit mode."

   The badge was draggable whether or not the page was unlocked, so the gesture always LOOKED
   available and then quietly did nothing — and a three-second toast at the bottom of a tall grid
   is not an answer when your eyes are on the pod you just dropped onto. Somebody who picks up a
   badge has already said what they want; the only thing missing is the unlock, so ask for it
   there and then instead of sending them to find a button.

   Deliberately a dialog rather than a bigger toast: this one has something to DO, and hard rule 2
   forbids printing the explanation permanently on the screen. On demand is exactly the shape
   that's allowed. */
let edPromptOpen = false;
function offerEdit(){
  /* A refused drag can fire twice on a trackpad. One dialog. */
  if (edPromptOpen || EDIT_MODE) return;
  edPromptOpen = true;
  /* editOverlay, not whoOverlay — see the note beside the shared CSS. */
  const ov = document.createElement("div"); ov.id = "editOverlay";
  const box = document.createElement("div"); box.className = "box"; box.style.maxWidth = "360px";
  const t = document.createElement("b"); t.textContent = "Turn on editing?";
  const sub = document.createElement("div");
  sub.style.cssText = "font-size:.82rem;color:var(--muted);margin:.3rem 0 .9rem;line-height:1.45";
  sub.textContent = "The cover is locked, so that move wasn't saved. Editing asks for your name and logs the change under it.";
  const close = () => { edPromptOpen = false; ov.remove(); };
  /* 44px minimum, because this dialog exists FOR the touch case. Measured at 390px on the live
     page the buttons came out 32 and 34 high — my own new control breaking hard rule 14's touch
     floor on the very form factor it was written for. A phone is where drag does not exist and
     tapping is the only way in, so this is the last place to put a small button. */
  const ok = document.createElement("button");
  ok.className = "btn"; ok.style.cssText = "width:100%;min-height:44px"; ok.textContent = "Turn on editing";
  ok.onclick = () => { close(); enterEdit(); };
  const no = document.createElement("button");
  no.className = "btn sec"; no.style.cssText = "width:100%;margin-top:.5rem;min-height:44px"; no.textContent = "Not now";
  no.onclick = close;
  box.append(t, sub, ok, no);
  ov.onclick = e => { if (e.target === ov) close(); };
  document.addEventListener("keydown", function esc(e){
    if (e.key === "Escape"){ document.removeEventListener("keydown", esc); close(); }
  });
  ov.append(box); document.body.append(ov);
  ok.focus();
}
/* No password (Ali, 6 Aug). Swapping people between days and moving badges is ordinary
   consultant work — the only thing needed is a name to log it under, so the change has an
   author. The password guards the ROTA TEAM pages behind the shield (Fairness, the log, Setup),
   which is a different question: who may look at the whole picture and change how it works.
   I had conflated "who may edit" with "who may administer" and locked the wrong door. */
function enterEdit(){
  ensureWho(() => {
    EDIT_MODE = true;
    document.body.classList.add("editing");
    renderAll();
    toast("Editing — press Done when you've finished");
  });
}
function leaveEdit(){
  EDIT_MODE = false;
  document.body.classList.remove("editing");
  /* Whatever was picked up is put down. Leaving it armed would mean pressing Edit again tomorrow
     and finding a cell already half-way through a swap nobody remembers starting. */
  clearArmed();
  renderAll();
}
$("#btnEdit").onclick = enterEdit;
$("#btnDone").onclick = leaveEdit;

/* ── Key ──────────────────────────────────────────────────────────────────────────────────
   On demand, never on the page (hard rule 2: a screen that needs a legend printed on it is a
   screen that isn't clear enough). Describes what is actually drawn on THIS grid — pods, the
   COD and finish pills, the on-call column, residents — and nothing borrowed from the
   resident board's key that never appears here. */
function keyDialog(){
  const ov = document.createElement("div"); ov.id = "whoOverlay";
  const box = document.createElement("div"); box.className = "box";
  box.style.maxWidth = "440px";
  /* A WAY OUT THAT NEVER SCROLLS AWAY — 28 Aug (Ali: "cant lose the key pane"). On a phone the
     Key fills 86% of the screen, the Close button sits at the BOTTOM of a long scroll, and the
     backdrop is a sliver — so the dialog read as stuck, the same complaint as the drawer this
     morning. The ✕ is sticky to the box's top corner, visible from the first pixel to the last,
     and Escape closes too. The bottom Close stays for whoever has already read to the end. */
  const x = document.createElement("button");
  x.setAttribute("aria-label", "Close");
  x.textContent = "✕";
  x.style.cssText = "position:sticky;top:-1.2rem;float:right;margin:-1.05rem -1.15rem 0 .5rem;z-index:5;" +
    "background:var(--card);border:0;font:inherit;font-size:1rem;color:var(--muted);cursor:pointer;" +
    "padding:.55rem .7rem;border-radius:0 16px 0 12px";
  x.onclick = () => ov.remove();

  const escClose = e => { if (e.key === "Escape") { ov.remove(); document.removeEventListener("keydown", escClose); } };
  document.addEventListener("keydown", escClose);
  const row = (chip, text) => {
    const r = document.createElement("div");

    const c = document.createElement("span");
    c.style.cssText = "min-width:74px;display:inline-flex;justify-content:flex-start";
    c.innerHTML = chip;
    const t = document.createElement("span"); t.textContent = text;
    r.append(c, t); return r;
  };
  const head = t => { const h = document.createElement("div");
    h.style.cssText = "font-size:.62rem;text-transform:uppercase;letter-spacing:.08em;color:var(--muted);font-weight:700;margin:.9rem 0 .1rem";
    h.textContent = t; return h; };
  const swatch = p => "<span style='display:inline-block;width:46px;height:15px;border-radius:4px;background:var(--pod" + p + ");border-top:3px solid var(--pod" + p + "b)'></span>";
  const ttl = document.createElement("b"); ttl.textContent = "Key";
  box.append(ttl,
    head("Pods"),
    row(swatch("A") + swatch("B"), "Pods A and B — general"),
    row(swatch("C") + swatch("D"), "Pods C and D — neuro"),
    row(swatch("E"), "Pod E — with the consultant of the day"),
    head("On the name"),
    row("<span class='codpill'>COD</span>", "Consultant of the day — takes referrals. Drag it to hand it over."),
    row("<span class='finpill'>18:00</span>", "Stays until this time. Drag it to swap who stays late."),
    /* THE CHANGE CHIPS \u2014 28 Aug. They replace the dashed amber outline and the sync's inset
       ring, and every one of them speaks when TAPPED as well as hovered, so the Key can promise
       the same gesture on every form factor (hard rule 14). */
    row("<span class='chgpill' style='position:static'>" + SVG_SWAP + "</span>",
        "On the corner of a name: moved here or added in the last two days. Tap it to see where they were and when."),
    row("<span class='chgpill short' style='position:static'>" + SVG_SWAP + "</span>",
        "The same, at short notice \u2014 the change landed within a day of the shift"),
    row("<span class='ofspill' style='position:static'>" + SVG_PEN + "</span>",
        "No longer matches the rota sheet \u2014 changed by hand. Tap it to see what the sheet has."),
    row("<span class='heldpill' style='margin:0'>held</span>",
        "This day is held to the version that was circulated, so the nightly sync leaves it alone"),
    /* The tap gesture belongs here and nowhere else. It has no on-screen label by design (rule 2),
       so if it is not in the Key it is not discoverable at all \u2014 and on a phone it is the ONLY way
       to swap anybody, because drag and drop does not exist on touch. */
    head("Changing it"),
    row("<span class='cell armed' style='min-width:0'>NJC</span>",
        "Picked up. Press Edit first, tap a name to pick it up, then tap another name on the same day to swap the two."),
    row("<span class='cell' style='min-width:0'>NJC</span>",
        "Tap the picked-up name again to choose somebody different instead of swapping."),
    head("Columns"),
    row("<b style='font-size:.8rem'>On call</b>", "Overnight, and the 24-hour person at weekends"),
    row("<b style='font-size:.8rem'>Fairfield</b>", "Covering FGH that day"),
    head("Residents"),
    /* "Hover for their profile" was the only instruction here, and on a phone or tablet there is

       does not exist (hard rule 14). Say where it works rather than pretending it works anywhere. */
    row("<span class='rpill'>Name</span>", "A resident in that pod. On a computer, hover for their profile. Use the people button to show or hide them."));
  const btn = document.createElement("button");
  btn.className = "btn"; btn.style.cssText = "width:100%;margin-top:1rem"; btn.textContent = "Close";
  btn.onclick = () => ov.remove();
  box.append(btn);
  ov.onclick = e => { if (e.target === ov) ov.remove(); };
