}
$("#btnKey").onclick = keyDialog;
$("#btnFeedback").onclick = feedbackDialog;
/* The ask is for the trial, not for ever. After TRIAL_END the button goes and the page stays, so
   what people sent is still there to read. */
if (!trialOn()) $("#btnFeedback").style.display = "none";
/* Clicking the backdrop closes it, like every other dialog on both boards. */
$("#modalBg").onclick = e => { if (e.target === $("#modalBg")) closeModal(); };

/* ONE PREDICATE FOR THE ARROWS AND THE STEP — 28 Aug. "Consultants see 2 weeks" was only half
   true: the cells past the edge drew dashes, but the arrows still walked you into week seven to
   look at a gridful of them, which is not what anybody means by seeing two weeks ahead. The stop
   is the same edge the cells use, so the two cannot disagree, and the rota team is exempt because
   Look ahead is exactly their job. Lifted from the resident board, which settled this on 26.08.20:
   a control that presses without answering is worse than one that is visibly out of moves. */
function canStepWeek(n){
  const wks = weeksAvail();
  const i = wks.indexOf(curWeek);
  const target = wks[i + n];
  if (!target) return false;
  if (n > 0 && !teamUnlocked() && target > pubUntil()) return false;
  return true;
}
function shiftWeek(n){
  if (!canStepWeek(n)) return;
  const wks = weeksAvail();
  const i = wks.indexOf(curWeek);
  const target = wks[i + n];
  /* Changing week puts down whatever was picked up. A swap is always within one day, so an armed
     cell from the week you just left can only ever produce "swap within the same day" — better to
     drop it than to carry an invisible one across. */
  if (target){ curWeek = target; clearArmed(); renderRota(); }
}
$("#btnPrev").onclick = () => shiftWeek(-1);
$("#btnNext").onclick = () => shiftWeek(1);
/* Look ahead's arrows, which are the Pods arrows over a different week list. */
$("#ahPrev").onclick = () => shiftAhead(-1);
$("#ahNext").onclick = () => shiftAhead(1);
$("#ahToday").onclick = () => { aheadWeek = aheadWeeks()[0] || null; renderAhead(); };
$("#btnToday").onclick = () => { const wks = weeksAvail(); const m = mondayOf(new Date().toISOString().slice(0,10)); if (wks.includes(m)){ curWeek = m; renderRota(); } };
$("#btnJuniors").onclick = () => {
  showJun = !showJun;
  /* An icon can't say "Hide" — so it says it by looking pressed, and the tooltip carries the
     rest. This is the whole reason the toolbar fits on a phone now. */
  $("#btnJuniors").classList.toggle("on", showJun);
  /* The word stays "Residents" in both states — it names what the button is about, not what
     pressing it will do. Which way it is pointing is carried by the pressed look, exactly as
     before. The aria-label is the one thing that must flip, because a screen reader has no
     pressed look to go on. */
  $("#btnJuniors").setAttribute("aria-label", showJun ? "Hide residents" : "Show residents");
  $("#btnJuniors").title = showJun ? "Hide the residents" : "Show the residents in each pod";
  /* On the body as well as in the variable: the phone layout drops from two columns to one when
     residents are showing, and that is a CSS decision, not a JS one. */
  document.body.classList.toggle("showjun", showJun);
  renderGrids();
};
/* One shield, one inset menu, one password — the resident board's pattern exactly. The gate
   checks the SAME rota-team password (data.staffPw travels in the shared store), asked once
   per session on this device. */
/* ================= TRIAL FEEDBACK =================
   Ported from the resident board on 8 Aug, deliberately as a copy of its behaviour rather than a
   fresh take on it (Ali: "just identical to residents (visually and functionally)").

   The BUTTON is open to everyone — a consultant who has spotted something wrong should not have to
   ask for a password first. The PAGE that lists what people sent sits behind the shield with the
   rest of the rota-team pages, because it carries names.

   Anonymous really is anonymous: nothing about the sender is recorded unless they type it.

   It writes against a FRESHLY-READ copy of the store, never our own in-memory one, so somebody
   sending feedback can never overwrite a pod change made elsewhere in the meantime. That is the
   same reasoning as the backup's lastBackup stamp, and it matters more here, because the person
   sending feedback has the page open for minutes rather than seconds. */
/* TRIAL_END is declared at the top with the other configuration — see the note there. */
function trialOn(){ return new Date().toISOString().slice(0, 10) <= TRIAL_END; }

/* Straight out by email too, so nobody has to remember to look at the page. Best-effort and
   deliberately silent: if the mail flow is down the feedback is still saved and the sender is
   told it worked — because as far as they are concerned it did. Needs `fb` in k.js; without it
   this does nothing and the feedback still lands in the store. */
async function emailFeedback(entry){
  const url = (window.__POD_KEYS || {}).fb;
  if (!url) return;
  const who = entry.name ? entry.name : "anonymous";
  const lines = [
    entry.kind + " — " + who,
    "",
    entry.msg,
    "",
    "Sent " + new Date(entry.t).toLocaleString("en-GB") + " from the consultant Cover trial.",
    entry.name ? "" : "This person chose to send it anonymously; there is no way to identify them."
  ];
  try {
    await fetch(url, { method: "POST", headers: { "Content-Type": "application/json" },
      body: JSON.stringify({
        subject: "Cover feedback — " + entry.kind + " (" + who + ")",
        text: lines.join("\n")
      }) });
  } catch (e) { /* saved anyway — nothing to tell the sender */ }
}

async function sendFeedback(entry){
  /* On the test site, keep it with the test site — never write it into the live cover file. The
     email still goes, because feedback from somebody trialling it is worth having either way. */
  if (TESTMODE || !COVER_SAVE) {
    cdata = cdata || seedC();
    cdata.feedback = cdata.feedback || [];
    cdata.feedback.unshift(entry);
    if (cdata.feedback.length > 300) cdata.feedback.length = 300;
    emailFeedback(entry);
    updateFbCount();
    return true;
  }
  let base = null;
  try {
    const r = await fetch(COVER_READ, { method: "POST", headers: { "Content-Type": "application/json" },
                                        body: "{}", cache: "no-store" });
    const fresh = await r.json();
    if (fresh && typeof fresh === "object" && (fresh.days || fresh.map)) base = fresh;
  } catch (e) { /* fall through to our own copy */ }
  if (!base) base = cdata;
  if (!base) return false;
  base.feedback = base.feedback || [];
  base.feedback.unshift(entry);
  if (base.feedback.length > 300) base.feedback.length = 300;
  base.savedAt = new Date().toISOString();
  try { await postLive(COVER_SAVE, JSON.stringify(base)); }
  catch (e) { emailFeedback(entry); return false; }
  cdata = base;
  emailFeedback(entry);
  updateFbCount();
  return true;
}

function closeModal(){ $("#modalBg").style.display = "none"; $("#modal").innerHTML = ""; }

function feedbackDialog(){
  const m = $("#modal"); m.innerHTML = "";
  m.append(__el("h3", {}, "Feedback"));
  let kind = "Problem";
  const seg = __el("div", { class: "seg" });
  [["Problem","Something's wrong"],["Suggestion","An idea"],["Question","A question"]].forEach(([v,l]) => {
    const b = __el("button", { class: "segbtn" + (v === kind ? " on" : ""), onclick: () => {
      kind = v; [...seg.children].forEach(c => c.classList.toggle("on", c.dataset.v === v)); } }, l);
    b.dataset.v = v; seg.append(b);
  });
  m.append(__el("label", { class: "adlbl" }, "What kind of thing is it?"), seg);
  const msg = __el("textarea", { style: "width:100%;min-height:130px;font-family:inherit;font-size:.9rem;border:1px solid var(--line);border-radius:12px;padding:.6rem .7rem",
    placeholder: "What happened, or what would make it better?" });
  m.append(__el("label", { class: "adlbl" }, "Your feedback"), msg);
  const nameIn = __el("input", { type: "text", placeholder: "Optional", style: "width:100%" });
  m.append(__el("label", { class: "adlbl" }, "Your name"), nameIn);
  const btns = __el("div", { class: "modalbtns" });
  btns.append(
    __el("button", { class: "btn sec", onclick: closeModal }, "Cancel"),
    __el("button", { class: "btn", onclick: async () => {
        const text = (msg.value || "").trim();
        if (!text) { msg.focus(); return; }
        closeModal();
        toast("Sending…");
        const ok = await sendFeedback({ t: new Date().toISOString(), kind,
          name: (nameIn.value || "").trim(), msg: text });
        toast(ok ? "Thanks — that's been sent" : "Couldn't send just now — please try again in a moment");
      } }, "Send")
  );
  m.append(btns);
  $("#modalBg").style.display = "flex";
  msg.focus();
}

/* Read state. The shared `read` flag is the answer; this browser's own list only fills the gap
   between somebody looking and the next save, so an unread count does not come back on a reload.
   Marking read is NOT gated on a save key — on the test site, or with no key, the count still
   clears, because the person genuinely has read it. */
function readFeedbackLocal(){
  try { return new Set(JSON.parse(localStorage.getItem("coverFbRead") || "[]")); } catch(e){ return new Set(); }
}
function feedbackKey(f){ return (f && (f.t || "")) + "|" + (f && (f.name || "")); }
function isFeedbackRead(f){ return !!(f && f.read) || readFeedbackLocal().has(feedbackKey(f)); }
function unreadFeedback(){ return (((CR() || {}).feedback) || []).filter(f => !isFeedbackRead(f)).length; }
function markFeedbackRead(){
  const fb = ((CR() || {}).feedback) || [];
  if (!fb.some(f => !isFeedbackRead(f))) return;
  const local = readFeedbackLocal();
  fb.forEach(f => { f.read = true; local.add(feedbackKey(f)); });
  try { localStorage.setItem("coverFbRead", JSON.stringify([...local].slice(-400))); } catch(e){}
  updateFbCount();
}
function updateFbCount(){
  const f = $("#tabFbCount"); if (!f) return;
  const u = unreadFeedback();
  f.textContent = String(u);
  f.classList.toggle("on", u > 0);
}

/* One card per message. The resident board's markup and colours exactly — a problem is pink, an
   idea is blue, read ones fade. No opening sentence explaining what the page is: hard rule 2. */
function feedbackCards(list, cap){
  const wrap = __el("div", { style: "display:grid;gap:.5rem" });
  for (const f of (list || []).slice(0, cap || 300)){
    const kind = (f.kind || "").toLowerCase();
    const tint = kind === "problem" ? "#fdf4f6" : kind === "suggestion" ? "#f5f8ff" : "var(--hair)";
    const ink  = kind === "problem" ? "var(--podEb)" : kind === "suggestion" ? "var(--podAb)" : "var(--muted)";
    const read = isFeedbackRead(f);
    wrap.append(__el("div", { style: "background:#fff;border:1px solid " + (read ? "#e3e3de" : "#d5d5d0") +
        ";border-radius:10px;padding:.6rem .8rem" + (read ? ";opacity:.62" : "") },
      __el("div", { style: "display:flex;align-items:center;gap:.5rem;margin-bottom:.3rem" },
        f.kind ? __el("span", { style: "background:" + tint + ";color:" + ink +
          ";font-size:.68rem;font-weight:700;padding:.1rem .5rem;border-radius:999px" }, f.kind) : null,
        __el("span", { style: "font-size:.72rem;color:var(--muted)" },
          new Date(f.t).toLocaleString("en-GB") + " · " + (f.name || "anonymous"))),
      __el("div", { style: "font-size:.92rem" }, f.msg)));
  }
  return wrap;
}
function renderFeedback(){
  const box = $("#fbList"); if (!box) return;
  box.innerHTML = "";
  const fb = ((CR() || {}).feedback) || [];
  if (!fb.length) { box.append(__el("div", { class: "attnclear" }, __el("b", {}, "Nothing yet"),
    "Messages sent with the Feedback button appear here.")); return; }
  box.append(feedbackCards(fb, 300));
}

/* `fair` left this list on 28 Aug when Fairness went public in the rail — a tab in TEAM_TABS
   opens the rota-team panel around itself, and a public page must not hold that door open. */
const TEAM_TABS = ["attn", "ahead", "log", "staff", "setup", "feedback"];
function showTab(t){
  document.body.classList.remove("teamlocked");   // any deliberate move off the lock clears it
  document.querySelectorAll("aside button[data-tab], #teamPanel button[data-tab]").forEach(x => x.classList.toggle("active", x.dataset.tab === t));
  for (const k of ["rota", "lock", "fair"].concat(TEAM_TABS)) $("#tab-" + k).style.display = (t === k) ? "" : "none";
  document.body.classList.toggle("teamopen", TEAM_TABS.includes(t));
  /* Leaving the team pages always puts the phone drawer away, whatever closed them. */
  if (!TEAM_TABS.includes(t)) document.body.classList.remove("navopen");
  const bt = $("#btnTeam"); if (bt) bt.classList.toggle("active", TEAM_TABS.includes(t));
  /* Drawn on the way in rather than on every render — see renderGrids. Has to come AFTER the
     display flip above, since renderGrids asks the section whether it's visible.
     Setup is redrawn on the way in too: it carries the attention panel of unnamed consultants, and
     that is answered from the allocation, which the sync changes under it. Rendered once at load,
     it would show whoever was unnamed when the tab was first opened. */
  if (t === "ahead") renderAhead();
  if (t === "fair") renderFair();
  if (t === "setup") renderSetup();
  if (t === "staff") renderStaff();
  if (t === "attn") renderAttn();
  /* Opening the page IS reading it, so the count clears on the way in rather than needing a
     button. Draw first, then mark — the cards have to be able to show which were unread. */
  if (t === "feedback") { renderFeedback(); markFeedbackRead(); }
}
/* The lock is a PAGE, not a dialog — the resident board's pattern, ported here on 6 Aug because
   the two shields looked and behaved differently for no reason anybody could give (Ali: "why does
   the rota team password gate look different to residents"). Its note is the argument: click the
   shield, the whole pane becomes the password box, and only when it clears do the menu and the
   pages appear behind it. A floating modal quietly says "dismiss me and carry on", which is the
   wrong thing to say about a door.

   What's deliberately NOT copied is the resident board's "set a password" and "forgotten? reset
   it" branches. This page does not own the password — data.staffPw travels in the shared store
   and is set on the resident board. Offering to set or reset it here would be a second place to
   change one password, which is how they end up different. */
let LOCK_THEN = null;
function showLockScreen(then){
  LOCK_THEN = then;
  document.body.classList.add("teamlocked");
  document.body.classList.remove("teamopen");
  for (const k of ["rota", "lock", "fair"].concat(TEAM_TABS)) $("#tab-" + k).style.display = (k === "lock") ? "" : "none";
  document.querySelectorAll("aside button[data-tab], #teamPanel button[data-tab]").forEach(x => x.classList.remove("active"));
  const bt = $("#btnTeam"); if (bt) bt.classList.add("active");
  /* "once on this device" was wrong: the unlock is kept in sessionStorage, so it lasts until the
     tab is closed and not a minute longer. Saying "device" set an expectation the page then broke
     every morning, which is a small lie that costs trust on a page whose whole job is to be the
     thing people believe about tomorrow. */
  $("#lockSub").textContent = "One password covers Look ahead, Fairness and the change log. " +
    "It's the rota team's password from the resident board, and you'll be asked again next time " +
    "you open this page.";
  $("#lockMsg").textContent = "";
  $("#lockPw").value = "";
  setTimeout(() => $("#lockPw").focus(), 40);
}
$("#lockBtn").onclick = async () => {
  if (await sha($("#lockPw").value) === (data && data.staffPw)) {
    try { sessionStorage.setItem("consTeamUnlocked", "1"); } catch(e){}
    document.body.classList.remove("teamlocked");
    $("#lockPw").value = "";
    const then = LOCK_THEN; LOCK_THEN = null;
    if (then) then();
  } else $("#lockMsg").textContent = "Wrong password.";
};
$("#lockPw").onkeydown = e => { if (e.key === "Enter") $("#lockBtn").click(); };

/* RESETTING A FORGOTTEN PASSWORD, BY EMAIL.

   What was here before was nothing at all: Cover deliberately left out the resident board's
   "forgotten?" branch, so a person who forgot saw a dead end and had to know, from nowhere, to go
   to the other board. And what the other board does — clear it for everyone, on the word of
   whoever happens to be standing there — was the thing Ali put his finger on: "this means anyone
   accessing the board can just set a new password without telling anyone right?" Yes, it did.

   So a reset is now something a named person ALLOWS rather than something anybody takes. You pick
   one of the admin addresses, a link goes to it, and the password only clears when they click it.
   The addresses are masked here because this screen is reachable by anybody with the link.

   The two Power Automate flows this needs are Ali's to build in the trust tenant, and until they
   exist the button says so rather than pretending. See RESET-FLOWS.md for exactly what they do. */
const maskEmail = a => {
  const [u, d] = String(a).split("@");
  return (u || "").slice(0, 3) + "•••" + (d ? "@" + d : "");
};
/* THE RESET IS A DEAD END AND SAYS SO UP FRONT. The two Power Automate flows this needs are Ali's
   to build in the trust tenant and do not exist, so `cvr` is not in k.js and COVER_RESET is empty.
   The old code let you click Reset password, pick an address and press Send link before admitting
   it — three steps to a wall. Worse, it left somebody stuck: this is the RESIDENT board's password,
   so the way to change it was never on this page at all, and nothing said that either.
   Naming where the password actually lives is the useful half, and it costs one sentence. */
$("#lockReset").onclick = e => {
  e.preventDefault();
  const admins = ((CR() || {}).resetAdmins || []);
  if (!COVER_RESET) { $("#lockMsg").textContent =
    "This is the rota team's password from the resident board — change it there, on its Settings page."; return; }
  if (!admins.length) { $("#lockMsg").textContent = "No reset address is set up yet."; return; }
  const sel = $("#lockAdmin");
  sel.innerHTML = admins.map((a, n) => "<option value='" + n + "'>" + esc(maskEmail(a)) + "</option>").join("");
  $("#lockResetBox").style.display = "";
  $("#lockReset").style.display = "none";
};
$("#lockSend").onclick = async () => {
  const admins = ((CR() || {}).resetAdmins || []);
  const n = +$("#lockAdmin").value;
  if (!admins[n]) return;
  if (!COVER_RESET) { $("#lockMsg").textContent = "The reset flow isn't connected yet."; return; }
  $("#lockSend").disabled = true;
  try {
    await postLive(COVER_RESET, JSON.stringify({ to: admins[n], at: location.href }));
    $("#lockResetBox").style.display = "none";
    $("#lockMsg").style.color = "var(--green)";
    $("#lockMsg").textContent = "Link sent to " + maskEmail(admins[n]);
  } catch(e){
    $("#lockSend").disabled = false;
    $("#lockMsg").textContent = "Couldn't send — try again.";
  }
};
/* FAILS CLOSED WHEN IT CANNOT CHECK. The old test was `unlocked || !data || !data.staffPw`, which
   opened the rota-team pages whenever the resident store had not loaded — that is, on exactly the
   network blip this page is most likely to meet. Two different situations were sharing one branch:

     data is null            the read flow failed. We do not KNOW the password, so we cannot say
                             anybody is entitled. Refuse, and say why.
     data has no staffPw     the resident board has no password set. There is nothing to check,
                             deliberately, so opening is right.

   Worth being straight about the size of this: the whole cover store, every future week and the
   entire change log are already in the browser before this function is ever called, so the lock
   has always been about who gets shown the rota-team pages rather than about confidentiality.
   That does not make failing open harmless — it makes it untidy in a way that reads as a control
   and is not one. */
function ensureTeam(cb){
  let unlocked = false;
  try { unlocked = sessionStorage.getItem("consTeamUnlocked") === "1"; } catch(e){}
  if (unlocked) return cb();
  if (data && !data.staffPw) return cb();
  showLockScreen(cb);
  if (!data) $("#lockMsg").textContent =
    "Can't check the password — the rota didn't load. Try again when you're back on the network.";
}
/* Picking a page CLOSES the drawer — the resident board's rule, and the other half of the phone
   fix: the panel exists to choose with, not to stand over what was chosen. Costs nothing on
   desktop, where navopen does not drive anything. */
document.querySelectorAll("aside button[data-tab], #teamPanel button[data-tab]").forEach(b => b.onclick = () => { showTab(b.dataset.tab); document.body.classList.remove("navopen"); });
/* The shield now lands on Look ahead rather than Fairness. What's coming up is the question the
   rota team opens this page to answer; fairness is what they check afterwards. renderRota first,
   because unlocking has just changed what the Pods grid is allowed to show and it must not be
   left holding dashes behind the tab you switched away from; showTab draws Look ahead itself.
   On a phone the drawer closes before the password box opens (it would sit on top of it — the
   resident board learned that one first) and reopens at the team level after, so the pages are
   there to choose from. */
$("#btnTeam").onclick = () => {
  const phone = window.innerWidth <= 760;
  if (phone) document.body.classList.remove("navopen");
  ensureTeam(() => {
    renderRota(); showTab("ahead");
    document.body.classList.remove("railback");
    if (phone) document.body.classList.add("navopen");
  });
};
/* Mobile hamburger → slide-out side menu (drawer). Closes on backdrop tap or when a page is
   chosen; Menu inside the team level steps back up to the rail (`railback`) rather than throwing
   you out of the section. The resident board's lines, verbatim, for the resident board's reasons. */
$("#hamburger").onclick = () => { document.body.classList.remove("railback"); document.body.classList.toggle("navopen"); };
$("#navbackdrop").onclick = () => document.body.classList.remove("navopen");
$("#tpBack").onclick = () => document.body.classList.add("railback");
/* Read-only until Edit is pressed. Set here rather than in the markup so a page that fails to
   boot is not left looking editable. */
document.body.classList.remove("editing");
if (TESTMODE) {
  document.body.classList.add("testmode");
  $("#testbar").style.display = "flex";
  $("#btnTestReset").onclick = () => {
    if (!confirm("Throw away the changes made on this test site and load a fresh copy of the live cover? Only this browser's copy is replaced — the real cover is not touched.")) return;
    try { localStorage.removeItem(TEST_KEY); } catch(e){}
    location.reload();
  };
}
load().catch(e => { $("#weekGrid").innerHTML = "<p style='padding:1rem'>Couldn't load: " + esc(e.message || e) + "</p>"; });
</script>
