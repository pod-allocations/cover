<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Cover — TEST</title>
<!-- The ?v= is a cache-buster, and it MUST be bumped whenever core.css or core.js changes.
     Missed on 6 Aug when the change log's rules moved into core.css: the file changed, the version
     did not, so every browser holding the old copy carried on using it — and that copy has no log
     rules in it at all. The page looked exactly as broken as before the fix, which is a miserable
     thing to debug because the HTML is demonstrably new and the stylesheet silently is not. -->
<link rel="stylesheet" href="core.css?v=20260806-01">
<style>
:root{
  /* Everything shared lives in core.css. Only the role accent is this page's. */
  --accent:#b07d1e; --accent-bg:#fdf3df;
}
*{box-sizing:border-box}
body{margin:0;font-family:Inter,-apple-system,"Segoe UI",system-ui,Arial,sans-serif;color:var(--ink);background:var(--bg);font-size:14px;-webkit-font-smoothing:antialiased}
#layout{display:flex;min-height:100vh}
aside{width:78px;background:rgba(255,255,255,.72);backdrop-filter:blur(16px);-webkit-backdrop-filter:blur(16px);border-right:0.5px solid var(--line);display:flex;flex-direction:column;align-items:stretch;padding:.9rem 0;position:sticky;top:0;height:100vh;flex-shrink:0}
/* A LABEL, not a control. It sits where an app icon usually sits, so it was read as a button and
   clicked — and it does nothing, because there is nothing for it to do (Ali, 5 Aug: "the tile
   doesnt do anything... make it greyscale so its obviously not functioning"). Every button in
   this rail is filled and coloured on hover; this is outlined, grey, and inert, which is the
   visual grammar the rest of the page already uses for "this is text". */
aside .logo{margin:0 auto 1.1rem;width:42px;height:42px;border-radius:13px;background:transparent;
  border:1px solid var(--hair);color:var(--muted);font-weight:700;font-size:.66rem;display:flex;
  align-items:center;justify-content:center;letter-spacing:.06em;cursor:default;user-select:none}
aside button{background:none;border:0;color:var(--muted);font-family:inherit;cursor:pointer;padding:.45rem 0;display:flex;flex-direction:column;align-items:center;gap:.28rem;font-size:.58rem;font-weight:600;letter-spacing:.02em}
aside button .ic{width:40px;height:40px;border-radius:13px;display:flex;align-items:center;justify-content:center;transition:background .12s}
aside button .ic svg{width:19px;height:19px}
aside button:hover .ic{background:var(--hair)}
aside button.active{color:var(--ink)}
aside button.active .ic{background:var(--accent-bg);color:var(--accent)}
aside .aside-spacer{flex:1}
#content{flex:1;min-width:0}
/* Solid, not translucent — content must never be visible scrolling through the bar. */
#topbar{background:var(--bg);padding:1rem 1.6rem .4rem;display:flex;align-items:center;gap:.7rem;position:sticky;top:0;z-index:45;min-height:56px;flex-wrap:wrap}
#topbar h1{font-size:1.35rem;margin:0;font-weight:700;letter-spacing:-.01em}
.spacer{flex:1}
.hbtn{background:var(--ink);color:#fff;border:0;border-radius:12px;padding:.52rem 1rem;font-weight:600;font-size:.82rem;cursor:pointer;font-family:inherit}
.hbtn.ghost{background:var(--card);color:var(--ink);border:1px solid var(--line)}
.hbtn:hover{filter:brightness(.95)}
/* Lifted from the resident board unchanged. The two sites are meant to be the same thing with
   different contents, and every place they were allowed to differ "just for now" is a place
   somebody has since had to be told about. */
#testbar{position:fixed;left:0;right:0;bottom:0;z-index:200;background:#8a5a00;color:#fff;display:flex;align-items:center;gap:.8rem;padding:.5rem .9rem calc(.5rem + env(safe-area-inset-bottom));font-size:.78rem}
#testbar b{background:#fff;color:#8a5a00;border-radius:5px;padding:.1rem .4rem;font-size:.62rem;letter-spacing:.08em}
#testbar span{opacity:.92;flex:1;min-width:0}
#testbar .hbtn{background:rgba(255,255,255,.16);color:#fff;border:0;flex-shrink:0}
body.testmode main{padding-bottom:3.4rem}
.stalebar{background:#fdf4f6;border:1px solid var(--podEb);border-radius:10px;padding:.7rem .9rem;
  margin:0 0 .8rem;font-size:.85rem;line-height:1.5;color:var(--ink)}
.stalebar .why{display:block;margin-top:.4rem;font-size:.75rem;color:var(--muted)}
/* Look ahead is the Pods grid; the only thing it adds is a chip in the week bar saying whether
   the week on screen is one everybody can see or one still free to move. That distinction is the
   entire reason the page is behind the shield, so it has to be legible at a glance. */
.ahchip{font-size:.58rem;font-weight:800;letter-spacing:.08em;border-radius:999px;padding:.15rem .45rem;
  border:1px solid var(--amber);color:var(--amber);background:var(--amber-bg);white-space:nowrap}
.ahchip.pub{border-color:var(--green);color:var(--green);background:var(--green-bg)}
.navarrow:disabled{opacity:.3;cursor:default}
/* The rota-team lock, copied rule-for-rule from the resident board (Ali, 6 Aug: "why does the
   rota team password gate look different to residents"). It was a floating modal here and a
   page-of-its-own there — the resident board's note explains why that is the right one: "The
   lock is a page of its own, not a dialog: click the shield, the whole pane becomes the password
   box, and only when it clears do the menu and the pages appear behind it." A modal implies you
   can dismiss it and carry on; this says plainly that there is nothing behind it until you're in.
   These belong in core.css next time the two pages are reconciled — they are duplicated for now
   because the resident board is frozen until go-live and must not be touched to make this move. */
.gatebox{max-width:340px;margin:4rem auto;text-align:center}
.gatebox input{width:100%;font-size:1rem;padding:.65rem;margin:.6rem 0;text-align:center}
.gatebox b{display:block;margin-top:.4rem}
.gatebox .sub{font-size:.78rem;color:var(--muted);line-height:1.45;margin-top:.35rem}
body.teamlocked #teamPanel{display:none}
.hbtn.hicon{padding:.42rem;width:34px;height:34px;display:inline-flex;align-items:center;justify-content:center}
.hbtn.hicon svg{width:19px;height:19px;display:block}
.hbtn.on{background:var(--ink);color:#fff;border-color:var(--ink)}
/* One button showing at a time: Edit when reading, Done when editing. The rest of the page
   keys off the same body class rather than each control checking a flag for itself — that
   split is how the resident board ended up editable in two places and locked in a third. */
#btnDone{display:none}
body.editing #btnEdit{display:none}
body.editing #btnDone{display:inline-flex}
body:not(.editing) #btnWho,body:not(.editing) #saveState{display:none}
body.editing #topbar{box-shadow:inset 0 -2px 0 var(--accent)}
#saveState{font-size:.72rem;font-weight:600;padding:.25rem .65rem;border-radius:999px}
#saveState.saved{color:var(--green);background:var(--green-bg)} #saveState.unsaved{color:var(--red);background:var(--red-bg)} #saveState.saving{color:var(--amber);background:var(--amber-bg)}
main{padding:.6rem 1.6rem 4rem;max-width:1550px}
.card{background:var(--card);border:0.5px solid var(--line);border-radius:18px;padding:1.1rem 1.3rem;margin-bottom:1rem}
h2{font-size:.72rem;margin:.1rem 0 .8rem;text-transform:uppercase;letter-spacing:.08em;color:var(--muted);font-weight:700}
button.btn{background:var(--ink);color:#fff;border:0;border-radius:12px;padding:.5rem 1rem;font-weight:600;font-size:.84rem;cursor:pointer;font-family:inherit}
button.btn.sec{background:var(--card);color:var(--ink);border:1px solid var(--line)}
button.btn:hover{filter:brightness(.96)}
.weekbar{display:flex;align-items:center;gap:.5rem;flex-wrap:wrap;margin-bottom:.8rem}
.weekbar b{font-size:.95rem;min-width:215px;text-align:center;font-weight:700;letter-spacing:-.01em}
.navarrow{background:var(--card);border:1px solid var(--line);border-radius:999px;width:36px;height:36px;cursor:pointer;color:var(--muted);display:inline-flex;align-items:center;justify-content:center;transition:background .12s}
.navarrow:hover{background:var(--hair)}
.rota-wrap{background:var(--card);border:0.5px solid var(--line);border-radius:18px;overflow-x:auto;max-width:100%}
table.rota{border-collapse:collapse;width:100%;table-layout:fixed}
table.rota th{background:var(--card);color:var(--muted);font-size:.6rem;overflow-wrap:anywhere;text-transform:uppercase;letter-spacing:.08em;padding:.6rem .6rem;text-align:left;position:sticky;top:0;z-index:10;border-bottom:1px solid var(--line);font-weight:700}
table.rota td{border-bottom:1px solid var(--hair);border-right:1px solid var(--hair);padding:.5rem .45rem;vertical-align:top;overflow-wrap:anywhere}
table.rota td:last-child{border-right:0}
td.rowh{width:52px;font-weight:700;font-size:.85rem}
td.rowh .sub{display:block;font-size:.6rem;font-weight:700;letter-spacing:.06em;text-transform:uppercase;color:var(--muted)}
td.rowh .bar{display:inline-block;width:8px;height:8px;border-radius:50%;margin-right:.4rem}
.cell{cursor:pointer;border-radius:8px;padding:.15rem .4rem;display:inline-block;min-width:38px;font-weight:700;font-size:.9rem;letter-spacing:-.01em}
.cell:hover{background:var(--accent-bg)}
.cell.empty{color:#c9cbd1;font-weight:400}
.cell.diff{outline:1.5px dashed var(--amber);color:var(--amber)}
.cellwrap{display:flex;align-items:center;gap:.42rem}
.codpill{flex:0 0 auto;display:inline-block;text-align:center;font-size:.6rem;border-radius:6px;padding:.08rem .35rem;font-weight:600;letter-spacing:.04em;background:transparent;border:1px solid #b4b2a9;color:#444441;cursor:grab}
.codpill:active{cursor:grabbing}
.finpill{flex:0 0 auto;display:inline-block;min-width:20px;text-align:center;font-size:.6rem;border-radius:6px;padding:.08rem .3rem;font-weight:600;letter-spacing:.04em;background:transparent;border:1px solid #fac775;color:#854f0b;cursor:grab}
.finpill:active{cursor:grabbing}
.cell[draggable="true"]{cursor:grab}
.cell[draggable="true"]:active{cursor:grabbing}
td.dropok{outline:2px dashed var(--accent);outline-offset:-3px}
table.rota th.podth{border-top:3px solid var(--line)}
table.rota th .thsub{display:block;font-size:.56rem;letter-spacing:.05em;color:var(--muted)}
.rota .rpills{margin-top:.35rem}
#hovercard{position:fixed;z-index:80;background:var(--card);border:1px solid var(--line);border-radius:12px;padding:.7rem .9rem;max-width:260px;box-shadow:0 8px 24px rgba(23,24,28,.14);font-size:.8rem;display:none;line-height:1.45}
#hovercard b{font-size:.88rem}
#hovercard .hcgrade{display:inline-block;margin-left:.4rem;background:var(--hair);border-radius:8px;padding:.02rem .4rem;font-size:.68rem;font-weight:700;color:var(--muted)}
#hovercard p{margin:.35rem 0 0;color:#4a4f58}
#hovercard .hcsup{margin-top:.4rem;font-size:.7rem;color:var(--muted);font-weight:600}
select.cellsel{border:1px solid #dcdcd8;border-radius:9px;padding:.25rem .3rem;font-size:.8rem;font-family:inherit;background:#fff;max-width:100%}
#whoOverlay{position:fixed;inset:0;background:rgba(23,24,28,.35);display:flex;align-items:center;justify-content:center;z-index:60}
#whoOverlay .box{background:var(--card);border-radius:16px;padding:1.2rem 1.4rem;max-width:320px;width:90%}
#whoOverlay b{display:block;margin-bottom:.6rem}
#whoOverlay select{width:100%;margin-bottom:.7rem}
tr.junrow td{background:#fafaf8;border-bottom:1px solid var(--hair);font-size:.74rem;color:#5a5f68;padding:.3rem .6rem}
tr.junrow td.rowh{font-weight:700;font-size:.6rem;letter-spacing:.06em;text-transform:uppercase;color:var(--muted)}
.legend{font-size:.76rem;color:var(--muted);margin:.6rem 0 0;display:flex;gap:1rem;flex-wrap:wrap}
table.plain{border-collapse:collapse;width:100%}
table.plain th{text-align:left;font-size:.62rem;text-transform:uppercase;letter-spacing:.08em;color:var(--muted);padding:.45rem .5rem;border-bottom:1px solid var(--line);font-weight:700}
table.plain td{padding:.45rem .5rem;border-bottom:1px solid var(--hair);font-size:.85rem}
.warnpc{color:var(--amber);font-weight:700}
.inipill{display:inline-block;background:var(--hair);border-radius:8px;padding:.05rem .4rem;font-size:.72rem;font-weight:700;color:var(--muted);margin-left:.35rem}
table.fair{border-collapse:collapse;width:100%}
.fair th{font-size:.6rem;text-transform:uppercase;letter-spacing:.07em;color:var(--muted);font-weight:700}
.fair th,.fair td{padding:.4rem .6rem;border-bottom:1px solid var(--hair);font-size:.82rem;text-align:center}
.fair td:first-child,.fair th:first-child{text-align:left}
.dot{width:8px;height:8px;border-radius:50%;display:inline-block;margin-right:.3rem;vertical-align:baseline}
.fbar{height:6px;background:var(--hair);border-radius:99px;width:64px;display:inline-block;margin-left:.45rem;vertical-align:middle;overflow:hidden}
.fbar-fill{height:100%;border-radius:99px;background:var(--accent);display:block}
#toast{position:fixed;bottom:18px;left:50%;transform:translateX(-50%);background:#2c2c2a;color:#fff;padding:8px 16px;border-radius:10px;font-size:13px;display:none;z-index:50}
/* The log's own rules moved to core.css on 6 Aug, where the renderer that emits those class names
   already lives. Nothing about the change log is this page's to style; only its container is.
   Ali, 6 Aug: "Parity has nothing to do with the residents page." Quite right — the two pages
   share core.js and core.css and nothing else, and the log looking wrong here was never a
   question of matching that page, it was this page having drifted away from the shared renderer. */
/* logPanel's "Nothing to show" / "Nothing matches that". SCOPED to the log deliberately: the
   resident board can afford a bare `.empty` because nothing else there uses the name, but this
   page draws every unfilled pod as `.cell.empty`, and an unscoped rule would put 1.6rem of
   padding inside all thirty-five of them. */
#logBox .empty{color:var(--muted);font-size:.86rem;padding:1.6rem;text-align:center}
/* Below, and only below, is what this page's own container needs — the rest is in core.css.
   The narrow-screen log: a five-column table stays a five-column table on a phone and turns into
   the mess Ali photographed, so under 640px each row folds into two lines — rota day and person
   on top, the move and who did it underneath — and the header is dropped, because an arrow
   between two pod chips says From and To without needing labels. These are keyed on #logBox
   because they restructure the table wholesale, and a page that draws a log somewhere else should
   decide that for itself rather than inherit it. */
@media (max-width:640px){
  #logBox table{display:block}
  #logBox tr{display:grid;grid-template-columns:auto auto 1fr;gap:.15rem .45rem;align-items:center;padding:.5rem 0;border-top:1px solid var(--hair)}
  #logBox tr:first-child{display:none}
  #logBox td{display:block;padding:0 !important;width:auto !important;text-align:left !important;vertical-align:middle}
  #logBox td:nth-child(1){grid-column:1;grid-row:1}
  #logBox td:nth-child(2){grid-column:2/4;grid-row:1;font-size:.9rem}
  #logBox td:nth-child(3){grid-column:1;grid-row:2}
  #logBox td:nth-child(4){grid-column:2;grid-row:2}
  #logBox td:nth-child(5){grid-column:3;grid-row:2;text-align:right !important;font-size:.72rem;color:var(--muted)}
  #logBox .loghead{margin-top:.9rem}
}
.logon{display:inline-block;margin-left:.45rem;font-size:.66rem;font-weight:600;color:var(--muted);background:var(--hair);border-radius:999px;padding:.05rem .42rem;white-space:nowrap}
/* Desktop: the pod labels stay put while the week scrolls sideways. */
@media(min-width:761px){
  table.rota td.rowh{position:sticky;left:0;z-index:6;background:var(--card);box-shadow:1px 0 0 var(--hair)}
  table.rota tr.junrow td.rowh{background:#fafaf8}
  table.rota th:first-child{position:sticky;left:0;z-index:12;background:var(--card)}
}
#teamPanel{display:none;width:186px;flex-shrink:0;background:var(--card);border-right:.5px solid var(--line);padding:1rem .55rem;position:sticky;top:0;height:100vh;overflow-y:auto}
body.teamopen #teamPanel{display:block}
/* "Menu" is a PHONE control and is hidden everywhere else — the resident board's rule, which this
   page had drifted from by showing it always (Ali, 6 Aug: "why is there a random <menu at top, not
   required"). On a phone the team panel slides over the icon rail, so something has to hand you
   back; on a desktop the rail is right there beside the panel and a back button to a menu you can
   already see is just noise. Revealed again in the max-width:760px block below. */
.tpback{display:none;align-items:center;gap:.35rem;background:none;border:0;font:inherit;font-size:.78rem;font-weight:700;color:var(--muted);cursor:pointer;padding:.3rem .55rem .8rem;width:100%;text-align:left}
.tpback svg{width:15px;height:15px}
.tpttl{font-size:.58rem;font-weight:800;letter-spacing:.09em;text-transform:uppercase;color:var(--muted);padding:0 .55rem;margin-bottom:.6rem}
.tpi{display:flex;align-items:center;gap:.6rem;width:100%;background:none;border:0;font:inherit;font-size:.82rem;font-weight:600;color:#4a4f58;padding:.52rem .55rem;border-radius:10px;cursor:pointer;text-align:left}
.tpi svg{width:16px;height:16px;flex-shrink:0;opacity:.55}
.tpi:hover{background:var(--hair)}
.tpi.active{background:var(--accent-bg);color:var(--accent)}
@media(max-width:760px){aside{display:none}main{padding:.6rem .7rem 4rem}#topbar{padding:.8rem .8rem .3rem;gap:.3rem}
  #topbar h1{font-size:1rem}
  .hbtn{font-size:.7rem;padding:.45rem .6rem}
  .hbtn.hicon{width:32px;height:32px;padding:.38rem}
  /* The name is the first thing to give up room — the icons must not wrap. */
  #btnWho{font-size:.64rem;padding:.4rem .5rem;max-width:28vw;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
#teamPanel{position:fixed;left:0;top:0;bottom:0;height:auto;z-index:60;box-shadow:0 0 40px rgba(23,24,28,.18)}
  .tpback{display:flex}}
</style>

</head>
<body>
<div id="layout">
<aside>
  <div class="logo">CCU</div>
  <button data-tab="rota" class="active"><span class="ic"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="5" width="18" height="16" rx="3"/><path d="M8 3v4M16 3v4M3 10h18"/></svg></span>Pods</button>
  <div class="aside-spacer"></div>
  <button class="smallb" id="btnTeam"><span class="ic"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M12 3l7.5 3.6v5c0 4.3-3 8.1-7.5 9.4-4.5-1.3-7.5-5.1-7.5-9.4v-5z"/></svg></span>Rota team</button>
</aside>
<nav id="teamPanel">
  <button id="tpBack" class="tpback"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M15 6l-6 6 6 6"/></svg>Menu</button>
  <div class="tpttl">Rota team</div>
  <button data-tab="ahead" class="tpi"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="5" width="18" height="16" rx="3"/><path d="M8 3v4M16 3v4M3 10h18"/><path d="M11 14l2.5 2.5L11 19"/></svg>Look ahead</button>
  <button data-tab="fair" class="tpi"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M3 13h4l3-8 4 14 3-8h4"/></svg>Fairness</button>
  <button data-tab="log" class="tpi"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="8.5"/><path d="M12 7.5V12l3 2"/></svg>Log</button>
  <button data-tab="setup" class="tpi"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="3.2"/><path d="M19 12a7 7 0 00-.15-1.44l2-1.55-2-3.46-2.37.95a7 7 0 00-2.49-1.44L13.6 2.5h-3.2l-.39 2.56a7 7 0 00-2.49 1.44l-2.37-.95-2 3.46 2 1.55A7 7 0 005 12c0 .49.05.97.15 1.44l-2 1.55 2 3.46 2.37-.95a7 7 0 002.49 1.44l.39 2.56h3.2l.39-2.56a7 7 0 002.49-1.44l2.37.95 2-3.46-2-1.55c.1-.47.15-.95.15-1.44z"/></svg>Setup</button>
</nav>
<div id="content">
<div id="topbar">
  <div><h1>Cover</h1><div style="font-size:.58rem;font-weight:800;letter-spacing:.09em;color:var(--accent);margin-top:-1px">CONSULTANT COVER BY POD</div></div>
  <div class="spacer"></div>
  <button class="hbtn ghost" id="btnWho" title="Changes are logged under this name — click to change who's editing"></button>
  <span id="saveState"></span>
  <button class="hbtn ghost hicon" id="btnJuniors" title="Show the residents in each pod" aria-label="Show residents"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><circle cx="9" cy="8" r="3.2"/><path d="M3.5 19c0-3 2.5-5 5.5-5s5.5 2 5.5 5"/><circle cx="17.5" cy="9" r="2.4"/><path d="M15.5 14.4c2.6-.5 5 1.3 5 4.6"/></svg></button>
  <button class="hbtn ghost hicon" id="btnKey" title="What the colours and pills mean" aria-label="Key"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><circle cx="8" cy="12" r="4"/><path d="M12 12h9"/><path d="M17.5 12v3.2"/><path d="M20.5 12v2.2"/></svg></button>
  <button class="hbtn" id="btnEdit" title="Unlock to change who covers what">Edit</button>
  <button class="hbtn ghost" id="btnDone" title="Back to read-only">Done</button>
</div>
<main>
  <section id="tab-rota">
    <div class="weekbar">
      <button class="navarrow" id="btnPrev" title="Previous week"><svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="2.3" stroke-linecap="round" stroke-linejoin="round"><path d="M15 6l-6 6 6 6"/></svg></button>
      <b id="weekTitle"></b>

<script>
/* Keys: the link's #hash wins, else the small k.js file served alongside the page (window.__POD_KEYS)
   so the plain address works with no link — same trick the resident board uses. */
const q = new URLSearchParams((location.hash || "").replace(/^#/, ""));
const K = window.__POD_KEYS || {};
/* ...and finally the keys this browser already cached, which is what the resident board has always
   done. Without that last step this page was blank anywhere k.js isn't served alongside it — the
   sandbox host being exactly that case. Same list of sources, same order, as index.html. */
const _ls = k => { try { return localStorage.getItem(k) || ""; } catch(e){ return ""; } };
/* Cover reads exactly two things (Ali, 4 Aug 2026):
     READ        the RESIDENT ROTA, read-only — to show which residents sit under each pod
     COVER_READ  the COVER STORE — the allocation this page draws and edits
   There is deliberately no save key for the resident rota: this page must be incapable of
   writing it. And there is nothing else — job plans, PA tariff, list skills, admins and the
   per-consultant PINs moved out to the Consultant Rota store on 4 Aug, because they are a
   different page's business and holding them here is what made "the consultant page" mean
   two things at once. */
const READ  = q.get("r")  || K.r  || _ls("podR");
const COVER_READ = q.get("cv")  || q.get("cr") || K.cv  || K.cr || _ls("podCR");
const COVER_SAVE = q.get("cvs") || q.get("cs") || K.cvs || K.cs || _ls("podCS");
// Remember whatever arrived by link, so the plain address works next time on this device.
try {
  if (q.get("r"))   localStorage.setItem("podR",  q.get("r"));
  if (COVER_READ)   localStorage.setItem("podCR", COVER_READ);
  if (COVER_SAVE)   localStorage.setItem("podCS", COVER_SAVE);
} catch(e){}
/* Test copy: read the live rota, never write it. This page had three separate fetches straight to
   the save flows and no notion of a sandbox at all, so opening it on the staging host would have
   written to the live file — the same "rule enforced in one code path and not another" that has
   caused every real bug on this project. All writes now go through one door. Do not add another
   fetch to SAVE or COVER_SAVE; call postLive. */
const TESTMODE = window.__POD_TEST === true;
const TEST_KEY = "coverTestStore";
/* Can an edit go anywhere? On the live site that means a save key; on the test site it means
   the browser's own sandbox, which is always there. Written once because it was written four
   times as "!COVER_SAVE" and every one of them was wrong on staging — staging has never had a
   save key, so every edit returned before doing anything and a dragged badge snapped straight
   back (Ali, 6 Aug). Nothing said why, because the guard fired before the toast could. */
const canSave = () => !!cdata && (TESTMODE || !!COVER_SAVE);
/* On the test site, saves go to THIS BROWSER and nowhere else. Until 6 Aug they went nowhere at
   all — the page said "saved nowhere" and threw the change away, which meant staging could not
   be used to try anything: you made a change, it vanished, and you learned nothing. The resident
   board has always kept a sandbox copy in localStorage; this is the same thing, so the two sites
   behave the same way. "Reload live cover" throws it away again. */
async function postLive(url, payload){
  if (TESTMODE) {
    try { localStorage.setItem(TEST_KEY, payload); } catch(e){}
    toast("Saved on this test site only — the live cover is untouched");
    return true;
  }
  await fetch(url, { method: "POST", mode: "no-cors", body: new Blob([payload], { type: "application/json" }) });
  return true;
}
let data = null, cdata = null, showJun = false, curWeek = null, EDIT_MODE = false;
const $ = s => document.querySelector(s);
const esc = s => String(s == null ? "" : s).replace(/[&<>"']/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const toast = m => { const t = $("#toast"); t.textContent = m; t.style.display = "block"; clearTimeout(t._h); t._h = setTimeout(() => t.style.display = "none", 3000); };
const DAYS = ["Mon","Tue","Wed","Thu","Fri","Sat","Sun"];
const addDays = (iso, n) => { const d = new Date(iso + "T12:00:00"); d.setDate(d.getDate() + n); return d.toISOString().slice(0,10); };
const mondayOf = iso => { const d = new Date(iso + "T12:00:00"); const k = (d.getDay() + 6) % 7; d.setDate(d.getDate() - k); return d.toISOString().slice(0,10); };
const fmt = iso => new Date(iso + "T12:00:00").toLocaleDateString("en-GB", { day: "numeric", month: "short" });
/* The cover store IS the allocation now — days, map, fair, window and source sit at its top
   level. They used to be wrapped in a key called consRota because the file held other things
   too; inside a file that is only about cover, that wrapper said nothing. CR() stays as the one
   way in, so the rest of the page didn't have to change when the wrapper came off. */
const CR = () => cdata || null;
const nameOf = ini => (CR() && CR().map && CR().map[ini]) || ini;
const PODROWS = [["A","Pod A","var(--podAb)"],["B","Pod B","var(--podBb)"],["C","Pod C","var(--podCb)"],["D","Pod D","var(--podDb)"],["E","Pod E","var(--podEb)"]];
const state = t => { const s = $("#saveState"); s.className = t; s.textContent = t === "saved" ? "Saved" : t === "saving" ? "Saving…" : "Save failed"; };

function weeksAvail(){ return Object.keys((data || {}).weeks || {}).sort(); }

async function load(){
  if (!READ){ $("#weekGrid").innerHTML = "<p style='padding:1rem'>No data key in the link — open this page from the shared Teams link.</p>"; return; }
  const r = await fetch(READ, { method: "POST", headers: { "Content-Type": "application/json" }, body: "{}", cache: "no-store" });
  data = await r.json();
  const wks = weeksAvail();
  const thisMon = mondayOf(new Date().toISOString().slice(0,10));
  curWeek = wks.includes(thisMon) ? thisMon : (wks.find(w => w >= thisMon) || wks[wks.length - 1]);
  state("saved");
  whoBtn();
  await loadC();
  renderAll();
}

/* ── The COVER STORE: its own SharePoint file behind its own flow keys, holding one thing —
   which consultant covers which pod. Its whole shape is:

     v        "cover-1"
     days     { "2026-08-04": { auto: {...}, cur: {...}, note } }   the allocation
     map      { INI: "Full Name" }                                  from the rota workbook
     fair     career A&B vs C&D balance, seeded from the old sheet
     window   the same counts across the weeks the app holds
     source   which workbook it came from, when, what it couldn't read
     pw       the one rota-team password for editing the allocation
     log      cover changes only
     savedAt / savedBy

   Nothing else. A key outside that list means the consultant rota paperwork is being written
   back in and the split is unravelling. */
const COVER_ONLY = ["days","map","fair","window","source","pw","log","v","savedAt","savedBy"];
/* pw is on that list so a carve that moved the old rota-master PIN in here is not thrown away,
   but nothing on this page reads it: editing needs a name, not a password (6 Aug). */
function seedC(){
  return { v: "cover-1", days: {}, map: {}, fair: {}, window: {}, source: {}, log: [] };
}
async function loadC(){
  if (!COVER_READ){ cdata = null; return; }
  try {
    const r = await fetch(COVER_READ, { method: "POST", headers: { "Content-Type": "application/json" }, body: "{}", cache: "no-store" });
    if (!r.ok) throw 0;
    let j = await r.json();
    /* The sandbox copy wins on the test site, so a change made here survives a refresh the way
       it would on the real thing. */
    if (TESTMODE) {
      try { const t = localStorage.getItem(TEST_KEY); if (t) j = JSON.parse(t); } catch(e){}
    }
    cdata = (j && j.v) ? j : seedC();
    /* A store carved before this page was updated, or one the carve hasn't reached yet: take
       the allocation out of the old wrapper so the page draws rather than showing nothing.
       This is a read-side kindness only — the page never writes the wrapper back. */
    if (cdata.consRota){
      for (const k of ["days","map","fair","window","source"])
        if (cdata[k] == null && cdata.consRota[k] != null) cdata[k] = cdata.consRota[k];
      delete cdata.consRota;
    }
  } catch(e){ cdata = seedC(); }
}
/* Anything in the store that is not on cover's list. Today that means the consultant rota's
   paperwork, in a store the carve hasn't reached yet. Written as "not on the list" rather than
   as a list of the six known keys so that whatever gets mixed in NEXT is caught too — the six
   were not predicted either. The page neither reads nor edits any of it; it only needs to
   recognise it, so it can be reported rather than silently mangled. */
const strayPaperwork = () => cdata
  ? Object.keys(cdata).filter(k => !COVER_ONLY.includes(k) && cdata[k] !== undefined)
  : [];

async function saveC(){
  if (!COVER_SAVE || !cdata) return;
  cdata.savedAt = new Date().toISOString();
  /* Cover's keys, plus anything else already in the file, carried through untouched.
     The temptation is to write cover's keys and drop the rest — it would leave a clean file
     in one step. But if split_stores.py has not been run against this store yet, that first
     save would destroy the job plans and PINs with no backup anywhere, and there is no undo
     for that. So the page never deletes: it declines to add, and says so on Setup. The carve
     is a deliberate act with a verified backup, and it stays that way. */
  try { await postLive(COVER_SAVE, JSON.stringify(cdata)); if (!TESTMODE) toast("Saved"); }
  catch(e){ toast("Save failed — try again"); }
}
async function sha(s){
  const b = await crypto.subtle.digest("SHA-256", new TextEncoder().encode(s));
  return [...new Uint8Array(b)].map(x => x.toString(16).padStart(2, "0")).join("");
}
/* One way in to the log, and one shape of entry — the same three-part shape the resident page uses.
   t is when the change was made, on is the rota date it changed (null when it isn't about a
   particular day, e.g. a PIN), and kind separates a person's decision from the software's.
   Every writer on this page goes through here: three of them used to build the entry inline and
   drifted apart, which is why the Log tab had to guess what was a consultant change by pattern-
   matching the message text. */
/* `det` is the STRUCTURED half of an entry, and it is what makes the log readable (Ali, 6 Aug:
   "nice coloured pod letter styling and things missing"). The shared table in core.js draws
   Person / From / To — with the pods as coloured chips and an arrow between them — from `e.d`.
   Failing that it tries to parse the message text, but those regexes were written for the
   RESIDENT board's phrasings and match none of ours. So every row this page has ever written fell
   through to the "one wide cell, no invented columns" fallback: three empty columns and a
   sentence. Nothing about that was fixable with CSS, which is why the log kept looking wrong
   however closely the stylesheet was matched.
   Shape, from core.js: { act:"move", subj:<person>, from:<pod>, to:<pod> }, plus `bench: true`
   for somebody arriving who was not on a pod. Anything that is not a pod move — a COD handover, a
   finish-time swap — deliberately passes no det and stays a plain sentence, because inventing a
   From and a To for it would be worse than leaving them empty. */
function clog(msg, kind, on, whoSuffix, det){
  const who = (localStorage.getItem("consEditor") || "?") + (whoSuffix || "");
  cdata.log = cdata.log || [];
  const e = { t: new Date().toISOString(), who, msg,
              kind: kind === "auto" ? "auto" : "manual", on: on || null };
  if (det) e.d = det;
  cdata.log.unshift(e);
  if (cdata.log.length > 300) cdata.log.length = 300;
}
/* logKind, logOn, groupLog and logDayLabel come from core.js — the resident board reads its
   log the same way, so the reading lives in one place. */

/* Setup. What used to be here was the Admin page: job plans, list skills, the PA tariff, the
   admin list and a PIN of its own to guard them. None of that was cover — it was the consultant
   rota's paperwork, and on 4 Aug 2026 it moved to its own store for its own page, which has not
   been built yet. What is left is the two things Setup is actually for: pointing this page at
   its store, and changing the password that unlocks editing. */
function renderSetup(){
  const box = $("#setupBox");
  if (!box) return;
  if (!COVER_READ){
    box.innerHTML = "<div class='card'><h2>Connect the cover store</h2>" +
      "<p style='font-size:.85rem'>Paste the two flow URLs (Cover Data - Read and - Save) and this builds the full link for this page.</p>" +
      "<input type='text' id='cnR' placeholder='Read flow URL' style='width:100%;margin-bottom:.5rem'>" +
      "<input type='text' id='cnS' placeholder='Save flow URL' style='width:100%;margin-bottom:.7rem'>" +
      "<button class='btn' id='cnGo'>Build link</button>" +
      "<input type='text' id='cnOut' readonly style='width:100%;margin-top:.7rem;display:none' onclick='this.select()'></div>";
    $("#cnGo").onclick = () => {
      const cv = $("#cnR").value.trim(), cvs = $("#cnS").value.trim();
      if (!cv || !cvs) return;
      const o = $("#cnOut");
      o.value = location.origin + location.pathname + "#r=" + encodeURIComponent(READ || "") + "&cv=" + encodeURIComponent(cv) + "&cvs=" + encodeURIComponent(cvs);
      o.style.display = "block"; o.select();
      try { navigator.clipboard.writeText(o.value); toast("Link copied — replace the Teams link with it"); } catch(e){}
      setTimeout(() => { try { location.replace(o.value); } catch(e){} }, 300);
    };
    return;
  }

  let h = "";

  /* Where the data comes from. Two sources, named, so that "why is this person missing?" is
     answerable from the page instead of from the repository. */
  const src = (CR() || {}).source || {};
  /* "not fetched yet" while the page was full of allocations was a fair thing to be cross
     about (Ali, 6 Aug): the rota HAD been read, just not from SharePoint. The fetch has never
     succeeded, so what everything here was built from is the copy of the workbook committed in
     the repo. Saying which is the difference between "something is wrong" and "here is what is
     wrong". */
  const fetched = !!src.name;
  const rotaLine = fetched
    ? esc(src.name) + (src.modified ? " <span class='inipill'>" + esc(String(src.modified).slice(0, 10)) + "</span>" : "")
    : "<b>the copy kept in the repo</b><div style='font-size:.78rem;color:var(--muted);margin-top:.15rem'>" +
      "The SharePoint fetch has never succeeded, so every allocation below was worked out from " +
      "that copy rather than the current rota.</div>";
  h += "<div class='card'><h2>Where this comes from</h2><table class='plain'>" +
    "<tr><td>Consultant rota</td><td>" + rotaLine + "</td></tr>" +
    "<tr><td>Read to</td><td>" + esc(src.sheetUntil || "—") + "</td></tr>" +
    "<tr><td>Resident rota</td><td>" + (data ? Object.keys(data.weeks || {}).length + " week(s), read-only" : "not loaded") + "</td></tr>" +
    "<tr><td>Cover last worked out</td><td>" + esc((cdata && cdata.savedAt) ? shortDate(String(cdata.savedAt).slice(0, 10)) : "—") +
      ((cdata && cdata.savedBy) ? " by " + esc(cdata.savedBy) : "") + "</td></tr>" +
    "</table></div>";

  const unknown = src.unknownInitials || [];
  if (unknown.length)

      unknown.map(esc).join(", ") + "</p></div>";

  /* The "Editing password" card was here. Editing needs no password any more, and the rota-team
     password that guards this page is the board's own — set on the resident board, shared, not
     duplicated here. Two places to change one password is how they end up different. */

  box.innerHTML = h;
}

function consList(){
  const map = (CR() || {}).map || {};
  return Object.keys(map).filter(i => !["FMCN","NET","AC","SF"].includes(i)).sort((a,b) => nameOf(a).localeCompare(nameOf(b)));
}
function consSelect(cls, selected, blankLabel){
  const s = document.createElement("select"); s.className = cls;
  const b = document.createElement("option"); b.value = ""; b.textContent = blankLabel || "—"; s.append(b);
  for (const i of consList()){ const o = document.createElement("option"); o.value = i; o.textContent = i + " — " + nameOf(i); if (i === selected) o.selected = true; s.append(o); }
  if (selected && !consList().includes(selected)){ const o = document.createElement("option"); o.value = selected; o.textContent = selected; o.selected = true; s.append(o); }
  return s;
}
function whoBtn(){
  const w = localStorage.getItem("consEditor");
  $("#btnWho").textContent = w ? nameOf(w) : "Who's editing?";
  $("#btnWho").title = w ? "Changes are logged as " + nameOf(w) + " — click to change" : "Click to say who you are";
}
/* Who's editing. A typeable list of CONSULTANTS ONLY — no residents, because a resident cannot
   put their name to a change on this page. It was a plain dropdown of forty names; typing three
   letters is faster than scrolling on a phone, and a datalist keeps the list there for anyone
   who would rather scroll. The name is what the change log records; the password is what
   actually gates editing, and they are deliberately different questions. */
function pickWho(cb){
  const ov = document.createElement("div"); ov.id = "whoOverlay";
  const box = document.createElement("div"); box.className = "box";
  const t = document.createElement("b"); t.textContent = "Who's editing?";
  const sub = document.createElement("div");
  sub.style.cssText = "font-size:.8rem;color:var(--muted);margin:.2rem 0 .6rem";
  sub.textContent = "Start typing your name. Changes are logged under it.";

  const list = document.createElement("datalist"); list.id = "consNames";
  const names = consList();
  for (const i of names){ const o = document.createElement("option"); o.value = nameOf(i); list.append(o); }

  const inp = document.createElement("input");
  inp.type = "text"; inp.setAttribute("list", "consNames"); inp.autocomplete = "off";
  inp.style.cssText = "width:100%;margin-bottom:.6rem";
  const prev = localStorage.getItem("consEditor");
  inp.placeholder = prev ? "Last time: " + nameOf(prev) : "Start typing…";

  const msg = document.createElement("div");
  msg.style.cssText = "font-size:.78rem;color:var(--red);min-height:1em;margin-bottom:.4rem";

  const ok = document.createElement("button"); ok.className = "btn"; ok.style.width = "100%";
  ok.textContent = "That's me";
  /* Match on the typed name OR the initials, and case-insensitively, because people type "MG"
     as readily as "Murad Ghrew" and neither is wrong. What gets STORED is always the initials,
     so the log stays comparable with the rota sheet. */
  const resolve = v => {
    const q = String(v || "").trim().toLowerCase();
    if (!q) return "";
    return names.find(i => i.toLowerCase() === q)
        || names.find(i => nameOf(i).toLowerCase() === q)
        || names.find(i => nameOf(i).toLowerCase().startsWith(q))
        || "";
  };
  ok.onclick = () => {
    const ini = resolve(inp.value);
    if (!ini){ msg.textContent = names.length ? "Pick a name from the list." : "No consultants loaded yet."; return; }
    localStorage.setItem("consEditor", ini);
    whoBtn(); ov.remove(); if (cb) cb(ini);
  };
  inp.onkeydown = e => { if (e.key === "Enter") ok.click(); };
  ov.onclick = e => { if (e.target === ov) ov.remove(); };
  box.append(t, sub, list, inp, msg, ok); ov.append(box); document.body.append(ov);
  setTimeout(() => inp.focus(), 0);
}
$("#btnWho").onclick = () => pickWho(() => renderAll());

function juniorsFor(dateISO){
  const wk = (data.weeks || {})[mondayOf(dateISO)];
  if (!wk) return null;
  const di = (new Date(dateISO + "T12:00:00").getDay() + 6) % 7;
  const day = wk.days && wk.days[di];
  if (!day) return null;
  /* Surnames alone told a consultant nothing. Carry the same facts the resident board shows —
     shift, phone, airway, shadowing — so both pages describe a person identically. */
  const rec = (id, opts) => {
    const st = (data.staff || []).find(x => x.id === id);
    if (!st) return null;
    return { id, name: st.name.split(" ").pop(), airway: !!st.airway,
             shift: (opts && opts.shift) || "",
             phone: !!(opts && opts.phone),
             shadow: (day.shadow || []).includes(id) };
  };
  const out = { pods: {}, night: [] };
  for (const p of ["A","B","C","D","E"]) {
    out.pods[p] = (((day.pods || {})[p] || {}).assign || [])
      .map(a => rec(a.id, { shift: a.shift, phone: day.phone === a.id })).filter(Boolean);
  }
  out.night = [].concat((day.night || {}).AB || [], (day.night || {}).CDE || [], (day.night || {}).E || [])
    .map(id => rec(id, { shift: "N", phone: (day.night || {}).phone === id })).filter(Boolean);
  return out;
}

/* One resident per row, in a pill, with the same badges the resident board uses. Styling lives in

const SVG_PHONE = '<svg viewBox="0 0 24 24" width="9" height="9" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M6 3h3l2 5-2.5 1.5a12 12 0 006 6L16 13l5 2v3a2 2 0 01-2 2A16 16 0 014 5a2 2 0 012-2z"/></svg>';
const SVG_EYE = '<svg viewBox="0 0 24 24" width="9" height="9" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M2 12s3.6-6 10-6 10 6 10 6-3.6 6-10 6-10-6-10-6z"/><circle cx="12" cy="12" r="2.4"/></svg>';
function resPill(r){
