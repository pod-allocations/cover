<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Cover — TEST</title>
<!-- The ?v= is a cache-buster, and it MUST be bumped whenever core.css or core.js changes.
     Missed on 6 Aug when the change log's rules moved into core.css: the file changed, the version
     did not, so every browser holding the old copy carried on using it — and that copy has no log
     rules in it at all. The page looked exactly as broken as before the fix, which is a miserable
     thing to debug because the HTML is demonstrably new and the stylesheet silently is not. -->
<link rel="stylesheet" href="core.css?v=20260809-02">
<style>
:root{
  /* Everything shared lives in core.css. Only the role accent is this page's. */
  --accent:#b07d1e; --accent-bg:#fdf3df;
}
*{box-sizing:border-box}
body{margin:0;font-family:Inter,-apple-system,"Segoe UI",system-ui,Arial,sans-serif;color:var(--ink);background:var(--bg);font-size:14px;-webkit-font-smoothing:antialiased}
#layout{display:flex;min-height:100vh}
aside{width:78px;background:rgba(255,255,255,.72);backdrop-filter:blur(16px);-webkit-backdrop-filter:blur(16px);border-right:0.5px solid var(--line);display:flex;flex-direction:column;align-items:stretch;padding:.9rem 0;position:sticky;top:0;height:100vh;flex-shrink:0}
/* A LABEL, not a control. It sits where an app icon usually sits, so it was read as a button and
   clicked — and it does nothing, because there is nothing for it to do (Ali, 5 Aug: "the tile
   doesnt do anything... make it greyscale so its obviously not functioning"). Every button in
   this rail is filled and coloured on hover; this is outlined, grey, and inert, which is the
   visual grammar the rest of the page already uses for "this is text". */
aside .logo{margin:0 auto 1.1rem;width:42px;height:42px;border-radius:13px;background:transparent;
  border:1px solid var(--hair);color:var(--muted);font-weight:700;font-size:.66rem;display:flex;
  align-items:center;justify-content:center;letter-spacing:.06em;cursor:default;user-select:none}
aside button{background:none;border:0;color:var(--muted);font-family:inherit;cursor:pointer;padding:.45rem 0;display:flex;flex-direction:column;align-items:center;gap:.28rem;font-size:.58rem;font-weight:600;letter-spacing:.02em}
aside button .ic{width:40px;height:40px;border-radius:13px;display:flex;align-items:center;justify-content:center;transition:background .12s}
aside button .ic svg{width:19px;height:19px}
aside button:hover .ic{background:var(--hair)}
aside button.active{color:var(--ink)}
aside button.active .ic{background:var(--accent-bg);color:var(--accent)}
aside .aside-spacer{flex:1}
#content{flex:1;min-width:0}
/* Solid, not translucent — content must never be visible scrolling through the bar. */
#topbar{background:var(--bg);padding:1rem 1.6rem .4rem;display:flex;align-items:center;gap:.7rem;position:sticky;top:0;z-index:45;min-height:56px;flex-wrap:wrap}
#topbar h1{font-size:1.35rem;margin:0;font-weight:700;letter-spacing:-.01em}
.spacer{flex:1}
.hbtn{background:var(--ink);color:#fff;border:0;border-radius:12px;padding:.52rem 1rem;font-weight:600;font-size:.82rem;cursor:pointer;font-family:inherit}
.hbtn.ghost{background:var(--card);color:var(--ink);border:1px solid var(--line)}
.hbtn:hover{filter:brightness(.95)}
/* Lifted from the resident board unchanged. The two sites are meant to be the same thing with
   different contents, and every place they were allowed to differ "just for now" is a place
   somebody has since had to be told about. */
#testbar{position:fixed;left:0;right:0;bottom:0;z-index:200;background:#8a5a00;color:#fff;display:flex;align-items:center;gap:.8rem;padding:.5rem .9rem calc(.5rem + env(safe-area-inset-bottom));font-size:.78rem}
#testbar b{background:#fff;color:#8a5a00;border-radius:5px;padding:.1rem .4rem;font-size:.62rem;letter-spacing:.08em}
#testbar span{opacity:.92;flex:1;min-width:0}
#testbar .hbtn{background:rgba(255,255,255,.16);color:#fff;border:0;flex-shrink:0}
body.testmode main{padding-bottom:3.4rem}
.stalebar{background:#fdf4f6;border:1px solid var(--podEb);border-radius:10px;padding:.7rem .9rem;
  margin:0 0 .8rem;font-size:.85rem;line-height:1.5;color:var(--ink)}
.stalebar .why{display:block;margin-top:.4rem;font-size:.75rem;color:var(--muted)}
/* Look ahead is the Pods grid; the only thing it adds is a chip in the week bar saying whether
   the week on screen is one everybody can see or one still free to move. That distinction is the
   entire reason the page is behind the shield, so it has to be legible at a glance.
   The chip is always as wide as its LONGEST label, not its current one (Ali, 7 Aug: "it moves
   the position of the next arrow when flicking through quickly"). DRAFT is five characters and
   EVERYONE SEES THIS is eighteen, so a chip sized to its own text made the Next arrow jump
   sideways every time you crossed the four-week line — and crossing that line is exactly when
   you are clicking fastest. Both labels are laid on top of each other in a one-cell grid and the
   long one is kept as an invisible ghost, so the width is measured, never guessed: it stays
   right if the wording or the font ever changes. */
.ahchip{font-size:.58rem;font-weight:800;letter-spacing:.08em;border-radius:999px;padding:.15rem .45rem;
  border:1px solid var(--amber);color:var(--amber);background:var(--amber-bg);white-space:nowrap;
  display:inline-grid;place-items:center}
.ahchip>span{grid-area:1/1}
.ahchip>.ghost{visibility:hidden}
.ahchip.pub{border-color:var(--green);color:var(--green);background:var(--green-bg)}
.navarrow:disabled{opacity:.3;cursor:default}
/* The rota-team lock, copied rule-for-rule from the resident board (Ali, 6 Aug: "why does the
   rota team password gate look different to residents"). It was a floating modal here and a
   page-of-its-own there — the resident board's note explains why that is the right one: "The
   lock is a page of its own, not a dialog: click the shield, the whole pane becomes the password
   box, and only when it clears do the menu and the pages appear behind it." A modal implies you
   can dismiss it and carry on; this says plainly that there is nothing behind it until you're in.
   These belong in core.css next time the two pages are reconciled — they are duplicated for now
   because the resident board is frozen until go-live and must not be touched to make this move. */
.gatebox{max-width:340px;margin:4rem auto;text-align:center}
.gatebox input{width:100%;font-size:1rem;padding:.65rem;margin:.6rem 0;text-align:center}
.gatebox b{display:block;margin-top:.4rem}
.gatebox .sub{font-size:.78rem;color:var(--muted);line-height:1.45;margin-top:.35rem}
body.teamlocked #teamPanel{display:none}
.hbtn.hicon{padding:.42rem;width:34px;height:34px;display:inline-flex;align-items:center;justify-content:center}
.hbtn.hicon svg{width:19px;height:19px;display:block}
.hbtn.on{background:var(--ink);color:#fff;border-color:var(--ink)}
/* One button showing at a time: Edit when reading, Done when editing. The rest of the page
   keys off the same body class rather than each control checking a flag for itself — that
   split is how the resident board ended up editable in two places and locked in a third. */
#btnDone{display:none}
body.editing #btnEdit{display:none}
body.editing #btnDone{display:inline-flex}
body:not(.editing) #btnWho,body:not(.editing) #saveState{display:none}
body.editing #topbar{box-shadow:inset 0 -2px 0 var(--accent)}
#saveState{font-size:.72rem;font-weight:600;padding:.25rem .65rem;border-radius:999px}
#saveState.saved{color:var(--green);background:var(--green-bg)} #saveState.unsaved{color:var(--red);background:var(--red-bg)} #saveState.saving{color:var(--amber);background:var(--amber-bg)}
main{padding:.6rem 1.6rem 4rem;max-width:1550px}
.card{background:var(--card);border:0.5px solid var(--line);border-radius:18px;padding:1.1rem 1.3rem;margin-bottom:1rem}
h2{font-size:.72rem;margin:.1rem 0 .8rem;text-transform:uppercase;letter-spacing:.08em;color:var(--muted);font-weight:700}
button.btn{background:var(--ink);color:#fff;border:0;border-radius:12px;padding:.5rem 1rem;font-weight:600;font-size:.84rem;cursor:pointer;font-family:inherit}
button.btn.sec{background:var(--card);color:var(--ink);border:1px solid var(--line)}
button.btn:hover{filter:brightness(.96)}
.weekbar{display:flex;align-items:center;gap:.5rem;flex-wrap:wrap;margin-bottom:.8rem}
.weekbar b{font-size:.95rem;min-width:215px;text-align:center;font-weight:700;letter-spacing:-.01em}
.navarrow{background:var(--card);border:1px solid var(--line);border-radius:999px;width:36px;height:36px;cursor:pointer;color:var(--muted);display:inline-flex;align-items:center;justify-content:center;transition:background .12s}
.navarrow:hover{background:var(--hair)}
.rota-wrap{background:var(--card);border:0.5px solid var(--line);border-radius:18px;overflow-x:auto;max-width:100%}
table.rota{border-collapse:collapse;width:100%;table-layout:fixed}
table.rota th{background:var(--card);color:var(--muted);font-size:.6rem;overflow-wrap:anywhere;text-transform:uppercase;letter-spacing:.08em;padding:.6rem .6rem;text-align:left;position:sticky;top:0;z-index:10;border-bottom:1px solid var(--line);font-weight:700}
table.rota td{border-bottom:1px solid var(--hair);border-right:1px solid var(--hair);padding:.5rem .45rem;vertical-align:top;overflow-wrap:anywhere}
table.rota td:last-child{border-right:0}
td.rowh{width:52px;font-weight:700;font-size:.85rem}
td.rowh .sub{display:block;font-size:.6rem;font-weight:700;letter-spacing:.06em;text-transform:uppercase;color:var(--muted)}
td.rowh .bar{display:inline-block;width:8px;height:8px;border-radius:50%;margin-right:.4rem}
/* THE PILLS HAVE TO LINE UP DOWN THE COLUMN (Ali, 8 Aug: "its annoyinh to my eyes the 18 and COD
   pills dont quite align"). They didn't, because the pill simply followed the initials and the
   initials are two, three or four characters — so CMAB pushed its pill 15px further right than JH
   did, and the eye reads that ragged edge before it reads anything else.

   The comment at cellHTML has always said the badge is "pinned to the cell's right edge". That was
   the intent and it was never actually implemented: .cellwrap is a flex row and nothing pushed the
   pill anywhere. Pinning it hard right was the other option, but the pod columns are wide, and it
   would have parked the badge an inch from the name it belongs to.

   So the NAME gets the fixed width instead, wide enough for the longest initials anyone has (CMAB),
   and the pills fall into a straight second column a fixed distance from it. Aligned, and still
   next to the person they describe. */
.cell{cursor:pointer;border-radius:8px;padding:.15rem .4rem;display:inline-block;min-width:3.5rem;text-align:left;font-weight:700;font-size:.9rem;letter-spacing:-.01em}
.cell:hover{background:var(--accent-bg)}
.cell.empty{color:#c9cbd1;font-weight:400}
.cell.diff{outline:1.5px dashed var(--amber);color:var(--amber)}
.cellwrap{display:flex;align-items:center;gap:.42rem}
.codpill{flex:0 0 auto;display:inline-block;text-align:center;font-size:.6rem;border-radius:6px;padding:.08rem .35rem;font-weight:600;letter-spacing:.04em;background:transparent;border:1px solid #b4b2a9;color:#444441;cursor:grab}
.codpill:active{cursor:grabbing}
.finpill{flex:0 0 auto;display:inline-block;min-width:20px;text-align:center;font-size:.6rem;border-radius:6px;padding:.08rem .3rem;font-weight:600;letter-spacing:.04em;background:transparent;border:1px solid #fac775;color:#854f0b;cursor:grab}
.finpill:active{cursor:grabbing}
.cell[draggable="true"]{cursor:grab}
.cell[draggable="true"]:active{cursor:grabbing}
td.dropok{outline:2px dashed var(--accent);outline-offset:-3px}
table.rota th.podth{border-top:3px solid var(--line)}
table.rota th .thsub{display:block;font-size:.56rem;letter-spacing:.05em;color:var(--muted)}
.rota .rpills{margin-top:.35rem}
#hovercard{position:fixed;z-index:80;background:var(--card);border:1px solid var(--line);border-radius:12px;padding:.7rem .9rem;max-width:260px;box-shadow:0 8px 24px rgba(23,24,28,.14);font-size:.8rem;display:none;line-height:1.45}
#hovercard b{font-size:.88rem}
#hovercard .hcgrade{display:inline-block;margin-left:.4rem;background:var(--hair);border-radius:8px;padding:.02rem .4rem;font-size:.68rem;font-weight:700;color:var(--muted)}
#hovercard p{margin:.35rem 0 0;color:#4a4f58}
#hovercard .hcsup{margin-top:.4rem;font-size:.7rem;color:var(--muted);font-weight:600}
select.cellsel{border:1px solid #dcdcd8;border-radius:9px;padding:.25rem .3rem;font-size:.8rem;font-family:inherit;background:#fff;max-width:100%}
#whoOverlay{position:fixed;inset:0;background:rgba(23,24,28,.35);display:flex;align-items:center;justify-content:center;z-index:60}
#whoOverlay .box{background:var(--card);border-radius:16px;padding:1.2rem 1.4rem;max-width:320px;width:90%}
#whoOverlay b{display:block;margin-bottom:.6rem}
#whoOverlay select{width:100%;margin-bottom:.7rem}
tr.junrow td{background:#fafaf8;border-bottom:1px solid var(--hair);font-size:.74rem;color:#5a5f68;padding:.3rem .6rem}
tr.junrow td.rowh{font-weight:700;font-size:.6rem;letter-spacing:.06em;text-transform:uppercase;color:var(--muted)}
.legend{font-size:.76rem;color:var(--muted);margin:.6rem 0 0;display:flex;gap:1rem;flex-wrap:wrap}
table.plain{border-collapse:collapse;width:100%}
table.plain th{text-align:left;font-size:.62rem;text-transform:uppercase;letter-spacing:.08em;color:var(--muted);padding:.45rem .5rem;border-bottom:1px solid var(--line);font-weight:700}
table.plain td{padding:.45rem .5rem;border-bottom:1px solid var(--hair);font-size:.85rem}
.warnpc{color:var(--amber);font-weight:700}
.inipill{display:inline-block;background:var(--hair);border-radius:8px;padding:.05rem .4rem;font-size:.72rem;font-weight:700;color:var(--muted);margin-left:.35rem}
/* The attention panel — an unnamed consultant is the one thing on Setup a person can fix in ten
   seconds, so it is tinted and sits above everything else rather than reading as another table. */
.card.attn{background:var(--amber-bg);border-color:var(--amber)}
/* The Look ahead bar. This was three sentences of prose — how far the rota reached, which weeks
   were public, and whether anything was held by hand (Ali, 8 Aug: "looks messy and unprofessional
   with stupid explainers"). Rule 2 says a screen that needs explaining should be redrawn instead,
   so every one of those facts is now a mark you read rather than a line you read: the ribbon is
   the whole horizon, solid for the weeks everyone can see and pale for draft, amber where somebody
   has overridden the algorithm, and outlined on the week you are looking at. The held-by-hand
   sentence became a count, because that is all it ever was. */
/* The Attention page and the Staff page. Both are lists of rows rather than cards, because a
   dense list of things to deal with reads faster than a stack of boxes. */
/* Every card behind the shield opens with one of these. It used to carry its own spacing inline
   at each of the five call sites, so the gap under the label was .7rem in some cards, nothing in
   others, and the labels themselves sat at different heights down the page. The spacing belongs
   to the label, not to whoever remembered to type it. */
.sectlab{display:block;font-size:.68rem;font-weight:700;letter-spacing:.07em;color:var(--muted);
  margin-bottom:.7rem}
.stafftop .sectlab{margin-bottom:0}
.cnt{font-size:.68rem;font-weight:600;color:var(--muted);background:var(--hair);
  padding:.15rem .5rem;border-radius:999px}
.cnt.warn{color:var(--amber);background:var(--amber-bg)}
.stafftop{display:flex;align-items:center;gap:.5rem;margin-bottom:.75rem;flex-wrap:wrap}
.nmin.miss{border-color:var(--amber);background:var(--amber-bg)}
.attnrow{display:flex;align-items:flex-start;gap:.65rem;padding:.7rem 0;
  border-top:1px solid var(--hair)}
.attnrow:first-child{border-top:0}
.attnrow .dot{width:7px;height:7px;border-radius:50%;background:var(--amber);
  margin-top:.42rem;flex:none}
.attnrow .txt{flex:1;min-width:0}
.attnrow .txt b{font-size:.87rem;font-weight:600;display:block}
.attnrow .sub{font-size:.76rem;color:var(--muted);margin-top:.12rem;line-height:1.4}
.attnrow .btn{flex:none;font-size:.76rem;padding:.3rem .7rem}
.tpbadge{margin-left:auto;font-size:.62rem;font-weight:700;color:#fff;background:var(--amber);
  border-radius:999px;padding:.05rem .38rem;min-width:1.1rem;text-align:center}
.srcgrid{display:grid;grid-template-columns:repeat(auto-fit,minmax(9rem,1fr));gap:.6rem}
.srcgrid span{display:block;font-size:.7rem;color:var(--muted)}
.srcgrid b{font-size:.83rem;font-weight:600}
/* The name of a source, and what it is. Both sources use it, so they read as two of the same
   thing rather than one designed row and one paragraph that happened to be there. */
.srcname{margin-bottom:.7rem}
.srcname b{font-size:.9rem;font-weight:600;display:block}
.srcname span{display:block;font-size:.75rem;color:var(--muted);line-height:1.45;margin-top:.15rem}
.srcsplit{height:1px;background:var(--hair);margin:1rem 0}
.balrow{display:flex;gap:1.3rem;flex-wrap:wrap}
.balrow label{display:flex;align-items:center;gap:.5rem;font-size:.85rem}
.balrow input{width:4.6rem}
.lockreset{display:inline-block;margin-top:.75rem;font-size:.72rem;color:var(--muted)}
/* A day the sync could not resolve. Amber only behind the shield: the rota team can act on it,
   and nobody else can (Ali, 8 Aug — "if its a complex swap needs admin involvement so should sit
   behind admin really"). */
body.teamopen tr.needs td.rowh{background:var(--amber-bg);color:var(--amber);
  box-shadow:inset 3px 0 0 var(--amber)}
.ahbar .top{display:flex;align-items:baseline;gap:.5rem;flex-wrap:wrap}
.ahrib{display:flex;gap:2px;height:10px;margin-top:.85rem}
.ahrib span{flex:1;border-radius:2px;background:var(--hair);min-width:3px}
.ahrib span.live{background:var(--podAb)}
.ahrib span.held{background:var(--amber)}
.ahrib span.now{outline:2px solid var(--ink);outline-offset:1px}
.ahkey{display:flex;gap:.9rem;margin-top:.65rem;flex-wrap:wrap}
.ahkey span{font-size:.72rem;color:var(--muted);display:flex;align-items:center;gap:.35rem}
.ahkey i{width:9px;height:9px;border-radius:2px;display:inline-block;font-style:normal}
.heldchip{font-size:.72rem;font-weight:600;color:var(--amber);background:var(--amber-bg);
  padding:.2rem .55rem;border-radius:999px}
/* ── ONE CONTROL, ONE TABLE — 8 Aug ───────────────────────────────────────────────────────────
   Ali: "on some of the cover rota team bits boxes are poorly rendeerd and incosistent use of
   tabling, just make all look bettter and high end."

   Both halves of that had the same cause. `.nmin` was a properly drawn control — but only things
   given that class got it, and plenty were not: the change log's search box and its two
   dropdowns, the gate's password field, the two flow-URL fields in Setup, the three number
   fields on the balance page. Those fell back to whatever the browser draws, and a page carrying
   two kinds of box looks less finished than one carrying only plain ones, because the difference
   is what the eye lands on.

   So the ELEMENT gets the style and `.nmin` keeps only the layout it adds. Nothing has to
   remember a class, and a control added tomorrow is right without anybody thinking about it.
   Kept at element specificity (0,0,1) on purpose: `.nmin.miss`, `select.cellsel` and
   `.balrow input` all still win where they say something different. */
input,select,textarea{font-family:inherit;font-size:.85rem;color:var(--ink);background:var(--card);
  padding:.42rem .6rem;border:1px solid var(--line);border-radius:9px;
  -webkit-appearance:none;appearance:none;transition:border-color .12s,box-shadow .12s}
/* The chevron is drawn, not native. A native select arrow is a different shape, weight and colour
   in every browser and on every platform, and next to a hand-built page it is the single most
   obvious tell that a control was not designed. Same mark on the pod-cell pickers, tighter. */
select{cursor:pointer;padding-right:1.75rem;background-repeat:no-repeat;
  background-position:right .6rem center;
  background-image:url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='10' height='7' viewBox='0 0 10 7'><path d='M1 1.5L5 5.5L9 1.5' fill='none' stroke='%238c8a84' stroke-width='1.6' stroke-linecap='round' stroke-linejoin='round'/></svg>")}
select.cellsel{padding-right:1.3rem;background-position:right .38rem center}
input:focus,select:focus,textarea:focus{outline:none;border-color:var(--accent);
  box-shadow:0 0 0 3px var(--accent-bg)}
input:hover:not(:focus),select:hover:not(:focus){border-color:#cfcdc6}
input::placeholder{color:var(--muted);opacity:.85}
/* Read-only means read-only, and should look it rather than inviting a click and doing nothing. */
input[readonly]{background:var(--hair);color:var(--muted);cursor:default}
input[readonly]:focus{border-color:var(--line);box-shadow:none}
input[type=number]{text-align:right}
.nmrow{display:flex;align-items:center;gap:.5rem;margin-bottom:.45rem;flex-wrap:wrap}
.nmrow .inipill{margin-left:0;min-width:3.2rem;text-align:center;font-size:.78rem;color:var(--ink)}
.nmin{flex:1;min-width:190px}
/* The tables. There are three on this page — the week grid, Fairness, and the change log — and
   they had three different header treatments, three paddings and three border weights. A table
   header is the same idea everywhere it appears, so it is written once and the tables differ only
   where their CONTENT differs. */
table.fair{border-collapse:collapse;width:100%}
.fair th{font-size:.6rem;text-transform:uppercase;letter-spacing:.07em;color:var(--muted);font-weight:700;
  padding-bottom:.5rem;border-bottom:1px solid var(--line)}
.fair th,.fair td{padding:.45rem .6rem;border-bottom:1px solid var(--hair);font-size:.82rem;text-align:center}
.fair tbody tr:last-child td,.fair tr:last-child td{border-bottom:0}
.fair td:first-child,.fair th:first-child{text-align:left}
.fair tr:hover td{background:#faf9f6}
.dot{width:8px;height:8px;border-radius:50%;display:inline-block;margin-right:.3rem;vertical-align:baseline}
.fbar{height:6px;background:var(--hair);border-radius:99px;width:64px;display:inline-block;margin-left:.45rem;vertical-align:middle;overflow:hidden}
.fbar-fill{height:100%;border-radius:99px;background:var(--accent);display:block}
#toast{position:fixed;bottom:18px;left:50%;transform:translateX(-50%);background:#2c2c2a;color:#fff;padding:8px 16px;border-radius:10px;font-size:13px;display:none;z-index:50}
/* ── FEEDBACK — 8 Aug ─────────────────────────────────────────────────────────────────────────
   Ali: "it also needs the feedback page and button just identical to residents (visually and
   functionally)." Every rule below is COPIED from the resident board rather than written afresh,
   because "identical" is a promise that only holds if there is one source for it. Where the two
   boards were each allowed their own version of a thing — the password gate, the change log —
   they drifted, and somebody then had to be told about the difference. Same values, same names.
   The pulse is the point: feedback is a trial-only ask, so it earns one quiet dot and no more. */
#btnFeedback{position:relative;border-color:#c7cdf2;color:var(--accent);background:var(--accent-bg)}
#btnFeedback::after{content:"";position:absolute;top:-3px;right:-3px;width:8px;height:8px;
  border-radius:50%;background:var(--accent);animation:fbpulse 2.8s ease-out infinite}
@keyframes fbpulse{0%{box-shadow:0 0 0 0 rgba(76,93,214,.45)}65%{box-shadow:0 0 0 7px rgba(76,93,214,0)}100%{box-shadow:0 0 0 0 rgba(76,93,214,0)}}
@media (prefers-reduced-motion:reduce){#btnFeedback::after{animation:none}}
/* The unread count on the rail. `tpc` is the resident board's name for it, kept so the two
   stylesheets can be read side by side. Cover's own amber `tpbadge` stays what it is — that one
   counts things needing a decision, this one counts things needing reading. */
.tpc{margin-left:auto;background:var(--red,#c0392b);color:#fff;font-size:.58rem;font-weight:800;
  border-radius:999px;padding:.05rem .35rem;display:none}
.tpc.on{display:inline-block}
.adlbl{display:block;font-size:.72rem;color:var(--muted);margin:.7rem 0 .3rem;font-weight:600}
.seg{display:flex;gap:.3rem}
.segbtn{flex:1;font-size:.78rem;font-weight:600;background:var(--card);color:var(--ink);
  border:1px solid var(--line);border-radius:9px;padding:.5rem .3rem;cursor:pointer;font-family:inherit}
.segbtn.on{background:var(--ink);color:#fff;border-color:var(--ink)}
.attnclear{text-align:center;padding:2.4rem 1rem;color:var(--muted)}
.attnclear b{display:block;font-size:1rem;color:var(--ink);margin-bottom:.3rem}
#modalBg{position:fixed;inset:0;background:rgba(20,21,29,.38);backdrop-filter:blur(3px);
  display:none;align-items:center;justify-content:center;z-index:100}
#modal{background:var(--card);border-radius:20px;padding:1.5rem 1.7rem;max-width:640px;width:94%;
  max-height:88vh;overflow:auto;box-shadow:0 24px 60px rgba(20,21,29,.22);animation:dlgin .15s ease}
#modal h3{margin:0;font-size:1.05rem}
@keyframes dlgin{from{opacity:0;transform:translateY(6px) scale(.99)}to{opacity:1;transform:none}}
.modalbtns{display:flex;gap:.6rem;justify-content:flex-end;margin-top:.8rem}
/* The log's own rules moved to core.css on 6 Aug, where the renderer that emits those class names
   already lives. Nothing about the change log is this page's to style; only its container is.
   Ali, 6 Aug: "Parity has nothing to do with the residents page." Quite right — the two pages
   share core.js and core.css and nothing else, and the log looking wrong here was never a
   question of matching that page, it was this page having drifted away from the shared renderer. */
/* logPanel's "Nothing to show" / "Nothing matches that". SCOPED to the log deliberately: the
   resident board can afford a bare `.empty` because nothing else there uses the name, but this
   page draws every unfilled pod as `.cell.empty`, and an unscoped rule would put 1.6rem of
   padding inside all thirty-five of them. */
#logBox .empty{color:var(--muted);font-size:.86rem;padding:1.6rem;text-align:center}
/* ── THE CHANGE LOG'S COLUMNS — 8 Aug ─────────────────────────────────────────────────────────
   Why it looked wrong: core.js draws the table `table-layout:fixed`, and under fixed layout the
   column widths come from the FIRST row only. The first row is the header, and the headers carry
   no widths — so the careful percentages on the body cells were never read at all and the browser
   split the table into five equal columns. That is the whole of Ali's "inconsistent tabling": a
   two-character pod chip given the same fifth of the page as a person's name, so From and To sat
   at opposite ends of a gap and BY floated in an ocean of nothing.
   The widths therefore go on the header cells, which is the only place the layout looks. */
#logBox th:nth-child(1){width:5.6rem}
#logBox th:nth-child(3),#logBox th:nth-child(4){width:4.6rem}
#logBox th:nth-child(5){width:9.2rem}
/* From and To are one fact — a person moved — so the two chips meet in the middle with the arrow
   between them, instead of being centred in their own columns and reading as two unrelated pills.
   The headers follow the chips rather than the other way round. */
#logBox td.logfrom{text-align:right !important;padding-right:0 !important}
#logBox td.logfrom + td{text-align:left !important;padding-left:.5rem !important}
#logBox th:nth-child(3){text-align:right !important;padding-right:.9rem !important}
#logBox th:nth-child(4){text-align:left !important;padding-left:.5rem !important}
#logBox th{padding-bottom:.45rem !important;border-bottom:1px solid var(--line)}
/* Fixed layout lets content run past its column rather than widening it, and one long name or a
   pasted date range would have sat on top of the next cell. */
#logBox td{overflow-wrap:anywhere}
#logBox .logrow:hover td{background:#faf9f6}
#logBox table{margin-bottom:.2rem !important}
/* Below, and only below, is what this page's own container needs — the rest is in core.css.
   The narrow-screen log: a five-column table stays a five-column table on a phone and turns into
   the mess Ali photographed, so under 640px each row folds into two lines — rota day and person
   on top, the move and who did it underneath — and the header is dropped, because an arrow
   between two pod chips says From and To without needing labels. These are keyed on #logBox
   because they restructure the table wholesale, and a page that draws a log somewhere else should
   decide that for itself rather than inherit it. */
@media (max-width:640px){
  #logBox table{display:block}
  #logBox tr{display:grid;grid-template-columns:auto auto 1fr;gap:.15rem .45rem;align-items:center;padding:.5rem 0;border-top:1px solid var(--hair)}
  #logBox tr:first-child{display:none}
  #logBox td{display:block;padding:0 !important;width:auto !important;text-align:left !important;vertical-align:middle}
  #logBox td:nth-child(1){grid-column:1;grid-row:1}
  #logBox td:nth-child(2){grid-column:2/4;grid-row:1;font-size:.9rem}
  #logBox td:nth-child(3){grid-column:1;grid-row:2}
  #logBox td:nth-child(4){grid-column:2;grid-row:2}
  #logBox td:nth-child(5){grid-column:3;grid-row:2;text-align:right !important;font-size:.72rem;color:var(--muted)}
  #logBox .loghead{margin-top:.9rem}
}
.logon{display:inline-block;margin-left:.45rem;font-size:.66rem;font-weight:600;color:var(--muted);background:var(--hair);border-radius:999px;padding:.05rem .42rem;white-space:nowrap}
/* Desktop: the pod labels stay put while the week scrolls sideways. */
@media(min-width:761px){
  table.rota td.rowh{position:sticky;left:0;z-index:6;background:var(--card);box-shadow:1px 0 0 var(--hair)}
  table.rota tr.junrow td.rowh{background:#fafaf8}
  table.rota th:first-child{position:sticky;left:0;z-index:12;background:var(--card)}
}
#teamPanel{display:none;width:186px;flex-shrink:0;background:var(--card);border-right:.5px solid var(--line);padding:1rem .55rem;position:sticky;top:0;height:100vh;overflow-y:auto}
body.teamopen #teamPanel{display:block}
/* "Menu" is a PHONE control and is hidden everywhere else — the resident board's rule, which this
   page had drifted from by showing it always (Ali, 6 Aug: "why is there a random <menu at top, not
   required"). On a phone the team panel slides over the icon rail, so something has to hand you
   back; on a desktop the rail is right there beside the panel and a back button to a menu you can
   already see is just noise. Revealed again in the max-width:760px block below. */
.tpback{display:none;align-items:center;gap:.35rem;background:none;border:0;font:inherit;font-size:.78rem;font-weight:700;color:var(--muted);cursor:pointer;padding:.3rem .55rem .8rem;width:100%;text-align:left}
.tpback svg{width:15px;height:15px}
.tpttl{font-size:.58rem;font-weight:800;letter-spacing:.09em;text-transform:uppercase;color:var(--muted);padding:0 .55rem;margin-bottom:.6rem}
.tpi{display:flex;align-items:center;gap:.6rem;width:100%;background:none;border:0;font:inherit;font-size:.82rem;font-weight:600;color:#4a4f58;padding:.52rem .55rem;border-radius:10px;cursor:pointer;text-align:left}
.tpi svg{width:16px;height:16px;flex-shrink:0;opacity:.55}
.tpi:hover{background:var(--hair)}
.tpi.active{background:var(--accent-bg);color:var(--accent)}
/* THE TABLE SCROLLS IN ITS OWN PANE, not by widening the page (Ali, 9 Aug: "the scroll to see the
   oncall/fgh is glitchy. Scrolls the whole page and the top header doesnt extend that far - surely
   would be better if it was just the table that scrolled within its pane").

   He was right, and the measurement was stark: a 1512px viewport against a 1733px document, so the
   page slid 221px sideways while the sticky topbar — sized to the viewport at 1434px — stopped
   dead and left bare background beside it.

   Three rules, and they have to arrive together. `overflow:auto` makes the wrapper the scroll
   container, which is the fix, but it also means the header row's `position:sticky` is no longer
   measured against the VIEWPORT — so `top` becomes 0 (the pane's own top edge) rather than the
   topbar's height, or the header silently stops sticking. And once the pane scrolls sideways the
   day column has to be pinned with `left:0`, or you scroll to Fairfield and can no longer see
   which day you are looking at, which is worse than the problem being fixed.

   `border-collapse:separate` because collapsed borders are owned by the table rather than the
   cell, and a sticky cell carries its own border away with it, leaving a gap that flickers as you
   scroll. The seam is drawn with box-shadow instead, which travels with the cell. */
/* THE DAY STRIP IS PHONE-ONLY, AND HAS TO BE HIDDEN HERE (Ali, 9 Aug: "theres a weird day grey
   boxes showing above header row on desktiop now"). It is drawn into every grid unconditionally so
   the JS never has to measure a viewport, which is right — but the rules that style it all live in
   the max-width:760px block, so on a desktop the browser was left rendering a bare div of seven
   default-styled buttons above the table. My comment at dayStripHTML claimed it was "hidden by CSS
   above 760px" and I never wrote the line that hid it. Default OFF, and the media query turns it
   on: a thing that appears only on phones should be absent by default, not present by default and
   removed, or exactly this happens again. */
.daypills{display:none}
.rota-wrap{overflow:auto;max-height:calc(100vh - 168px);overscroll-behavior:contain}
table.rota{border-collapse:separate;border-spacing:0}
table.rota th{position:sticky;top:0;z-index:30;background:var(--card);
  box-shadow:inset 0 -1px 0 var(--line)}
table.rota td.rowh{position:sticky;left:0;z-index:20;background:var(--card);
  box-shadow:inset -1px 0 0 var(--hair)}
table.rota th:first-child{left:0;z-index:40}

/* THE BUTTON BAR (Ali, 9 Aug: "when editing the button height in the bar becomes inconsistent
   (some double line some single"). One cause, not several: `.pill`, `.chip` and `.statchip` all
   carry white-space:nowrap and the BUTTONS were missed, so a label like "Auto-fill week" wrapped
   to two lines and that button alone grew. `.weekbar` centres rather than stretches, so its
   neighbours stayed short and the bar went ragged. Arrows are a fixed 36px square while the text
   buttons computed to about 26px, so they were never quite level even on one line — hence one
   height for everything in the bar rather than a nudge per button. */
button.btn,.hbtn{white-space:nowrap}
.weekbar>button,.weekbar .btn{min-height:36px;display:inline-flex;align-items:center}

@media(max-width:760px){aside{display:none}main{padding:.6rem .7rem 4rem}#topbar{padding:.8rem .8rem .3rem;gap:.3rem}
  #topbar h1{font-size:1rem}
  .hbtn{font-size:.7rem;padding:.45rem .6rem}
  .hbtn.hicon{width:32px;height:32px;padding:.38rem}
  /* The name is the first thing to give up room — the icons must not wrap. */
  #btnWho{font-size:.64rem;padding:.4rem .5rem;max-width:28vw;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
#teamPanel{position:fixed;left:0;top:0;bottom:0;height:auto;z-index:60;box-shadow:0 0 40px rgba(23,24,28,.18)}
  .tpback{display:flex}

  /* THE PHONE LAYOUT. Seven days by seven columns is 49 cells and will not go on a phone however
     it is arranged, so — exactly as the Pod Board does — ONE day shows and a strip of pills moves
     between them. The pane stops being a scroll container here; there is nothing to scroll
     sideways once the table is a grid. */
  .rota-wrap{overflow:visible;max-height:none;border:0;background:transparent}
  .daypills{display:flex;gap:3px;margin:0 0 .6rem}
  .daypill{flex:1;min-width:0;background:var(--card);border:0.5px solid var(--line);border-radius:9px;
    padding:.4rem .1rem;font:inherit;font-size:.62rem;font-weight:600;line-height:1.25;color:var(--ink);
    cursor:pointer;text-align:center}
  .daypill span{display:block;font-size:.58rem;font-weight:500;color:var(--muted)}
  .daypill.wknd{background:var(--hair);color:var(--muted)}
  .daypill.active{background:var(--ink);color:#fff;border-color:var(--ink)}
  .daypill.active span{color:rgba(255,255,255,.75)}

  table.rota,table.rota tbody{display:block}
  table.rota tr:first-child{display:none}            /* the column headings; each card says its own */
  tr.dayrow{display:none}
  tr.dayrow.mday{display:grid;grid-template-columns:1fr 1fr;gap:.35rem}
  tr.dayrow td.rowh{display:none}                    /* the day is in the strip */
  tr.dayrow td{display:block;border:0;border-radius:12px;padding:.55rem .65rem;box-shadow:none}
  /* DOM order is A B C D E oncall fgh; the ROW we want is E beside Fairfield with on call spanning
     underneath (Ali's call, and better than mine — on call is the one thing on the day that is not
     a place, so the full width says so). `order` does it without a second markup path. */
  td.col-fgh{order:1;background:#fbfbf9;box-shadow:inset 0 0 0 0.5px var(--line)!important}
  td.col-oncall{order:2;grid-column:1 / -1;background:var(--card);
    box-shadow:inset 0 0 0 0.5px var(--line)!important}
  td.col-fgh.empty{display:none}                     /* blank most weekends; an empty labelled box is a small lie */
  tr.dayrow td::before{display:block;font-size:.55rem;font-weight:700;letter-spacing:.08em;
    text-transform:uppercase;margin-bottom:.1rem;color:var(--muted)}
  td.col-A::before{content:"Pod A";color:var(--podAb)}
  td.col-B::before{content:"Pod B";color:var(--podBb)}
  td.col-C::before{content:"Pod C";color:var(--podCb)}
  td.col-D::before{content:"Pod D";color:var(--podDb)}
  td.col-E::before{content:"Pod E";color:var(--podEb)}
  td.col-oncall::before{content:"On call"}
  td.col-fgh::before{content:"Fairfield"}
  /* The initials get BIGGER than desktop, not smaller: the card has the room, and they are the
     one thing on it anybody came to read. */
  tr.dayrow .cell{font-size:1.15rem;min-width:0;padding:0;background:transparent}
  tr.dayrow .cell:hover{background:transparent}
  tr.dayrow .cellwrap{gap:.4rem;align-items:flex-end}
  tr.dayrow .codpill,tr.dayrow .finpill{margin-left:auto}
  /* Residents on: three name pills will not sit in half a phone, so the grid drops to one column
     and the day scrolls. The layout follows the content instead of fighting it — one class, no
     second layout to keep in step. */
  body.showjun tr.dayrow.mday{grid-template-columns:1fr}
  body.showjun td.col-oncall{grid-column:auto}
  tr.dayrow .rpills{margin-top:.4rem}}
</style>

</head>
<body>
<div id="layout">
<aside>
  <div class="logo">CCU</div>
  <button data-tab="rota" class="active"><span class="ic"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="5" width="18" height="16" rx="3"/><path d="M8 3v4M16 3v4M3 10h18"/></svg></span>Pods</button>
  <div class="aside-spacer"></div>
  <button class="smallb" id="btnTeam"><span class="ic"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M12 3l7.5 3.6v5c0 4.3-3 8.1-7.5 9.4-4.5-1.3-7.5-5.1-7.5-9.4v-5z"/></svg></span>Rota team</button>
</aside>
<nav id="teamPanel">
  <button id="tpBack" class="tpback"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M15 6l-6 6 6 6"/></svg>Menu</button>
  <div class="tpttl">Rota team</div>
  <button data-tab="attn" class="tpi"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M12 3.5a6 6 0 00-6 6c0 4-2 5-2 5h16s-2-1-2-5a6 6 0 00-6-6z"/><path d="M10.5 20.5a2 2 0 003 0"/></svg>Attention<span id="attnBadge" class="tpbadge"></span></button>
  <button data-tab="ahead" class="tpi"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="5" width="18" height="16" rx="3"/><path d="M8 3v4M16 3v4M3 10h18"/><path d="M11 14l2.5 2.5L11 19"/></svg>Look ahead</button>
  <button data-tab="fair" class="tpi"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M3 13h4l3-8 4 14 3-8h4"/></svg>Fairness</button>
  <button data-tab="log" class="tpi"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="8.5"/><path d="M12 7.5V12l3 2"/></svg>Log</button>
  <button data-tab="staff" class="tpi"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><circle cx="9" cy="8" r="3.2"/><path d="M3.5 19c0-3 2.5-5 5.5-5s5.5 2 5.5 5"/><circle cx="17.5" cy="9" r="2.4"/><path d="M15.5 14.4c2.6-.5 5 1.3 5 4.6"/></svg>Staff</button>
  <button data-tab="feedback" class="tpi"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M4 5h16v11H8l-4 4z"/></svg>Feedback<span class="tpc" id="tabFbCount"></span></button>
  <button data-tab="setup" class="tpi"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="3.2"/><path d="M19 12a7 7 0 00-.15-1.44l2-1.55-2-3.46-2.37.95a7 7 0 00-2.49-1.44L13.6 2.5h-3.2l-.39 2.56a7 7 0 00-2.49 1.44l-2.37-.95-2 3.46 2 1.55A7 7 0 005 12c0 .49.05.97.15 1.44l-2 1.55 2 3.46 2.37-.95a7 7 0 002.49 1.44l.39 2.56h3.2l.39-2.56a7 7 0 002.49-1.44l2.37.95 2-3.46-2-1.55c.1-.47.15-.95.15-1.44z"/></svg>Setup</button>
</nav>
<div id="content">
<div id="topbar">
  <div><h1>Cover</h1><div style="font-size:.58rem;font-weight:800;letter-spacing:.09em;color:var(--accent);margin-top:-1px">CONSULTANT COVER BY POD</div></div>
  <div class="spacer"></div>
  <button class="hbtn ghost" id="btnWho" title="Changes are logged under this name — click to change who's editing"></button>
  <span id="saveState"></span>
  <button class="hbtn ghost hicon" id="btnJuniors" title="Show the residents in each pod" aria-label="Show residents"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><circle cx="9" cy="8" r="3.2"/><path d="M3.5 19c0-3 2.5-5 5.5-5s5.5 2 5.5 5"/><circle cx="17.5" cy="9" r="2.4"/><path d="M15.5 14.4c2.6-.5 5 1.3 5 4.6"/></svg></button>
  <button class="hbtn ghost hicon" id="btnKey" title="What the colours and pills mean" aria-label="Key"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><circle cx="8" cy="12" r="4"/><path d="M12 12h9"/><path d="M17.5 12v3.2"/><path d="M20.5 12v2.2"/></svg></button>
  <!-- Open to everyone, no unlock. Same icon, same position in the row and same pulse as the
       resident board's, because a consultant who has used one board should not have to find it
       again on the other. -->
  <button class="hbtn ghost hicon" id="btnFeedback" title="Feedback" aria-label="Feedback"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M20 15.5a2.5 2.5 0 01-2.5 2.5H8l-4 3V6.5A2.5 2.5 0 016.5 4h11A2.5 2.5 0 0120 6.5z"/></svg></button>
  <button class="hbtn" id="btnEdit" title="Unlock to change who covers what">Edit</button>
  <button class="hbtn ghost" id="btnDone" title="Back to read-only">Done</button>
</div>
<main>
  <section id="tab-rota">
    <div class="weekbar">
      <button class="navarrow" id="btnPrev" title="Previous week"><svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="2.3" stroke-linecap="round" stroke-linejoin="round"><path d="M15 6l-6 6 6 6"/></svg></button>
      <b id="weekTitle"></b>
      <button class="navarrow" id="btnNext" title="Next week"><svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="2.3" stroke-linecap="round" stroke-linejoin="round"><path d="M9 6l6 6-6 6"/></svg></button>
      <button class="btn sec" id="btnToday" style="font-size:.78rem;padding:.35rem .7rem">This week</button>
    </div>
    <div class="rota-wrap"><div id="weekGrid"></div></div>
  </section>
  <section id="tab-lock" style="display:none">
    <div class="gatebox">
      <div class="card">
        <svg viewBox="0 0 24 24" width="30" height="30" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round"><rect x="5" y="11" width="14" height="9" rx="2.5"/><path d="M8 11V8a4 4 0 018 0v3"/></svg>
        <b id="lockTitle">Rota team</b>
        <div class="sub" id="lockSub"></div>
        <input type="password" id="lockPw" placeholder="Password">
        <button class="btn" id="lockBtn" style="width:100%">Unlock</button>
        <div id="lockMsg" style="font-size:.78rem;color:var(--red);min-height:1em;margin-top:.3rem"></div>
        <a href="#" id="lockReset" class="lockreset">Reset password</a>
        <div id="lockResetBox" style="display:none;margin-top:.6rem">
          <select id="lockAdmin" style="width:100%;margin-bottom:.5rem"></select>
          <button class="btn sec" id="lockSend" style="width:100%">Send link</button>
        </div>
      </div>
    </div>
  </section>
  <section id="tab-ahead" style="display:none">
    <div class="weekbar">
      <button class="navarrow" id="ahPrev" title="Previous week"><svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="2.3" stroke-linecap="round" stroke-linejoin="round"><path d="M15 6l-6 6 6 6"/></svg></button>
      <b id="ahTitle"></b>

      "<label><input type='number' id='setCap' step='0.01' min='0' max='0.5' value='" + cap + "'>" +
        "<span>correct beyond</span></label>" +
      "<label><input type='number' id='setHard' step='0.01' min='0' max='0.5' value='" + hard + "'>" +
        "<span>override a weekend beyond</span></label>" +
    "</div></div>";

  /* WHO CAN ALLOW A RESET. Full addresses only here, behind the shield — the lock screen shows them
     masked, because anybody with the link reaches the lock screen and there is no reason to publish
     consultants' email addresses to them. */
  const admins = (CR().admins || []);
  h += "<div class='card'><div class='sectlab' style='margin-bottom:.7rem'>WHO CAN ALLOW A PASSWORD RESET</div>" +
    admins.map((a, n) => "<div class='nmrow'><input class='nmin admin' data-n='" + n + "' value='" + esc(a) + "'>" +
      "<button class='btn sec adminrm' data-n='" + n + "'>Remove</button></div>").join("") +
    "<div class='nmrow'><input class='nmin' id='adminNew' placeholder='Add an address' autocomplete='off'>" +
    "<button class='btn sec' id='adminAdd'>Add</button></div></div>";

  /* The naming panel used to sit here, and the unmatched-initials card with it. Both have moved:
     the names to the Staff page, where they are a place you can go rather than a panel that
     appears and disappears, and the nagging to the Attention page (Ali, 8 Aug: "I'd rather those
     proposed changes sat in an attention pane, theyre not really a log"). Setup is settings now,
     and nothing else.

     The "Editing password" card was here too. Editing needs no password any more, and the
     rota-team password that guards this page is the board's own — set on the resident board,
     shared, not duplicated here. Two places to change one password is how they end up different. */

  box.innerHTML = h;

  const num = (el, key, lo, hi, label) => {
    if (!el) return;
    el.onchange = () => {
      let v = parseFloat(el.value);
      if (isNaN(v) || v < lo || v > hi) { el.value = (CR()[key] == null ? "" : CR()[key]); return; }
      setSetting(key, v, label + " set to " + v);
    };
  };
  const pubEl = $("#setPub");
  if (pubEl) pubEl.onchange = () => {
    const v = parseInt(pubEl.value, 10);
    if (isNaN(v) || v > 26) { pubEl.value = PUB_WEEKS; return; }
    if (v < PUB_MIN) {
      pubEl.value = PUB_WEEKS;
      toast(PUB_MIN + " weeks have already been shown — it can't go below that");
      return;
    }
    const cons = CR();
    cons.pubHighWater = Math.max(PUB_MIN, v);   // the promise, once made, is kept
    setSetting("pubWeeks", v, "Published weeks set to " + v);
  };
  num($("#setCap"), "cap", 0, 0.5, "Balance correction");
  num($("#setHard"), "hard", 0, 0.5, "Weekend override");
  const sy = $("#btnSync"); if (sy) sy.onclick = syncNow;
  box.querySelectorAll(".admin").forEach(inp => inp.onchange = () => {
    const list = (CR().admins || []).slice();
    const v = (inp.value || "").trim();
    if (!v || !/^[^@\s]+@[^@\s]+\.[^@\s]+$/.test(v)) { renderSetup(); toast("That isn't an email address"); return; }
    list[+inp.dataset.n] = v;
    setSetting("admins", list, "Reset admin changed to " + v);
  });
  box.querySelectorAll(".adminrm").forEach(b => b.onclick = () => {
    const list = (CR().admins || []).slice();
    /* Removing the last one would leave nobody able to allow a reset, which is the lockout this
       whole mechanism exists to prevent. */
    if (list.length <= 1) { toast("Keep at least one address, or nobody can allow a reset"); return; }
    const [gone] = list.splice(+b.dataset.n, 1);
    setSetting("admins", list, "Reset admin removed: " + gone);
  });
  const add = $("#adminAdd");
  if (add) add.onclick = () => {
    const el = $("#adminNew"), v = (el.value || "").trim();
    if (!/^[^@\s]+@[^@\s]+\.[^@\s]+$/.test(v)) { toast("That isn't an email address"); return; }
    setSetting("admins", (CR().admins || []).concat([v]), "Reset admin added: " + v);
  };
}

/* One way in for every setting on this page, so each one is saved, logged and re-rendered the same
   way rather than each control growing its own copy of that. */
async function setSetting(key, value, msg){
  const cons = CR(); if (!cons || !COVER_SAVE) { toast("Cover store not connected"); return; }
  ensureWho(async () => {
    cons[key] = value;
    clog(msg, "manual", null, " (Setup)");
    cdata.savedAt = new Date().toISOString();
    cdata.savedBy = localStorage.getItem("consEditor") || "?";
    state("saving");
    try { await postLive(COVER_SAVE, JSON.stringify(cdata)); state("saved"); toast("Saved"); }
    catch(e){ state("unsaved"); toast("Save failed — try again"); return; }
    renderAll(); renderSetup();
  });
}
/* Sync now asks the nightly job to run at once. There is no server here to ask, so it writes a
   request into the store and the GitHub Action picks it up on its next pass — which means this is
   "run it soon", not "run it this second", and the button says so by going quiet rather than
   claiming success it cannot verify. */
async function syncNow(){
  const cons = CR(); if (!cons || !COVER_SAVE) { toast("Cover store not connected"); return; }
  ensureWho(async () => {
    cons.syncRequest = { t: new Date().toISOString(), who: localStorage.getItem("consEditor") || "?" };
    clog("Sync requested", "manual", null, " (Setup)");
    try { await postLive(COVER_SAVE, JSON.stringify(cdata)); toast("Asked for — the next run will pick it up"); }
    catch(e){ toast("Couldn't ask — try again"); }
  });
}

/* THE STAFF PAGE. Everyone the rota uses, with a box to put a name to them. Deliberately a page
   and not a panel: a panel that only appears when something is wrong is a nag, and there is no
   way to go and look at the list when nothing is wrong (Ali, 8 Aug: "I think there shuld be a
   staff page just like resitents where the naming issue can sit"). Unnamed people sort to the top
   because that is the only thing on this page anybody needs to act on. */
function renderStaff(){
  const box = $("#staffBox");
  if (!box) return;
  const all = everyone();
  if (!all.length) { box.innerHTML = "<div class='card'><h2>Nobody yet</h2></div>"; return; }
  const miss = all.filter(i => !isNamed(i));
  const q = (staffFind || "").toLowerCase();
  const shown = all.filter(i => !q || i.toLowerCase().includes(q) || nameOf(i).toLowerCase().includes(q));
  shown.sort((a, b) => (isNamed(a) - isNamed(b)) || a.localeCompare(b));
  box.innerHTML = "<div class='card'>" +
    "<div class='stafftop'>" +
      "<span class='sectlab'>CONSULTANTS</span>" +
      "<span class='cnt'>" + all.length + "</span>" +
      (miss.length ? "<span class='cnt warn'>" + miss.length + " unnamed</span>" : "") +
      "<input id='staffQ' class='nmin' placeholder='Find' autocomplete='off' " +
        "value='" + esc(staffFind || "") + "' style='margin-left:auto;flex:0 0 9rem;min-width:0'>" +
    "</div>" +
    shown.map(i => "<div class='nmrow'><b class='inipill'>" + esc(i) + "</b>" +
      "<input class='nmin" + (isNamed(i) ? "" : " miss") + "' data-ini='" + esc(i) + "' " +
      "value='" + esc(isNamed(i) ? nameOf(i) : "") + "' placeholder='Full name' " +
      "autocomplete='off' spellcheck='false'></div>").join("") +
    "</div>";
  const qi = $("#staffQ");
  qi.oninput = () => { staffFind = qi.value; const at = qi.selectionStart; renderStaff();
                       const n = $("#staffQ"); n.focus(); try { n.setSelectionRange(at, at); } catch(e){} };
  /* Saved on leaving the box or on Enter, not behind a Save button per row: a row of Save buttons
     is a row of things you can forget to press. */
  box.querySelectorAll(".nmin[data-ini]").forEach(inp => {
    inp.onkeydown = e => { if (e.key === "Enter") inp.blur(); };
    inp.onblur = () => {
      const v = (inp.value || "").trim();
      if (v && v !== (isNamed(inp.dataset.ini) ? nameOf(inp.dataset.ini) : "")) saveName(inp.dataset.ini, v);
    };
  });
}
let staffFind = "";

/* THE ATTENTION PAGE. Everything waiting for a person, in one place, separate from the log —
   because a log is history you go looking for and this is work that has come looking for you
   (Ali, 8 Aug). Two kinds of item, and they behave differently on purpose:

     NEEDS DOING     no dismiss button at all. It clears when the thing is actually done. A
                     dismiss here would be dangerous: hiding "Wednesday has an empty pod" does
                     not staff the pod, it just means nobody finds out until Wednesday.
     JUST TELLING    "Got it" and gone.

   The gap in that is the item nobody CAN fix — a pod there is genuinely nobody to cover, a locum
   whose initials will never have a name. Nagging for ever is its own kind of broken, so those get
   the deliberate alternative instead of a dismiss: a named decision, logged. Nothing here
   disappears without either the problem being solved or somebody putting their name to it. */
function attnItems(){
  const cons = CR(); if (!cons) return [];
  const out = [];
  const seenAck = (cons.acked || {});
  for (const d of Object.keys(cons.days || {}).sort()) {
    const a = cons.days[d].alert;
    if (!a || typeof a !== "object") continue;
    const gone = a.gone || [], came = a.new || [];
    out.push({
      kind: "day", id: "day:" + d, date: d,
      title: shortDate(d) + " has a pod with nobody on it",
      detail: (gone.length ? gone.map(nameOf).join(" and ") + " came off the rota" : "") +
              (gone.length && came.length ? " · " : "") +
              (came.length ? came.map(nameOf).join(" and ") + " came on" : ""),
      act: "Open the day", alt: "Leave it empty"
    });
  }
  const miss = unnamed();
  if (miss.length)
    out.push({ kind: "name", id: "unnamed", title: miss.length + " consultant" +
      (miss.length === 1 ? " has" : "s have") + " no name",
      detail: miss.join(" · "), act: "Name them" });
  const unknown = ((cons.source || {}).unknownInitials || []).filter(i => !seenAck["unk:" + i]);
  for (const i of unknown)
    out.push({ kind: "unknown", id: "unk:" + i,
      title: "An initial on the sheet isn't recognised",
      detail: i + " — the spelling in the workbook needs fixing, or the initials adding to the sync",
      ack: true });
  for (const n of (cons.notices || []))
    if (!seenAck["notice:" + n.id]) out.push({ kind: "notice", id: "notice:" + n.id,
      title: n.msg, detail: n.who ? "by " + esc(n.who) + " · " + shortDate(String(n.t).slice(0, 10)) : "",
      ack: true });
  /* LAST NIGHT'S BACKUP WENT SOMEWHERE ELSE. A file open in Excel is locked against every write
     API there is, so the nightly job writes beside it rather than losing the night (Ali, 8 Aug:
     "thats an issue" — a backup that only works when nobody is looking at the folder is not one).
     But a spare copy nobody is told about is one tidy-up away from being no copy at all, so it is
     said here. Deliberately NOT acknowledgeable: the flag is removed by the next night that can
     write the usual name, which is to say by the problem going away. Something you can tick off
     while it is still true is how a folder ends up with nine files and no one knowing which is
     the rota.
     It reads this off the RESIDENT store, which is where the backup job stamps it and which this
     page already holds — nothing new is fetched, and nothing is written back. */
  const sp = (data || {}).backupSpare;
  if (sp && sp.name)
    out.push({ kind: "backup", id: "backup:spare",
      title: "Last night's backup could not replace the usual file",
      detail: "It was written beside it as " + sp.name + ". The usual copy is untouched but is now "
            + "a day older than it looks. Close it in Excel and tonight's run will replace it." });
  return out;
}
function attnCount(){ return attnItems().length; }
function paintAttnBadge(){
  const b = $("#attnBadge"); if (!b) return;

  b.textContent = n ? String(n) : "";
  b.style.display = n ? "" : "none";
}
function renderAttn(){
  const box = $("#attnBox"); if (!box) return;
  const items = attnItems();
  if (!items.length) {
    box.innerHTML = "<div class='card' style='text-align:center;padding:2.2rem 1rem'>" +
      "<span style='color:var(--muted);font-size:.9rem'>Nothing needs you</span></div>";

  }

    "<div class='attnrow' data-id='" + esc(it.id) + "'>" +

        (it.detail ? "<div class='sub'>" + esc(it.detail) + "</div>" : "") + "</div>" +
      (it.act ? "<button class='btn sec attndo'>" + esc(it.act) + "</button>" : "") +
      (it.alt ? "<button class='btn sec attnalt'>" + esc(it.alt) + "</button>" : "") +

/* Acknowledging is itself a change to the store, so it is saved and logged like any other. Kept in
   `acked` rather than deleting the thing acknowledged, because the underlying fact — the sheet has
   an initial nobody recognises — is still true and should not be erased by somebody reading it. */
async function ack(id){
  const cons = CR(); if (!cons || !COVER_SAVE) return;
  ensureWho(async () => {
    cons.acked = cons.acked || {};
    cons.acked[id] = { t: new Date().toISOString(), who: localStorage.getItem("consEditor") || "?" };
    cdata.savedAt = new Date().toISOString();
    cdata.savedBy = localStorage.getItem("consEditor") || "?";
    try { await postLive(COVER_SAVE, JSON.stringify(cdata)); } catch(e){ toast("Save failed — try again"); return; }
    renderAttn();
  });
}
/* The escape hatch for a pod there is nobody to cover. Not a dismiss: it records that a named
   person decided the pod stands empty, so the day shows a deliberate blank rather than an
   accident, and the change log says who decided it. */
async function leaveEmpty(date){
  const cons = CR(); if (!cons || !cons.days[date] || !COVER_SAVE) return;
  ensureWho(async () => {
    const rec = cons.days[date];
    delete rec.alert;
    rec.note = (rec.note ? rec.note + " · " : "") + "pod left empty deliberately";
    clog("Pod left empty on " + shortDate(date) + " — nobody available", "manual", date, "");
    cdata.savedAt = new Date().toISOString();
    cdata.savedBy = localStorage.getItem("consEditor") || "?";
    state("saving");
    try { await postLive(COVER_SAVE, JSON.stringify(cdata)); state("saved"); toast("Recorded"); }
    catch(e){ state("unsaved"); toast("Save failed — try again"); return; }
    renderAttn(); renderAll();
  });
}

/* Naming somebody is a change to the cover like any other: it is logged, under the name of whoever
   is editing, and it is saved to the store rather than held in the browser. Deliberately NOT
   guarded by anything beyond the shield — putting a name to a set of initials is not a decision
   anybody needs protecting from, and making it hard is how it stays undone. */
async function saveName(ini, name){
  if (!ini) return;
  if (!name) { toast("Type a name first"); return; }
  if (!cdata || !COVER_SAVE) { toast("Cover store not connected — nothing was saved"); return; }
  ensureWho(async () => {
    const cons = CR(); if (!cons) return;
    cons.names = cons.names || {};
    const was = cons.names[ini];
    if (was === name) return;
    cons.names[ini] = name;
    clog((was ? "Renamed " + ini + ": " + was + " → " + name : ini + " named as " + name),
         "manual", null, " (Setup)");
    cdata.savedAt = new Date().toISOString();
    cdata.savedBy = localStorage.getItem("consEditor") || "?";
    state("saving");
    try { await postLive(COVER_SAVE, JSON.stringify(cdata)); state("saved"); toast(ini + " is now " + name); }
    catch(e){ state("unsaved"); toast("Save failed — try again"); }
    renderAll();
  });
}

function consList(){
  /* Names added on Setup belong in this list too, or a newly-named consultant could be allocated
     and shown on the board but not be pickable as the person who edited something. */
  const cons = CR() || {};
  const all = new Set([...Object.keys(cons.map || {}), ...Object.keys(cons.names || {})]);
  return [...all].filter(i => !["FMCN","NET","AC","SF"].includes(i)).sort((a,b) => nameOf(a).localeCompare(nameOf(b)));
}
function consSelect(cls, selected, blankLabel){
  const s = document.createElement("select"); s.className = cls;
  const b = document.createElement("option"); b.value = ""; b.textContent = blankLabel || "—"; s.append(b);
  for (const i of consList()){ const o = document.createElement("option"); o.value = i; o.textContent = i + " — " + nameOf(i); if (i === selected) o.selected = true; s.append(o); }
  if (selected && !consList().includes(selected)){ const o = document.createElement("option"); o.value = selected; o.textContent = selected; o.selected = true; s.append(o); }
  return s;
}
function whoBtn(){
  const w = localStorage.getItem("consEditor");
  $("#btnWho").textContent = w ? nameOf(w) : "Who's editing?";
  $("#btnWho").title = w ? "Changes are logged as " + nameOf(w) + " — click to change" : "Click to say who you are";
}
/* Who's editing. A typeable list of CONSULTANTS ONLY — no residents, because a resident cannot
   put their name to a change on this page. It was a plain dropdown of forty names; typing three
   letters is faster than scrolling on a phone, and a datalist keeps the list there for anyone
   who would rather scroll. The name is what the change log records; the password is what
   actually gates editing, and they are deliberately different questions. */
function pickWho(cb){
  const ov = document.createElement("div"); ov.id = "whoOverlay";
  const box = document.createElement("div"); box.className = "box";
  const t = document.createElement("b"); t.textContent = "Who's editing?";
  const sub = document.createElement("div");
  sub.style.cssText = "font-size:.8rem;color:var(--muted);margin:.2rem 0 .6rem";
  sub.textContent = "Start typing your name. Changes are logged under it.";

  const list = document.createElement("datalist"); list.id = "consNames";
  const names = consList();
  for (const i of names){ const o = document.createElement("option"); o.value = nameOf(i); list.append(o); }

  const inp = document.createElement("input");
  inp.type = "text"; inp.setAttribute("list", "consNames"); inp.autocomplete = "off";
  inp.style.cssText = "width:100%;margin-bottom:.6rem";
  const prev = localStorage.getItem("consEditor");
  inp.placeholder = prev ? "Last time: " + nameOf(prev) : "Start typing…";

  const msg = document.createElement("div");
  msg.style.cssText = "font-size:.78rem;color:var(--red);min-height:1em;margin-bottom:.4rem";

  const ok = document.createElement("button"); ok.className = "btn"; ok.style.width = "100%";
  ok.textContent = "That's me";
  /* Match on the typed name OR the initials, and case-insensitively, because people type "MG"
     as readily as "Murad Ghrew" and neither is wrong. What gets STORED is always the initials,
     so the log stays comparable with the rota sheet. */
  const resolve = v => {
    const q = String(v || "").trim().toLowerCase();
    if (!q) return "";
    return names.find(i => i.toLowerCase() === q)
        || names.find(i => nameOf(i).toLowerCase() === q)
        || names.find(i => nameOf(i).toLowerCase().startsWith(q))
        || "";
  };
  ok.onclick = () => {
    const ini = resolve(inp.value);
    if (!ini){ msg.textContent = names.length ? "Pick a name from the list." : "No consultants loaded yet."; return; }
    localStorage.setItem("consEditor", ini);
    whoBtn(); ov.remove(); if (cb) cb(ini);
  };
  inp.onkeydown = e => { if (e.key === "Enter") ok.click(); };
  ov.onclick = e => { if (e.target === ov) ov.remove(); };
  box.append(t, sub, list, inp, msg, ok); ov.append(box); document.body.append(ov);
  setTimeout(() => inp.focus(), 0);
}
$("#btnWho").onclick = () => pickWho(() => renderAll());

function juniorsFor(dateISO){
  const wk = (data.weeks || {})[mondayOf(dateISO)];
  if (!wk) return null;
  const di = (new Date(dateISO + "T12:00:00").getDay() + 6) % 7;
  const day = wk.days && wk.days[di];
  if (!day) return null;
  /* Surnames alone told a consultant nothing. Carry the same facts the resident board shows —
     shift, phone, airway, shadowing — so both pages describe a person identically. */
  const rec = (id, opts) => {
    const st = (data.staff || []).find(x => x.id === id);
    if (!st) return null;
    return { id, name: st.name.split(" ").pop(), airway: !!st.airway,
             shift: (opts && opts.shift) || "",
             phone: !!(opts && opts.phone),
             shadow: (day.shadow || []).includes(id) };
  };
  const out = { pods: {}, night: [] };
  for (const p of ["A","B","C","D","E"]) {
    out.pods[p] = (((day.pods || {})[p] || {}).assign || [])
      .map(a => rec(a.id, { shift: a.shift, phone: day.phone === a.id })).filter(Boolean);
  }
  out.night = [].concat((day.night || {}).AB || [], (day.night || {}).CDE || [], (day.night || {}).E || [])
    .map(id => rec(id, { shift: "N", phone: (day.night || {}).phone === id })).filter(Boolean);
  return out;
}

/* One resident per row, in a pill, with the same badges the resident board uses. Styling lives in
   core.css so both pages draw a person the same way. */
const SVG_PHONE = '<svg viewBox="0 0 24 24" width="9" height="9" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M6 3h3l2 5-2.5 1.5a12 12 0 006 6L16 13l5 2v3a2 2 0 01-2 2A16 16 0 014 5a2 2 0 012-2z"/></svg>';
const SVG_EYE = '<svg viewBox="0 0 24 24" width="9" height="9" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M2 12s3.6-6 10-6 10 6 10 6-3.6 6-10 6-10-6-10-6z"/><circle cx="12" cy="12" r="2.4"/></svg>';
function resPill(r){
  return "<span class='rpill' data-rid='" + esc(r.id) + "'>"
    + (r.shift ? "<b class='sh'>" + esc(r.shift) + "</b>" : "")
    + (r.phone ? "<i class='ic'>" + SVG_PHONE + "</i>" : "")
    + (r.shadow ? "<i class='ic'>" + SVG_EYE + "</i>" : "")
    + "<span class='nm'>" + esc(r.name) + "</span>"
