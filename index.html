function seedC(){
  return { v: "cover-1", days: {}, map: {}, fair: {}, window: {}, source: {}, log: [] };
}
async function loadC(){
  if (!COVER_READ){ cdata = null; return; }
  try {
    const r = await fetch(COVER_READ, { method: "POST", headers: { "Content-Type": "application/json" }, body: "{}", cache: "no-store" });
    if (!r.ok) throw 0;
    let j = await r.json();
    /* The sandbox copy wins on the test site, so a change made here survives a refresh the way
       it would on the real thing. */
    if (TESTMODE) {
      try { const t = localStorage.getItem(TEST_KEY); if (t) j = JSON.parse(t); } catch(e){}
    }
    cdata = (j && j.v) ? j : seedC();
    /* ── ONE NAME, TWO MEANINGS — repaired 11 Aug ──────────────────────────────────────────────
       The nightly cover sync had been refusing to run since 8 Aug, so the board sat on the answer
       it worked out that morning (Pod A showing Nick when the workbook said Ozerah). It was not
       crashing; it was stopping on purpose:

         "The cover store has consultant rota paperwork in it again: admins. Something is writing
          it back. Fix that before syncing — this script would drop those keys."

       cover_sync.py knows `admins` as the CONSULTANT ROTA's admin list, carved out of this file on
       4 Aug and never to return. This page then gave the same name to something entirely
       different: the e-mail addresses the password reset can send to. The guard cannot tell two
       meanings of one word apart, so it did the safe thing and stopped rather than overwrite a
       file it did not understand. It was right to.

       Blinding the guard would have been the one-line fix and the wrong one — it exists to catch
       exactly the leak it appeared to be seeing. So the reset list takes a name of its own, and
       the guard keeps its meaning intact.

       Adopted only when the stored value looks like OURS — a non-empty list of e-mail addresses.
       Anything else is left exactly where it is and reported, because a real leak of consultant
       rota paperwork must still trip the guard tomorrow. */
    if (cdata && Array.isArray(cdata.admins) && !cdata.resetAdmins) {
      var looksLikeReset = cdata.admins.length &&
        cdata.admins.every(function(x){ return typeof x === "string" && x.indexOf("@") > 0; });
      if (looksLikeReset) {
        cdata.resetAdmins = cdata.admins.slice();
        delete cdata.admins;
        coverNeedsRepairSave = true;
      } else {
        console.warn("cover store holds an `admins` key that is not the reset list — left alone");
      }
    }
    /* A store carved before this page was updated, or one the carve hasn't reached yet: take
       the allocation out of the old wrapper so the page draws rather than showing nothing.
       This is a read-side kindness only — the page never writes the wrapper back. */
    if (cdata.consRota){
      for (const k of ["days","map","fair","window","source"])
        if (cdata[k] == null && cdata.consRota[k] != null) cdata[k] = cdata.consRota[k];
      delete cdata.consRota;
    }
    coverLoadFailed = false;
    coverSavedAtOnLoad = cdata.savedAt || "";
  } catch(e){
    /* ── A FAILED READ IS "NO DATA", NOT "EMPTY DATA" — 11 Aug ──────────────────────────────────
       This used to be `cdata = seedC()`, and that one word was the worst thing in the file.

       seedC() is a valid, empty cover store. It is truthy. So when the read flow blipped — throttled,
       offline, Power Automate having a moment — the page carried on holding a blank rota that
       LOOKED like a quiet week, said nothing about having failed, and left every edit control live,
       because each one guards on `!cdata` and cdata was perfectly real. The first change anybody
       made then wrote 77 bytes over the whole file.

       The sync rebuilds `days` from the workbook overnight. Nothing rebuilds the rest: `fair` is
       seeded once from the old sheet and never re-derived (so the entire Fairness page would restart
       from zero, quietly and wrongly), and the change log, the typed names and the reset address
       exist nowhere else. cover_backup.py writes a readable 14-day XLSX, not the store, so there is
       no restore.

       null is the state the page already knows how to be honest about — every save path says
       "Cover store not connected — nothing was saved" and writes nothing. It simply never got here.

       seedC() is still right one line above, where the flow ANSWERED and had no store yet. That is
       a real empty cover. This is a question we did not get an answer to, and the two must not
       share a value. */
    cdata = null;
    coverLoadFailed = true;
    coverSavedAtOnLoad = "";
  }
}
/* Set when the read failed, so the page can say so where somebody will actually see it rather than
   only on the Attention page, which is behind the shield and — until today — unreachable on a phone. */
let coverLoadFailed = false;
/* What `savedAt` said when we loaded. The whole basis of the conflict check below: if the stored
   value has moved since, somebody else has saved in between and our copy is stale. */
let coverSavedAtOnLoad = "";
/* Anything in the store that is not on cover's list. Today that means the consultant rota's
   paperwork, in a store the carve hasn't reached yet. Written as "not on the list" rather than
   as a list of the six known keys so that whatever gets mixed in NEXT is caught too — the six
   were not predicted either. The page neither reads nor edits any of it; it only needs to
   recognise it, so it can be reported rather than silently mangled. */
const strayPaperwork = () => cdata
  ? Object.keys(cdata).filter(k => !COVER_ONLY.includes(k) && cdata[k] !== undefined)
  : [];

async function saveC(){
  if (!canSave()) return;
  /* saveCover() stamps savedAt, because it is the value it then reads back to prove the write
     actually landed. Stamping it here as well would only mean checking our own homework. */
  /* Cover's keys, plus anything else already in the file, carried through untouched.
     The temptation is to write cover's keys and drop the rest — it would leave a clean file
     in one step. But if split_stores.py has not been run against this store yet, that first
     save would destroy the job plans and PINs with no backup anywhere, and there is no undo
     for that. So the page never deletes: it declines to add, and says so on Setup. The carve
     is a deliberate act with a verified backup, and it stays that way. */
  try { if (!await saveCover()) return; if (!TESTMODE) toast("Saved"); }
  catch(e){ toast("Save failed — try again"); }
}
async function sha(s){
  const b = await crypto.subtle.digest("SHA-256", new TextEncoder().encode(s));
  return [...new Uint8Array(b)].map(x => x.toString(16).padStart(2, "0")).join("");
}
/* One way in to the log, and one shape of entry — the same three-part shape the resident page uses.
   t is when the change was made, on is the rota date it changed (null when it isn't about a
   particular day, e.g. a PIN), and kind separates a person's decision from the software's.
   Every writer on this page goes through here: three of them used to build the entry inline and
   drifted apart, which is why the Log tab had to guess what was a consultant change by pattern-
   matching the message text. */
/* `det` is the STRUCTURED half of an entry, and it is what makes the log readable (Ali, 6 Aug:
   "nice coloured pod letter styling and things missing"). The shared table in core.js draws
   Person / From / To — with the pods as coloured chips and an arrow between them — from `e.d`.
   Failing that it tries to parse the message text, but those regexes were written for the
   RESIDENT board's phrasings and match none of ours. So every row this page has ever written fell
   through to the "one wide cell, no invented columns" fallback: three empty columns and a
   sentence. Nothing about that was fixable with CSS, which is why the log kept looking wrong
   however closely the stylesheet was matched.
   Shape, from core.js: { act:"move", subj:<person>, from:<pod>, to:<pod> }, plus `bench: true`
   for somebody arriving who was not on a pod. Anything that is not a pod move — a COD handover, a
   finish-time swap — deliberately passes no det and stays a plain sentence, because inventing a
   From and a To for it would be worse than leaving them empty. */
function clog(msg, kind, on, whoSuffix, det){
  const who = (localStorage.getItem("consEditor") || "?") + (whoSuffix || "");
  cdata.log = cdata.log || [];
  const e = { t: new Date().toISOString(), who, msg,
              kind: kind === "auto" ? "auto" : "manual", on: on || null };
  if (det) e.d = det;
  cdata.log.unshift(e);
  if (cdata.log.length > 300) cdata.log.length = 300;
}
/* logKind, logOn, groupLog and logDayLabel come from core.js — the resident board reads its
   log the same way, so the reading lives in one place. */

/* Setup. What used to be here was the Admin page: job plans, list skills, the PA tariff, the
   admin list and a PIN of its own to guard them. None of that was cover — it was the consultant
   rota's paperwork, and on 4 Aug 2026 it moved to its own store for its own page, which has not
   been built yet. What is left is the two things Setup is actually for: pointing this page at
   its store, and changing the password that unlocks editing. */
function renderSetup(){
  const box = $("#setupBox");
  if (!box) return;
  /* NO STORE AT ALL — the read failed, as opposed to there being no key to read with. Everything
     below reads settings straight off CR(), so it needs one to exist. Caught by the test that
     asserts a failed read leaves cdata null: seedC() used to paper over this, which is precisely
     why "cdata is null" looked like a supported state without ever having been one. There is
     nothing to configure in a store we could not fetch, so say that and stop. */
  if (COVER_READ && !CR()){
    box.innerHTML = "<div class='card'><h2>The cover didn't load</h2>" +
      "<p style='color:var(--muted);font-size:.85rem'>Settings live in the cover store, and it " +
      "could not be fetched. This is a connection problem, not a change to the rota — nothing has " +
      "been lost. Reload the page to try again.</p></div>";
    return;
  }
  if (!COVER_READ){
    box.innerHTML = "<div class='card'><h2>Connect the cover store</h2>" +
      "<p style='font-size:.85rem'>Paste the two flow URLs (Cover Data - Read and - Save) and this builds the full link for this page.</p>" +
      "<input type='text' id='cnR' placeholder='Read flow URL' style='width:100%;margin-bottom:.5rem'>" +
      "<input type='text' id='cnS' placeholder='Save flow URL' style='width:100%;margin-bottom:.7rem'>" +
      "<button class='btn' id='cnGo'>Build link</button>" +
      "<input type='text' id='cnOut' readonly style='width:100%;margin-top:.7rem;display:none' onclick='this.select()'></div>";
    $("#cnGo").onclick = () => {
      const cv = $("#cnR").value.trim(), cvs = $("#cnS").value.trim();
      if (!cv || !cvs) return;
      const o = $("#cnOut");
      o.value = location.origin + location.pathname + "#r=" + encodeURIComponent(READ || "") + "&cv=" + encodeURIComponent(cv) + "&cvs=" + encodeURIComponent(cvs);
      o.style.display = "block"; o.select();
      try { navigator.clipboard.writeText(o.value); toast("Link copied — replace the Teams link with it"); } catch(e){}
      setTimeout(() => { try { location.replace(o.value); } catch(e){} }, 300);
    };
    return;
  }

  let h = "";

  /* Where the data comes from. Two sources, named, so that "why is this person missing?" is
     answerable from the page instead of from the repository. */
  const src = (CR() || {}).source || {};
  /* "not fetched yet" while the page was full of allocations was a fair thing to be cross
     about (Ali, 6 Aug): the rota HAD been read, just not from SharePoint. The fetch has never
     succeeded, so what everything here was built from is the copy of the workbook committed in
     the repo. Saying which is the difference between "something is wrong" and "here is what is
     wrong". */
  const fetched = !!src.name;
  /* TIMES, TO THE MINUTE. This panel used to show a bare date against the workbook and a bare date
     against the store, which are two different clocks measuring two different things, and said
     which was which nowhere (Ali, 8 Aug: "I want to know what date and time last synced file
     exactly etc"). The store has always carried all four to the second; only the display was
     throwing them away. */
  const when = t => {
    if (!t) return "—";
    const d = new Date(t);
    if (isNaN(d)) return esc(String(t).slice(0, 10));
    return d.toLocaleDateString("en-GB", { day: "numeric", month: "short" }) + ", " +
           d.toLocaleTimeString("en-GB", { hour: "2-digit", minute: "2-digit" });
  };
  /* BOTH sources, not one. Cover reads exactly two things — the consultant rota workbook, which it
     allocates to pods, and the resident rota, read-only, to show who sits under each pod. The panel
     named only the first, so "why is this person missing?" was answerable for half the page and
     not the other half. The render suite has been asserting both were named since 6 Aug and going
     red; it was right and the panel was short. Nothing is invented here: every figure is one the
     store already carried.
     Written as one card with two blocks rather than two cards, because they are two halves of the
     same question and a reader comparing them should not have to look in two places. */
  const rres = data || {};
  /* The keys are MONDAYS, so the furthest key is the start of the last week written, not the last
     day the rota covers. Showing the Monday would understate the reach by six days, which for a
     page whose whole job is "how far ahead do we know" is the wrong six days to lose. */
  const resReach = (function(){
    const ks = Object.keys(rres.weeks || {}); if (!ks.length) return "";
    const mon = ks.sort().pop();
    const d = new Date(mon + "T12:00:00");
    if (isNaN(d)) return "";
    d.setDate(d.getDate() + 6);
    return d.toISOString().slice(0, 10);
  })();
  /* One row, one fact. `srow` is the whole layout of this page: a name, a value, and whatever
     control the value needs. Anything explanatory rides in the title where it is there for the
     asking rather than sitting on screen (hard rule 2). */
  const srow = (k, v, title) => "<div class='setrow'" + (title ? " title='" + esc(title) + "'" : "") +
    "><span class='k'>" + esc(k) + "</span><span class='v'>" + v + "</span></div>";
  const val = t => "<b>" + esc(t || "—") + "</b>";

  /* THE STATUS LINE. Whether the sheet is in step is the only thing on this page you might want
     at a glance, so it goes above everything and reads as one sentence. Everything that was in
     the old SOURCE card is still here, one fact per row, underneath. */
  h += "<div class='setstrip'><span class='sdot" + (fetched ? "" : " warn") + "'></span>" +
    (fetched ? "In step · fetched " + esc(when(src.fetched))
             : "Never fetched — everything below was worked out from the copy kept in the repo") +
    "<button class='btn sec' id='btnSync' style='margin-left:auto;font-size:.78rem;padding:.28rem .7rem'>Sync now</button></div>";

  h += "<div class='setgrp'>Source</div><div class='setcard'>" +
    srow("Consultant rota", val(fetched ? src.name : "the copy kept in the repo"),
         fetched ? "The workbook the allocation is worked out from"
                 : "The fetch from SharePoint has never succeeded") +
    srow("Workbook edited", val(when(src.modified))) +
    srow("Last worked out", val(when(cdata && cdata.savedAt) +
         ((cdata && cdata.savedBy) ? " · " + cdata.savedBy : ""))) +
    /* "2027-04-04" was printed raw, the one ISO date on a page where every other date is written
       the way a person writes one. It carries a year because it is normally months out. */
    srow("Rota reads to", val((function(){
      const d = new Date(String(src.sheetUntil || "") + "T12:00:00");
      return isNaN(d) ? (src.sheetUntil || "—")
        : d.toLocaleDateString("en-GB", { day: "numeric", month: "short", year: "numeric" });
    })())) +
    srow("Resident rota", val(resReach ? fmt(resReach) + " · read only" : "read only"),
         "It is what puts the residents under each pod, and this page cannot write to it" +
         (rres.savedAt ? " — last saved " + when(rres.savedAt) : "")) +
  "</div>";

  /* PUBLISHED WEEKS. Raising it is safe. LOWERING it takes back weeks people have already been
     shown — which is the one thing this page exists to prevent, so until 28 Aug the control simply
     refused. It now asks instead, and names the days that disappear: Chris, 28 Aug, "There are a
     reasonable number of swaps in the 4 week period which I have never changed on the allocations
     as it is just one step too many for me... I can't imagine anyone is that bothered which pod
     they are on in 2 weeks time." That is a rota-team judgement about how far ahead a promise is
     worth making, and rule 1 says the front end has to be able to make it. The high-water mark is
     still kept; it decides whether to ask rather than standing as a wall. */
  /* IT IS NOT "PUBLISHED", IT IS HOW FAR AHEAD A CONSULTANT CAN SEE — 28 Aug (Ali: "its not that
     i want to set, its number that can be seen ahead by consultants"). One number wore three
     names: PUBLISHED here, "live" on the Look ahead bands, and a high-water mark in the store,
     none of which say the thing it does. It is now labelled as the thing it does.

     The count INCLUDES this week, which is the only reading that survives contact with a
     Wednesday: 2 is this week and next. Rather than argue the point in words, the row states the
     date it reaches — a date is unambiguous on any day of the week, and it moves as you change
     the number. */
  h += "<div class='setgrp'>What consultants can see</div><div class='setcard'>" +
    srow("Weeks visible",
      "<input type='number' id='setPub' min='1' max='26' value='" + PUB_WEEKS + "'>" +
      "<span>to " + esc(fmt(pubUntil())) + "</span>",
      "Counting this one. The board and the week arrows both stop here for anybody who is not " +
      "the rota team.") +
  "</div>";

  /* THE TWO BALANCE NUMBERS. They were constants in the Python, which meant changing how hard the
     allocator chases an even neuro split needed a code edit and a deploy — squarely against rule 1.
     They live in the store now and the sync reads them. */
  const cap = (CR().cap == null ? 0.05 : CR().cap), hard = (CR().hard == null ? 0.06 : CR().hard);
  h += "<div class='setgrp'>Neuro balance</div><div class='setcard'>" +
    srow("Correct beyond",
      "<input type='number' id='setCap' step='0.01' min='0' max='0.5' value='" + cap + "'>",
      "How far off an even A&B / C&D split the allocator will tolerate before it corrects") +
    srow("Override a weekend beyond",
      "<input type='number' id='setHard' step='0.01' min='0' max='0.5' value='" + hard + "'>",
      "How far off before it will break the weekend pairing to fix it") +
  "</div>";

  /* WHO CAN ALLOW A RESET. Full addresses only here, behind the shield — the lock screen shows them
     masked, because anybody with the link reaches the lock screen and there is no reason to publish
     consultants' email addresses to them. */
  const admins = (CR().resetAdmins || []);
  /* ── PUT THE LAST SYNC BACK ────────────────────────────────────────────────────────────────────
     Ali, 11 Aug: "there needs to be a way to go back." There was not. No backup of this store has
     ever existed, so when a run moved 73 days the only truthful answer was that it could not be
     undone — which is not a defensible position for a rota people work to.

     `prev` is the photograph the allocator takes before each run. This restores `cur` from it, for
     every day, in one go. Deliberately all-or-nothing: picking days out of a snapshot leaves a
     board that matches neither what the rota says nor what was circulated, which is worse than
     either. Individual days are corrected by hand on the grid.

     Only offered when there is something to undo AND it would actually change something, so it is
     not a button sitting there inviting a press on a morning when the sync moved nothing. */
  const _pv = CR().prev || {}, _pvAt = CR().prevAt;
  /* Compared slot by slot, not by stringifying the two objects: `cur` also carries wkend, finish
     times and extras, and key order is not guaranteed, so a whole-object compare reports days as
     moved when nobody moved. */
  const SLOTS = ["A", "B", "C", "D", "E", "oncall", "fgh"];
  const _differs = (a, b) => SLOTS.some(k => ((a || {})[k] || "") !== ((b || {})[k] || ""));
  const _wouldChange = Object.keys(_pv).filter(d =>
    (CR().days || {})[d] && _differs(_pv[d], CR().days[d].cur));
  if (_pvAt && _wouldChange.length) {
    h += "<div class='card'><div class='sectlab' style='margin-bottom:.7rem'>THE LAST SYNC</div>" +
      "<div class='hint' style='margin-bottom:.6rem'>It ran <b>" + esc(when(_pvAt)) + "</b> and moved <b>" +
      _wouldChange.length + " day" + (_wouldChange.length === 1 ? "" : "s") +
      "</b>. Those are outlined on the board. Putting them back does not stop the next sync moving " +
      "them again — hold the days you want kept, on the day itself.</div>" +
      "<button class='btn sec' id='undoSync'>Put those " + _wouldChange.length + " day" +
      (_wouldChange.length === 1 ? "" : "s") + " back</button></div>";
  }

  h += "<div class='setgrp'>Who can allow a password reset</div><div class='setcard'>" +
    admins.map((a, n) => "<div class='setrow'><input class='nmin admin' data-n='" + n + "' value='" + esc(a) + "'>" +
      "<button class='btn sec adminrm' data-n='" + n + "'>Remove</button></div>").join("") +
    "<div class='setrow'><input class='nmin' id='adminNew' placeholder='Add an address' autocomplete='off'>" +
    "<button class='btn sec' id='adminAdd'>Add</button></div></div>";


  /* The naming panel used to sit here, and the unmatched-initials card with it. Both have moved:
     the names to the Staff page, where they are a place you can go rather than a panel that
     appears and disappears, and the nagging to the Attention page (Ali, 8 Aug: "I'd rather those
     proposed changes sat in an attention pane, theyre not really a log"). Setup is settings now,
     and nothing else.

     The "Editing password" card was here too. Editing needs no password any more, and the
     rota-team password that guards this page is the board's own — set on the resident board,
     shared, not duplicated here. Two places to change one password is how they end up different. */

  box.innerHTML = h;

  const num = (el, key, lo, hi, label) => {
    if (!el) return;
    el.onchange = () => {
      let v = parseFloat(el.value);
      if (isNaN(v) || v < lo || v > hi) { el.value = (CR()[key] == null ? "" : CR()[key]); return; }
      setSetting(key, v, label + " set to " + v);
    };
  };
  const pubEl = $("#setPub");
  if (pubEl) pubEl.onchange = () => {
    const v = parseInt(pubEl.value, 10);
    if (isNaN(v) || v < 1 || v > 26) { pubEl.value = PUB_WEEKS; return; }
    const cons = CR();
    /* Going under the high-water mark un-publishes days somebody may already have planned around,
       so it is made a decision rather than a slip: say which days go, and take an explicit yes.
       Once taken, the mark comes DOWN with the setting — leaving it high would mean the next
       lowering was measured against a promise this board had already stopped keeping. */
    if (v < PUB_MIN) {
      const mon = mondayOf(new Date().toISOString().slice(0, 10));
      const from = addDays(mon, v * 7), to = addDays(mon, PUB_MIN * 7 - 1);
      if (!confirm("Showing " + v + " week" + (v === 1 ? "" : "s") + " takes back " + fmt(from) +
                   " to " + fmt(to) + " — days consultants can see right now. Go ahead?")) {
        pubEl.value = PUB_WEEKS;
        return;
      }
      cons.pubHighWater = v;
      setSetting("pubWeeks", v,
                 "Published weeks set to " + v + " — " + fmt(from) + " to " + fmt(to) + " taken back");
      return;
    }
    cons.pubHighWater = Math.max(PUB_MIN, v);   // raising: the promise, once made, is kept
    setSetting("pubWeeks", v, "Published weeks set to " + v);
  };
  num($("#setCap"), "cap", 0, 0.5, "Balance correction");
  num($("#setHard"), "hard", 0, 0.5, "Weekend override");
  const sy = $("#btnSync"); if (sy) sy.onclick = syncNow;
  box.querySelectorAll(".admin").forEach(inp => inp.onchange = () => {
    const list = (CR().resetAdmins || []).slice();
    const v = (inp.value || "").trim();
    if (!v || !/^[^@\s]+@[^@\s]+\.[^@\s]+$/.test(v)) { renderSetup(); toast("That isn't an email address"); return; }
    list[+inp.dataset.n] = v;
    setSetting("resetAdmins", list, "Reset admin changed to " + v);
  });
  box.querySelectorAll(".adminrm").forEach(b => b.onclick = () => {
    const list = (CR().resetAdmins || []).slice();
    /* Removing the last one would leave nobody able to allow a reset, which is the lockout this
       whole mechanism exists to prevent. */
    if (list.length <= 1) { toast("Keep at least one address, or nobody can allow a reset"); return; }
    const [gone] = list.splice(+b.dataset.n, 1);
    setSetting("resetAdmins", list, "Reset admin removed: " + gone);
  });
  /* Putting the last sync back. Writes `cur` only — `auto` stays as the allocator left it, so the
     board still records that the algorithm and the unit disagree, which is the fact somebody may
     need next week. Every restored day is logged individually with its from and to, so the change
     log shows the undo as clearly as it showed the change. */
  const undoBtn = $("#undoSync");
  if (undoBtn) undoBtn.onclick = async () => {
    const C = CR(), pv = C.prev || {};
    const SL = ["A", "B", "C", "D", "E", "oncall", "fgh"];
    const hit = Object.keys(pv).filter(d => C.days[d] &&
      SL.some(k => ((pv[d] || {})[k] || "") !== ((C.days[d].cur || {})[k] || "")));
    if (!hit.length) return;
    if (!(await uiConfirm("This puts " + hit.length + " day" + (hit.length === 1 ? "" : "s") +
        " back to how they were before the last sync ran. The rota itself is not changed, so the " +
        "next sync may move them again unless you hold them.",
        { title: "Put " + hit.length + " day" + (hit.length === 1 ? "" : "s") + " back?",
          okLabel: "Put them back" }))) return;
    ensureWho(async () => {
      for (const d of hit) {
        for (const k of SL) {
          const was = (pv[d] || {})[k] || "", now = (C.days[d].cur || {})[k] || "";
          if (was === now) continue;
          C.days[d].cur[k] = was;
          clog(rowLabel(k) + " put back to " + (nameOf(was) || "nobody") + " as it was before the sync",
               "manual", d, "", { act: "set", subj: rowLabel(k), facet: "consultant", from: now, to: was });
        }
      }
      cdata.savedAt = new Date().toISOString();
      cdata.savedBy = localStorage.getItem("consEditor") || "?";
      state("saving");
      try { await postLive(COVER_SAVE, JSON.stringify(cdata)); state("saved"); toast(hit.length + " day(s) put back"); }
      catch (e) { state("unsaved"); toast("Save failed — try again"); return; }
      renderSetup(); renderAll();
    });
  };

  const add = $("#adminAdd");
  if (add) add.onclick = () => {
    const el = $("#adminNew"), v = (el.value || "").trim();
    if (!/^[^@\s]+@[^@\s]+\.[^@\s]+$/.test(v)) { toast("That isn't an email address"); return; }
    setSetting("resetAdmins", (CR().resetAdmins || []).concat([v]), "Reset admin added: " + v);
  };

}

/* One way in for every setting on this page, so each one is saved, logged and re-rendered the same
   way rather than each control growing its own copy of that. */
async function setSetting(key, value, msg){
  const cons = CR(); if (!cons || !canSave()) { toast("Cover store not connected"); return; }
  ensureWho(async () => {
    cons[key] = value;
    clog(msg, "manual", null, " (Setup)");
    cdata.savedBy = localStorage.getItem("consEditor") || "?";
    state("saving");
    try { if (!await saveCover()) return; state("saved"); toast("Saved"); }
    catch(e){ state("unsaved"); toast("Save failed — try again"); return; }
    renderAll(); renderSetup();
  });
}
/* Sync now asks the nightly job to run at once. There is no server here to ask, so it writes a
   request into the store and the GitHub Action picks it up on its next pass — which means this is
   "run it soon", not "run it this second", and the button says so by going quiet rather than
   claiming success it cannot verify. */
async function syncNow(){
  const cons = CR(); if (!cons || !canSave()) { toast("Cover store not connected"); return; }
  ensureWho(async () => {
    cons.syncRequest = { t: new Date().toISOString(), who: localStorage.getItem("consEditor") || "?" };
    clog("Sync requested", "manual", null, " (Setup)");
    try { if (!await saveCover()) return; toast("Asked for — the next run will pick it up"); }
    catch(e){ toast("Couldn't ask — try again"); }
  });
}

    "</div>" +

    "</div>";
  const qi = $("#staffQ");
  qi.oninput = () => { staffFind = qi.value; const at = qi.selectionStart; renderStaff();
                       const n = $("#staffQ"); n.focus(); try { n.setSelectionRange(at, at); } catch(e){} };
  /* Saved on leaving the box or on Enter, not behind a Save button per row: a row of Save buttons

  box.querySelectorAll(".nmin[data-ini]").forEach(inp => {

    };

}
let staffFind = "";

/* THE ATTENTION PAGE. Everything waiting for a person, in one place, separate from the log —
   because a log is history you go looking for and this is work that has come looking for you
   (Ali, 8 Aug).

   ── ONE RULE FOR EVERY ROW: SORTED (Ali, 11 Aug) ──────────────────────────────────────────────
   "any attention thing that leaves a badge must have a way of showing youve sorted and the
   attention badge disappearing. And on attention page when say youve sorted grey out and drop
   off after 3 days."

   This replaced three different behaviours that had grown up one item at a time: some rows had
   "Got it", some had a named alternative, and three — the stale board, the spare backup, the
   unnamed consultants — had no way out at all. Each of those was defensible on its own and the
   set was not: a badge you cannot clear is a badge people stop looking at, which is the exact
   opposite of what the badge is for. Every row now takes Sorted, and the count on the rail is
   the number of rows nobody has dealt with yet.

   Pressing it does not make the row vanish. It greys and stays for three days, because the
   question after a change is usually "did somebody deal with that?" and a row that disappears
   answers it with silence. The name of whoever pressed it sits on the row.

   What happens on the fourth day depends on what KIND of fact the row is, and this is the part
   worth keeping:

     A LIVE CONDITION — the board is stale, a pod is empty, an initial has no name — is only ever
     as true as it is right now. Sorted quiets it for three days; if it is STILL true when they
     are up it comes back, un-greyed and counting again. You can quiet it, you cannot make it lie.

     A HISTORICAL FACT — a published day moved, an initial the sheet used once — happened, and a
     named person saying they have dealt with it is the end of it. Those stay gone.

   So the stale-board warning keeps the property that actually mattered on 8 Aug (it cannot be
   permanently ticked away while the sync is still dead) and loses the property that made the
   whole badge easy to ignore (it could not be quieted at all, so it sat there for ever). */
const SORTED_GREY_DAYS = 3;
/* Kinds whose row is re-derived from the world every time this function runs, so silencing one
   can only ever be temporary. Everything not on this list is a record of something that happened. */
const LIVE_KINDS = ["stale", "backup", "name", "empty", "day", "pinned", "stray"];
/* `sorted` is the new key; `acked` is what the same idea was called before 11 Aug. Read both so
   that anything already ticked off stays ticked, and write only the new one. */
function sortedOf(cons, id){
  return (cons.sorted || {})[id] || (cons.acked || {})[id] || null;
}
function attnItems(){
  const cons = CR(); if (!cons) return [];
  const raw = [];
  for (const d of Object.keys(cons.days || {}).sort()) {
    const a = cons.days[d].alert;
    if (!a || typeof a !== "object") continue;
    const gone = a.gone || [], came = a.new || [];
    raw.push({
      kind: "day", id: "day:" + d, date: d,
      title: shortDate(d) + " has a pod with nobody on it",
      detail: (gone.length ? gone.map(nameOf).join(" and ") + " came off the rota" : "") +
              (gone.length && came.length ? " · " : "") +
              (came.length ? came.map(nameOf).join(" and ") + " came on" : ""),
      act: "Open the day", alt: "Leave it empty"
    });
  }
  /* ── A POD WITH NOBODY ON IT, FOUND BY LOOKING ────────────────────────────────────────────────
     The row above only fires when the ALLOCATOR raised an alert, which it does only for a change
     it could not resolve inside the published weeks. So a pod that is simply empty — because the
     sheet never filled it — produced no row at all, and the page said "Nothing needs you" while
     holding five such days (25 May and four over Christmas, both already your call). The item was
     named "has a pod with nobody on it" and could not detect a pod with nobody on it.

     Scoped to the next eight weeks. Scanning all 371 days would raise Christmas in August, which
     is true and useless, and a row that is not actionable yet is how a list becomes wallpaper.
     `leaveEmpty()` is still the way out for a day nobody can staff: it writes the deliberate note,
     and a day carrying that note is skipped here for good. */
  const _todayISO = new Date().toISOString().slice(0, 10);
  const _emptyEdge = addDays(_todayISO, 56);
  for (const d of Object.keys(cons.days || {}).sort()) {
    if (d < _todayISO || d > _emptyEdge) continue;
    const rec = cons.days[d];
    if (rec.alert) continue;                                  // already said above, once is enough
    if (String(rec.note || "").includes("left empty deliberately")) continue;
    const bare = ["A","B","C","D","E"].filter(p => !(rec.cur || {})[p]);
    if (!bare.length) continue;
    raw.push({
      kind: "empty", id: "empty:" + d, date: d,
      title: shortDate(d) + " has a pod with nobody on it",
      detail: bare.map(rowLabel).join(" and ") + " — nobody is down to cover "
            + (bare.length === 1 ? "it" : "them") + " on the rota sheet.",
      act: "Open the day", alt: "Leave it empty"
    });
  }
  /* ── THE BOARD HAS STOPPED BEING UPDATED ──────────────────────────────────────────────────────
     Added 11 Aug, and it is the fault that hid all the others. The nightly sync stopped on 8 Aug
     and the board carried on looking completely healthy for three days — same layout, same names,
     no warning anywhere — while quietly showing a three-day-old answer. Ali only found it by
     noticing a wrong name on a pod. Nothing in the product was watching whether the thing that
     feeds it was still running.

     Deliberately NOT acknowledgeable. A stale board is not a note to tick off; it is either true
     or it has gone away, and the only thing that clears it is the sync running again. Something
     you can dismiss while it is still wrong is exactly how three days pass.

     36 hours, not 24: the job runs daily, so a single missed night is a blip and two is a fault.
     Reading `fetched` rather than `savedAt` because it is the WORKBOOK being re-read that matters
     — a save that changed nothing still proves the chain is alive. */
  const fetched = (cons.source || {}).fetched;
  const ageHrs = fetched ? (Date.now() - Date.parse(fetched)) / 3600000 : null;
  if (ageHrs == null || ageHrs > 36) {
    /* HOURS UNTIL TWO FULL DAYS, then days. The first version computed Math.floor(ageHrs / 24),
       which is always at least 1 once the threshold is 36 hours — so the "hours" wording could
       never be reached and 37 hours read "1 day". That understated it at exactly the moment the
       row first appears, which is the moment it most needs to be precise: 36 hours is the point
       where one missed night became two. */
    const days = ageHrs == null ? null : Math.floor(ageHrs / 24);
    const howLong = ageHrs == null ? "" :
      ageHrs < 48 ? Math.round(ageHrs) + " hours" : days + " day" + (days === 1 ? "" : "s");
    raw.push({ kind: "stale", id: "stale:" + (fetched ? String(fetched).slice(0, 10) : "never"),
      title: ageHrs == null ? "This board has never been worked out from the rota"
                            : "This board has not been updated for " + howLong,
      detail: "The nightly job reads the consultant rota workbook and works out the cover. It has "
            + (fetched ? "not done so since " + shortDate(String(fetched).slice(0, 10))
                       : "never done so")
            + ", so what is on screen may not match the rota. Everything below this may be out of date too.",
      act: "Sync now" });
  }

  /* ── A DAY THAT WAS ALREADY CIRCULATED HAS MOVED ──────────────────────────────────────────────
     The swap itself is already done, and rightly — the rota decided it, and stopping a tired
     registrar at 5am to approve it would be friction they click through every time (Ali, 11 Aug:
     "Are you saying it should just swap OC in as its a simple swap wihtout asking - thats better").

     This is not asking permission. It is the telling. People were handed one version and the board
     now shows another, and until today nothing anywhere said so — the allocator only print()ed it
     into a run log nobody opens.

     It offered two actions for most of August — Tell the team, and Put it back, on the argument
     that ticking away "the rota moved under people" without either telling them or undoing it
     helps nobody. In use that was one choice too many for a thing that has already happened:
     Ali, 28 Aug, "all i need is an aknwoldege button". So the row now says what moved and is
     acknowledged, and putting a day back is a decision made on the day rather than a reflex in a
     notification. Nothing about the change itself was ever in question — the swap is already
     done, and rightly. */
  /* ONE ROW PER SYNC RUN — 28 Aug. It was one row per POD, which is how the allocator writes them,
     and the page simply passed that through: a single 11:03 run that moved Fiona Wallace off Pods
     A and B on 6 Sept produced two identical-looking rows with two sets of buttons (Ali: "Why
     duplicate... all i need is an aknwoldege button").

     Grouping by day would have hidden that particular pair, but not the general case — a run that
     touches four days would still leave four rows to tick for one event. So the RUN is the unit,
     keyed on the `at` stamp the allocator already puts on every entry. One thing happened; it is
     acknowledged once. Duplicates stop being something to tidy up and start being impossible.

     Two nestings inside a run: by day, then by the swap itself, so the same person moving off two
     pods reads "Fiona Wallace → Tim Holzmann, Pods A and B" rather than twice over. */
  {
    /* A RUN IS A CLUSTER IN TIME, NOT AN EXACT STAMP. Grouping on `at` as a string looked right
       and was wrong on the first real data it met: the allocator stamps each entry as it writes
       it, so the two 6 Sept pods carried 2026-08-27T15:24:16.147656 and ...147668 — twelve
       microseconds apart, one run, two rows again.

       So entries are sorted and chained: each one joins the run before it if it landed within
       RUN_GAP of it. That is what "the same run" means to a person — a burst of writes — and it
       holds however long a slow run takes, because the gap is measured entry-to-entry rather than
       against the run's start. Two deliberate syncs minutes apart still separate. */
    const RUN_GAP = 5 * 60 * 1000;
    const flat = [];
    for (const d of Object.keys(cons.days || {}).sort()) {
      const ch = (cons.days[d] || {}).pubChanged;
      if (!Array.isArray(ch) || !ch.length) continue;
      ch.forEach((x, n) => flat.push({ d, x, n, t: Date.parse(x.at) }));
    }
    flat.sort((a, b) => (isFinite(a.t) ? a.t : 0) - (isFinite(b.t) ? b.t : 0));
    const runs = {};
    let key = null, lastT = null;
    for (const e of flat) {
      /* An entry with no readable stamp cannot be clustered against anything, so it stands alone
         rather than being swept into whichever run happens to be open. */
      if (!isFinite(e.t)) { key = "unstamped:" + e.d + ":" + e.n; lastT = null; }
      else if (key === null || lastT === null || e.t - lastT > RUN_GAP) { key = String(e.x.at); lastT = e.t; }
      else lastT = e.t;
      const r = runs[key] = runs[key] || { at: e.x.at, days: {}, legacy: [] };
      /* The id this row used to carry, kept so an acknowledgement made under the old scheme is
         still honoured — otherwise everything anybody had already ticked would come back on the
         day this shipped. */
      r.legacy.push("pub:" + e.d + ":" + (e.x.pod || e.n) + ":" + (e.x.at || e.n));
      const day = r.days[e.d] = r.days[e.d] || {};
      const k = (e.x.from || "") + " " + (e.x.to || "");
      (day[k] = day[k] || { from: e.x.from, to: e.x.to, pods: [] }).pods.push(e.x.pod);
    }
    /* "Pods A and B", not "Pod A, Pod B" — the letters are the only part that differs. Anything
       that is not a pod (on call, Fairfield) keeps its own words. */
    const podPhrase = pods => {
      const lab = pods.map(rowLabel);
      if (lab.length === 1) return lab[0];
      const join = a => a.slice(0, -1).join(", ") + " and " + a[a.length - 1];
      return pods.every(p => "ABCDE".includes(p)) ? "Pods " + join(pods.slice()) : join(lab);
    };
    for (const at of Object.keys(runs).sort()) {
      const r = runs[at];
      const days = Object.keys(r.days).sort();
      const when = /^\d{4}-\d{2}-\d{2}/.test(at) ? shortDate(at.slice(0, 10)) : "";
      const clock = /T(\d{2}:\d{2})/.test(at) ? at.match(/T(\d{2}:\d{2})/)[1] : "";
      raw.push({
        kind: "pub", id: "pubrun:" + (at || days.join(",")), date: days[0], legacy: r.legacy,
        title: "Cover changed after publishing" + (when ? " · " + when : "") + (clock ? " " + clock : ""),
        detail: days.length === 1 ? "1 day has moved since it went out"
                                  : days.length + " days have moved since they went out",
        lines: days.map(d => ({
          day: shortDate(d),
          text: Object.keys(r.days[d]).map(k => {
            const g = r.days[d][k];
            return (nameOf(g.from) || "nobody") + " → " + (nameOf(g.to) || "nobody") + ", " + podPhrase(g.pods);
          }).join(" · ")
        })),
        /* One button. "Tell the team" never sent anything — it recorded that a named person said
           they had — so Acknowledge is the same mechanism under an honest name. "Put it back" has
           gone with it (Ali, 28 Aug); pinning a day is a decision to make on the day, not a
           reflex in a notification, and `unpinDay` still releases anything already held. */
        sortLabel: "Acknowledge"
      });
    }
  }
  /* ── A DAY BEING HELD TO THE CIRCULATED VERSION ───────────────────────────────────────────────
     `pinned` is honoured by the allocator, which skips the day entirely — including the alert
     path. Nothing on the page SETS it any more: Put it back went with the Attention rewrite on
     28 Aug, so this row now only ever describes days pinned before that, or by the allocator
     itself. Releasing them still works, which is the half that matters — until 12 Aug nothing on
     the page showed a pinned day and nothing could clear it, so a day put back in August was
     frozen for good and invisible.
     That fails project rule 1 twice over: a functional state you can set from the front end and
     cannot see or clear from it.

     Only worth saying while the day is still ahead — a pinned day in the past is just history. */
  for (const d of Object.keys(cons.days || {}).sort()) {
    if (!(cons.days[d] || {}).pinned || d < _todayISO) continue;
    raw.push({
      kind: "pinned", id: "pinned:" + d, date: d,
      title: shortDate(d) + " is being held to the version that was circulated",
      detail: "The rota moved this day after it went out and somebody put it back, so the nightly "
            + "job leaves it alone. It will stay exactly as it is until it is handed back.",
      act: "Open the day", alt: "Hand it back"
    });
  }

  const miss = unnamed();
  /* Keyed on WHO is unnamed, not on the bare word "unnamed". Sorting the row when two people are
     unnamed must not also silence it when a third turns up next week. */
  if (miss.length)
    raw.push({ kind: "name", id: "unnamed:" + miss.join(","), title: miss.length + " consultant" +
      (miss.length === 1 ? " has" : "s have") + " no name",
      detail: miss.join(" · "), act: "Name them" });
  for (const i of ((cons.source || {}).unknownInitials || []))
    raw.push({ kind: "unknown", id: "unk:" + i,
      title: "An initial on the sheet isn't recognised",
      detail: i + " — the spelling in the workbook needs fixing, or the initials adding to the sync",
      sortLabel: "Got it" });
  for (const n of (cons.notices || []))
    raw.push({ kind: "notice", id: "notice:" + n.id,
      title: n.msg, detail: n.who ? "by " + esc(n.who) + " · " + shortDate(String(n.t).slice(0, 10)) : "",
      sortLabel: "Got it" });
  /* LAST NIGHT'S BACKUP WENT SOMEWHERE ELSE. A file open in Excel is locked against every write
     API there is, so the nightly job writes beside it rather than losing the night (Ali, 8 Aug:
     "thats an issue" — a backup that only works when nobody is looking at the folder is not one).
     But a spare copy nobody is told about is one tidy-up away from being no copy at all, so it is
     said here. Deliberately NOT acknowledgeable: the flag is removed by the next night that can
     write the usual name, which is to say by the problem going away. Something you can tick off
     while it is still true is how a folder ends up with nine files and no one knowing which is
     the rota.
     It reads this off the RESIDENT store, which is where the backup job stamps it and which this
     page already holds — nothing new is fetched, and nothing is written back. */
  const sp = (data || {}).backupSpare;
  if (sp && sp.name)
    raw.push({ kind: "backup", id: "backup:" + sp.name,
      title: "Last night's backup could not replace the usual file",
      detail: "It was written beside it as " + sp.name + ". The usual copy is untouched but is now "
            + "a day older than it looks. Close it in Excel and tonight's run will replace it." });

  /* ── SOMETHING THAT IS NOT COVER'S IS IN COVER'S FILE ─────────────────────────────────────────
     strayPaperwork() has existed since the 4 Aug carve and was called by nothing, so the guard
     CLAUDE.md leans on — "if a key outside the Cover list turns up in the Cover store, say so" —
     was a safety net attached to nothing (found 12 Aug). The cost of it being silent is not
     hypothetical: `admins` meaning two different things is what killed the nightly sync for three
     days, and the page could have named the collision the morning it appeared.

     It SAYS SO and does nothing else. The page never deletes what it does not understand — there
     is no undo for a job plan — so this is a row, not a tidy-up. A live condition: it comes back
     while the key is still there, and goes when the carve reaches it. */
  const stray = strayPaperwork();
  if (stray.length)
    raw.push({ kind: "stray", id: "stray:" + stray.slice().sort().join(","),
      title: "The cover file is holding something that isn't cover's",
      detail: stray.join(" · ") + " — this file should hold the allocation and nothing else. "
            + "Nothing has been changed or removed; it needs carving out deliberately, with a backup." });

  /* THE SORTED PASS. Everything above says what is true; this says what somebody has already dealt
     with. Kept as one place at the end rather than a check inside each push, because the old code
     did it three different ways in three different rows and that is how the stale board ended up
     with no way out at all. */
  const now = Date.now();
  return raw.map(it => {
    /* A run row falls back to the ids its changes used to carry: if every one of them was already
       acknowledged under the old per-pod scheme, the run has been dealt with and must not come
       back just because the page now counts it differently. The newest of those stamps is the one
       that decides, since it is the last time somebody looked. */
    let s = sortedOf(cons, it.id);
    if (!s && it.legacy && it.legacy.length) {
      const all = it.legacy.map(id => sortedOf(cons, id));
      if (all.every(Boolean)) s = all.sort((a, b) => String(b.t).localeCompare(String(a.t)))[0];
    }
    if (!s) return it;
    const ageDays = (now - Date.parse(s.t)) / 86400000;
    if (!(ageDays >= 0)) return it;                    // unparseable stamp: treat as not sorted
    if (ageDays < SORTED_GREY_DAYS)
      return Object.assign({}, it, { done: true, doneBy: s.who, doneAt: s.t });
    /* Three days up. A live condition that is still true comes back and counts again; a record of
       something that happened stays dealt with. */
    return LIVE_KINDS.includes(it.kind) ? it : null;
  }).filter(Boolean);
}
/* The badge counts what nobody has dealt with. A greyed row is still on the page — that is the
   point of it — but it must not keep the number up, or pressing Sorted would appear to do nothing. */
function attnCount(){ return attnItems().filter(it => !it.done).length; }
function paintAttnBadge(){
  const n = attnCount();
  /* Both shields — the rail's and the phone's. Only ever one of them is on screen, but painting
     whichever exists is one line and means the phone cannot end up with a silent badge. */
  for (const id of ["#attnBadge", "#attnBadgeM"]) {
    const b = $(id); if (!b) continue;
    b.textContent = n ? String(n) : "";
    b.style.display = n ? "" : "none";
  }
}
function renderAttn(){
  const box = $("#attnBox"); if (!box) return;
  const items = attnItems();
  if (!items.length) {
    box.innerHTML = "<div class='card' style='text-align:center;padding:2.2rem 1rem'>" +
      "<span style='color:var(--muted);font-size:.9rem'>Nothing needs you</span></div>";
    paintAttnBadge(); return;
  }
  /* A dealt-with row keeps its title and loses its buttons: there is nothing left to press, and
     leaving a live Sorted button on a sorted row invites people to wonder whether it took. */
  box.innerHTML = "<div class='card'>" + items.map(it =>
    "<div class='attnrow" + (it.done ? " done" : "") + "' data-id='" + esc(it.id) + "'>" +
      "<span class='dot'></span>" +
      "<div class='txt'><b>" + esc(it.title) + "</b>" +
        (it.detail ? "<div class='sub'>" + esc(it.detail) + "</div>" : "") +
        /* The days inside a run, one per line: the date holds a fixed column so the eye runs down
           it, and the change sits beside it. Only rows that carry `lines` grow — every other kind
           of row is untouched. */
        ((it.lines || []).length
          ? "<div class='attnlines'>" + it.lines.map(l =>
              "<div><span>" + esc(l.day) + "</span>" + esc(l.text) + "</div>").join("") + "</div>"
          : "") + "</div>" +
      (it.done
        ? "<span class='who'>" + esc(it.doneBy && it.doneBy !== "?" ? "Sorted by " + it.doneBy : "Sorted") + "</span>"
        : (it.act ? "<button class='btn sec attndo'>" + esc(it.act) + "</button>" : "") +
          (it.alt ? "<button class='btn sec attnalt'>" + esc(it.alt) + "</button>" : "") +
          "<button class='btn sec attnsort'>" + esc(it.sortLabel || "Sorted") + "</button>") +
    "</div>").join("") + "</div>";
  box.querySelectorAll(".attnrow").forEach(row => {
    const id = row.dataset.id, it = items.find(x => x.id === id);
    if (!it) return;
    const doBtn = row.querySelector(".attndo"), altBtn = row.querySelector(".attnalt"),
          sortBtn = row.querySelector(".attnsort");
    /* `act` now only ever NAVIGATES — it takes you to where the thing gets fixed. Marking a row
       dealt with is the Sorted button's job on every row without exception, which is what makes
       the rule explainable in one sentence. */
    if (doBtn) doBtn.onclick = () => {
      if (it.kind === "day" || it.kind === "empty" || it.kind === "pinned") {
        aheadWeek = mondayOf(it.date); showTab("ahead");
      }
      /* A stale board's one useful action is to make it not stale. Setup already owns Sync now —
         going there rather than duplicating the button keeps one way to do it. */
      else if (it.kind === "stale") showTab("setup");
      else showTab("staff");
    };
    if (altBtn) altBtn.onclick = () => {
      if (it.kind === "pinned") unpinDay(it.date);
      else leaveEmpty(it.date);
    };
    /* Acknowledge sends nothing — there is no list of who was told, and inventing one would be a
       worse lie than saying nothing. What it records is that a named person saw it. Same mechanism
       as every other Sorted, and since 28 Aug an honest word on the button: it used to say "Tell
       the team", which promised a message this page has never had any way to send. */
    if (sortBtn) sortBtn.onclick = () => markSorted(id);
  });
  paintAttnBadge();
}
/* Marking a row sorted is itself a change to the store, so it is saved and logged like any other.
   Kept as a record against the row rather than by deleting the thing itself, because the
   underlying fact — the sheet has an initial nobody recognises — is still true and must not be
   erased by somebody reading it.

   It fails LOUDLY. The old version bailed silently when there was no save key, so on a page that
   could not write, every button on this list did nothing at all and said nothing about why. */
async function markSorted(id){
  const cons = CR(); if (!cons) return;
  if (!canSave()) { toast("Cover store not connected — nothing was saved"); return; }
  ensureWho(async () => {
    cons.sorted = cons.sorted || {};
    cons.sorted[id] = { t: new Date().toISOString(), who: localStorage.getItem("consEditor") || "?" };
    cdata.savedBy = localStorage.getItem("consEditor") || "?";
    state("saving");
    try { if (!await saveCover()) return; state("saved"); }
    catch(e){ state("unsaved"); toast("Save failed — try again"); return; }
    renderAttn();
  });
}
/* The escape hatch for a pod there is nobody to cover. Not a dismiss: it records that a named
   person decided the pod stands empty, so the day shows a deliberate blank rather than an
   accident, and the change log says who decided it. */
async function leaveEmpty(date){
  const cons = CR(); if (!cons || !cons.days[date] || !canSave()) return;
  ensureWho(async () => {
    const rec = cons.days[date];
    delete rec.alert;
    rec.note = (rec.note ? rec.note + " · " : "") + "pod left empty deliberately";
    clog("Pod left empty on " + shortDate(date) + " — nobody available", "manual", date, "");
    cdata.savedBy = localStorage.getItem("consEditor") || "?";
    state("saving");
    try { if (!await saveCover()) return; state("saved"); toast("Recorded"); }
    catch(e){ state("unsaved"); toast("Save failed — try again"); return; }
    renderAttn(); renderAll();
  });
}

/* PUT IT BACK. The rota moved a day that had already gone out; this restores what people were
   actually given and tells the allocator to stop moving it.

   `cur` only — never `auto`. The two are a deliberate pair: `auto` is what the algorithm thinks
   and `cur` is what the unit is working to, and the whole ownership model depends on a human
   decision changing the second without pretending the first never happened. Overwriting `auto`
   here would erase the evidence that the rota and the board now disagree, which is precisely the
   fact somebody may need next week.

   `pinned` is what stops tonight's run undoing this. Without it the sync would re-apply the same
   swap tomorrow morning and the item would reappear, which is how a board teaches people to
   ignore it.

   NOTHING CALLS THIS SINCE 28 AUG. The Attention row that used to is now one Acknowledge button,
   so this is the last implementation of "hold a day to the version people were given" and it is
   currently unreachable. Kept rather than deleted, deliberately (house rule: no deleting without
   asking, and the capability is a reasonable one to want back) — but kept somewhere honest about
   it. If it comes back it belongs on the DAY, next to the held pill that already shows the state,
   rather than on a notification. If it is ever truly not wanted, `unpinDay` and the `pinned` row
   in rawAttention go with it. */
async function putItBack(date, pod, id){
  const cons = CR(); if (!cons || !cons.days[date]) return;
  if (!canSave()) { toast("Cover store not connected — nothing was saved"); return; }
  const rec = cons.days[date];
  const ch = rec.pubChanged || [];
  /* ONE POD, not the whole day. Each row on Attention is now one pod's change, so putting one back
     must not silently undo a second change to the same day that somebody else may still be
     deciding about. Falls back to the whole day if the row predates the per-pod ids. */
  const mine = pod ? ch.filter(x => x.pod === pod) : ch;
  if (!mine.length) return;
  ensureWho(async () => {
    for (const x of mine) {
      if (rec.cur) rec.cur[x.pod] = x.from;
      clog(rowLabel(x.pod) + " put back to " + (nameOf(x.from) || "nobody") +
           " as circulated", "manual", date, "",
           { act: "set", subj: rowLabel(x.pod), facet: "consultant", from: x.to, to: x.from });
    }
    rec.pinned = true;
    const left = ch.filter(x => mine.indexOf(x) === -1);
    if (left.length) rec.pubChanged = left; else delete rec.pubChanged;
    /* The row this came from is gone either way — putting it back IS dealing with it — so it is
       recorded as sorted too. Without this the same row returns the moment the array still holds
       a sibling entry and the list re-derives. */
    if (id) { cons.sorted = cons.sorted || {};
      cons.sorted[id] = { t: new Date().toISOString(), who: localStorage.getItem("consEditor") || "?" }; }
    cdata.savedBy = localStorage.getItem("consEditor") || "?";
    state("saving");
    try { if (!await saveCover()) return; state("saved"); toast("Put back"); }
    catch(e){ state("unsaved"); toast("Save failed — try again"); return; }
    renderAttn(); renderAll();
  });
}

/* HAND IT BACK. The other half of Put it back, and the reason project rule 1 was being broken:
   `pinned` could be set from the page and cleared by nothing, anywhere, ever. A day put back in
   August stayed frozen for good, and since the allocator skips a pinned day completely — including
   the path that raises "this day has a pod with nobody on it" — a pinned day whose consultant
   later came off the rota would have shown a name that was not coming, silently.

   Clearing it hands the day back to tonight's run, which will re-derive it from the workbook like
   any other. `cur` is left exactly as it is: the board keeps showing what the unit is working to
   until the algorithm has actually said otherwise. */
async function unpinDay(date){
  const cons = CR(); if (!cons || !cons.days[date]) return;
  if (!canSave()) { toast("Cover store not connected — nothing was saved"); return; }
  const rec = cons.days[date];
  if (!rec.pinned) return;
  ensureWho(async () => {
    delete rec.pinned;
    clog(shortDate(date) + " handed back to the rota — it is no longer held to the circulated version",
         "manual", date, "");
    cdata.savedBy = localStorage.getItem("consEditor") || "?";
    state("saving");
    try { if (!await saveCover()) return; state("saved"); toast("Handed back"); }
    catch(e){ state("unsaved"); toast("Save failed — try again"); return; }
    renderAttn(); renderAll();
  });
}

/* Naming somebody is a change to the cover like any other: it is logged, under the name of whoever
   is editing, and it is saved to the store rather than held in the browser. Deliberately NOT
   guarded by anything beyond the shield — putting a name to a set of initials is not a decision
   anybody needs protecting from, and making it hard is how it stays undone. */
async function saveName(ini, name){
  if (!ini) return;
  if (!name) { toast("Type a name first"); return; }
  if (!canSave()) { toast("Cover store not connected — nothing was saved"); return; }
  ensureWho(async () => {
    const cons = CR(); if (!cons) return;
    cons.names = cons.names || {};
    const was = cons.names[ini];
    if (was === name) return;
    cons.names[ini] = name;
    clog((was ? "Renamed " + ini + ": " + was + " → " + name : ini + " named as " + name),
         "manual", null, " (Setup)");
    cdata.savedBy = localStorage.getItem("consEditor") || "?";
    state("saving");
    try { if (!await saveCover()) return; state("saved"); toast(ini + " is now " + name); }
    catch(e){ state("unsaved"); toast("Save failed — try again"); }
    renderAll();
  });
}

function consList(){
  /* Names added on Setup belong in this list too, or a newly-named consultant could be allocated
     and shown on the board but not be pickable as the person who edited something. */
  const cons = CR() || {};
  const all = new Set([...Object.keys(cons.map || {}), ...Object.keys(cons.names || {})]);
  return [...all].filter(i => !["FMCN","NET","AC","SF"].includes(i)).sort((a,b) => nameOf(a).localeCompare(nameOf(b)));
}
function consSelect(cls, selected, blankLabel){
  const s = document.createElement("select"); s.className = cls;
  const b = document.createElement("option"); b.value = ""; b.textContent = blankLabel || "—"; s.append(b);
  for (const i of consList()){ const o = document.createElement("option"); o.value = i; o.textContent = i + " — " + nameOf(i); if (i === selected) o.selected = true; s.append(o); }
  if (selected && !consList().includes(selected)){ const o = document.createElement("option"); o.value = selected; o.textContent = selected; o.selected = true; s.append(o); }
  return s;
}
function whoBtn(){
  const w = localStorage.getItem("consEditor");
  $("#btnWho").textContent = w ? nameOf(w) : "Who's editing?";
  $("#btnWho").title = w ? "Changes are logged as " + nameOf(w) + " — click to change" : "Click to say who you are";
}
/* Who's editing. A typeable list of CONSULTANTS ONLY — no residents, because a resident cannot
   put their name to a change on this page. It was a plain dropdown of forty names; typing three
   letters is faster than scrolling on a phone, and a datalist keeps the list there for anyone
   who would rather scroll. The name is what the change log records; the password is what
   actually gates editing, and they are deliberately different questions. */
function pickWho(cb){
  const ov = document.createElement("div"); ov.id = "whoOverlay";
  const box = document.createElement("div"); box.className = "box";
  const t = document.createElement("b"); t.textContent = "Who's editing?";
  const sub = document.createElement("div");
  sub.style.cssText = "font-size:.8rem;color:var(--muted);margin:.2rem 0 .6rem";
  sub.textContent = "Start typing your name. Changes are logged under it.";

  const list = document.createElement("datalist"); list.id = "consNames";
  const names = consList();
  for (const i of names){ const o = document.createElement("option"); o.value = nameOf(i); list.append(o); }

  const inp = document.createElement("input");
  inp.type = "text"; inp.setAttribute("list", "consNames"); inp.autocomplete = "off";
  inp.style.cssText = "width:100%;margin-bottom:.6rem";
  const prev = localStorage.getItem("consEditor");
  inp.placeholder = prev ? "Last time: " + nameOf(prev) : "Start typing…";

  const msg = document.createElement("div");
  msg.style.cssText = "font-size:.78rem;color:var(--red);min-height:1em;margin-bottom:.4rem";

  const ok = document.createElement("button"); ok.className = "btn"; ok.style.width = "100%";
  ok.textContent = "That's me";
  /* Match on the typed name OR the initials, and case-insensitively, because people type "MG"
     as readily as "Murad Ghrew" and neither is wrong. What gets STORED is always the initials,
     so the log stays comparable with the rota sheet. */
  const resolve = v => {
    const q = String(v || "").trim().toLowerCase();
    if (!q) return "";
    return names.find(i => i.toLowerCase() === q)
        || names.find(i => nameOf(i).toLowerCase() === q)
        || names.find(i => nameOf(i).toLowerCase().startsWith(q))
        || "";
  };
  ok.onclick = () => {
    const ini = resolve(inp.value);
    if (!ini){ msg.textContent = names.length ? "Pick a name from the list." : "No consultants loaded yet."; return; }
    localStorage.setItem("consEditor", ini);
    whoBtn(); ov.remove(); if (cb) cb(ini);
  };
  inp.onkeydown = e => { if (e.key === "Enter") ok.click(); };
  ov.onclick = e => { if (e.target === ov) ov.remove(); };
  box.append(t, sub, list, inp, msg, ok); ov.append(box); document.body.append(ov);
  setTimeout(() => inp.focus(), 0);
}
$("#btnWho").onclick = () => pickWho(() => renderAll());

function juniorsFor(dateISO){
  const wk = (data.weeks || {})[mondayOf(dateISO)];
  if (!wk) return null;
  const di = (new Date(dateISO + "T12:00:00").getDay() + 6) % 7;
  const day = wk.days && wk.days[di];
  if (!day) return null;
  /* Surnames alone told a consultant nothing. Carry the same facts the resident board shows —
     shift, phone, airway, shadowing — so both pages describe a person identically. */
  const rec = (id, opts) => {
    const st = (data.staff || []).find(x => x.id === id);
    if (!st) return null;
    return { id, name: st.name.split(" ").pop(), airway: !!st.airway,
             shift: (opts && opts.shift) || "",
             phone: !!(opts && opts.phone),
             shadow: (day.shadow || []).includes(id) };
  };
  const out = { pods: {}, night: [] };
  for (const p of ["A","B","C","D","E"]) {
    out.pods[p] = (((day.pods || {})[p] || {}).assign || [])
      .map(a => rec(a.id, { shift: a.shift, phone: day.phone === a.id })).filter(Boolean);
  }
  out.night = [].concat((day.night || {}).AB || [], (day.night || {}).CDE || [], (day.night || {}).E || [])
    .map(id => rec(id, { shift: "N", phone: (day.night || {}).phone === id })).filter(Boolean);
  return out;
}

/* One resident per row, in a pill, with the same badges the resident board uses. Styling lives in
   core.css so both pages draw a person the same way. */
const SVG_PHONE = '<svg viewBox="0 0 24 24" width="9" height="9" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M6 3h3l2 5-2.5 1.5a12 12 0 006 6L16 13l5 2v3a2 2 0 01-2 2A16 16 0 014 5a2 2 0 012-2z"/></svg>';

function resPill(r){
